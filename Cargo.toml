[workspace]
members = [
    "deposits-protocol",
    "deposits-core",
    "deposits-node",
    "deposits-tools",
]
resolver = "2"

# Release profile with debug info for flamegraphs
[profile.release]
debug = 1              # line tables only (minimal size increase, good flamegraph symbols)

# Use nostr-sdk-performance fork with skip-verification and skip-database by default
[patch.crates-io]
nostr-relay-pool = { path = "nostr-sdk-performance/nostr-relay-pool" }
