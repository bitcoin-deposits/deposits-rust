<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Update · Deposits Explorer</title>
  <style>
    :root {
      --bg:        #11131f;
      --bg-elev:   #181c2c;
      --bg-card:   #1d2237;
      --bg-card-h: #232943;
      --border:    #2a304a;
      --border-strong: #3a4263;
      --fg:        #e7e9f0;
      --fg-strong: #ffffff;
      --fg-muted:  #8d96b3;
      --fg-dim:    #5b6386;
      --accent:    #f7931a;
      --green:     #4cae5a;
      --red:       #d9534f;
      --yellow:    #f0ad4e;
      --blue:      #5b8def;
      --purple:    #b58cf0;
      --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body { margin: 0; color: var(--fg); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }

    .topnav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.25rem;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: baseline; gap: 0.45rem; font-weight: 600; font-size: 1.05rem; }
    .brand .logo { color: var(--accent); font-size: 1.25rem; line-height: 1; }
    .brand .name { color: var(--fg-strong); }
    .brand .sub { color: var(--fg-muted); font-weight: 400; font-size: 0.85rem; }
    .nav-links { display: flex; gap: 1rem; font-size: 0.9rem; color: var(--fg-muted); }
    .nav-links a.active { color: var(--accent); }

    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

    h1.section-title {
      font-size: 0.78rem; font-weight: 600;
      color: var(--fg-muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 1.5rem 0 0.85rem;
    }
    h1.section-title:first-child { margin-top: 0; }

    /* hero */
    .hero {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .hero .lbl {
      color: var(--fg-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.25rem;
    }
    .hero .id {
      font: 0.95rem var(--mono);
      color: var(--accent);
      word-break: break-all;
      letter-spacing: -0.01em;
    }
    .hero .meta {
      display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
      margin-top: 0.55rem;
      color: var(--fg-muted);
      font-size: 0.85rem;
    }

    /* generic card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.95rem 1.1rem;
      margin-bottom: 1rem;
    }
    .card h3 {
      font-size: 0.72rem; font-weight: 600;
      color: var(--fg-muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 0 0 0.7rem;
    }

    /* key/value rows */
    .kv {
      display: grid;
      grid-template-columns: 8.5rem 1fr;
      gap: 0.4rem 1rem;
      font-size: 0.85rem;
      align-items: baseline;
    }
    .kv dt {
      color: var(--fg-muted);
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      padding-top: 0.1rem;
    }
    .kv dd {
      margin: 0;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .kv dd.mono { font-family: var(--mono); font-size: 0.82rem; color: var(--fg-strong); }
    .kv dd.muted { color: var(--fg-muted); }
    .kv dd .ann {
      display: inline-block;
      color: var(--fg-dim);
      font-family: var(--sans);
      font-size: 0.78rem;
      margin-left: 0.6rem;
    }

    /* tag list */
    table.tags { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .tags td { padding: 0.3rem 0.6rem 0.3rem 0; vertical-align: top; }
    .tags td.k {
      color: var(--accent);
      font: 0.78rem var(--mono);
      width: 5rem;
    }
    .tags td.v {
      font-family: var(--mono); color: var(--fg);
      word-break: break-all;
    }

    /* TLV field rows */
    table.tlv { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .tlv th, .tlv td {
      text-align: left;
      padding: 0.45rem 0.6rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .tlv tr:last-child td { border-bottom: none; }
    .tlv th {
      color: var(--fg-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
    }
    .tlv td.tag-id { color: var(--fg-dim); font-family: var(--mono); width: 3.5rem; font-variant-numeric: tabular-nums; }
    .tlv td.name   { color: var(--fg); font-weight: 600; width: 12rem; }
    .tlv td.len    { color: var(--fg-muted); width: 4rem; font-variant-numeric: tabular-nums; }
    .tlv td.value  { color: var(--fg-strong); font-family: var(--mono); word-break: break-all; }
    .tlv td.value .interp {
      display: block;
      margin-top: 0.2rem;
      color: var(--fg-muted);
      font-family: var(--sans);
      font-size: 0.78rem;
    }

    /* parsed descriptor tree (decoded sub-field of an op) */
    .desc-tree { font-family: var(--mono); font-size: 0.82rem; }
    .desc-row { line-height: 1.5; white-space: nowrap; }
    .desc-name { font-weight: 600; color: var(--accent); }
    .desc-k { color: var(--fg-muted); margin-right: 0.4rem; }
    .desc-v { color: var(--fg-strong); margin-left: 0.4rem; word-break: break-all; }

    /* hex dump */
    pre.hexdump {
      margin: 0;
      padding: 0.85rem 1rem;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 4px;
      font: 0.78rem/1.45 var(--mono);
      color: var(--fg);
      overflow-x: auto;
      white-space: pre;
    }
    pre.hexdump .off { color: var(--fg-dim); }
    pre.hexdump .ascii { color: var(--fg-muted); }
    .hex-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
      font-size: 0.82rem;
      color: var(--fg-muted);
    }
    .hex-meta b { color: var(--fg); }

    /* op pill (re-used) */
    .op {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 3px;
      font: 600 0.75rem var(--mono);
      letter-spacing: -0.01em;
      vertical-align: middle;
    }
    .op.credit    { background: rgba(76, 174, 90, 0.15); color: var(--green); }
    .op.lock      { background: rgba(240, 173, 78, 0.15); color: var(--yellow); }
    .op.deposit   { background: rgba(91, 141, 239, 0.15); color: var(--blue); }
    .op.quorum    { background: rgba(181, 140, 240, 0.15); color: var(--purple); }
    .op.dispute   { background: rgba(217, 83, 79, 0.18); color: var(--red); }
    .op.transfer  { background: rgba(91, 141, 239, 0.15); color: var(--blue); }
    .op.unknown   { background: var(--border); color: var(--fg-muted); }

    /* check pills */
    .check { display: inline-block; padding: 0.05rem 0.4rem; border-radius: 3px; font-size: 0.7rem; font-weight: 600; }
    .check.ok  { background: rgba(76, 174, 90, 0.18); color: var(--green); }
    .check.bad { background: rgba(217, 83, 79, 0.18); color: var(--red); }

    .empty {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      color: var(--fg-muted);
    }
    .empty.err { color: var(--red); border-color: rgba(217, 83, 79, 0.4); }
    .loading { color: var(--fg-muted); padding: 0.5rem 0; }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--fg-dim);
      font-size: 0.78rem;
      text-align: center;
    }
    footer .mono { font-family: var(--mono); color: var(--fg-muted); }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">
      <span class="logo">⟁</span>
      <span class="name">deposits</span>
      <span class="sub">explorer</span>
    </div>
    <div class="nav-links">
      <a href="/explorer">overview</a>
      <a href="/ledger">ledger</a>
      <a href="/deposit">deposit</a>
    </div>
  </nav>
  <script>
    // On a `<bech32-or-hex>.ledger.<basedomain>` subdomain, any nav link
    // that leaves the per-ledger view (today just /explorer; whatever
    // else we add later) should hop off the ledger subdomain to
    // `explorer.<basedomain>`. The host-aware root route would otherwise
    // keep serving the per-ledger view since the subdomain still matches.
    (function () {
      const host = window.location.hostname;
      const m = host.match(/^[^.]+\.ledger\.(.+)$/);
      if (!m) return;
      const base = m[1];
      document.querySelectorAll('.nav-links a[href^="/explorer"]').forEach(a => {
        a.href = `${window.location.protocol}//explorer.${base}/`;
      });
    })();
  </script>

  <main>
    <div class="hero">
      <div class="lbl">ledger update · nostr event</div>
      <div class="id" id="event-id">…</div>
      <div class="meta" id="hero-meta"></div>
    </div>

    <div id="body"><div class="loading">querying relay…</div></div>

    <footer>
      data via nostr relay <span class="mono" id="relay-url"></span>
    </footer>
  </main>

<script type="module">
import { OP_NAMES, FIELD_NAMES } from './tlv-catalog.js';
import { schnorr } from './vendor/noble-curves-secp256k1.js';
import {
  getParam, bytesToHex, b64ToBytes, nostrFetch, parseTlv,
  computeContentHash, fetchCosignerLedgerMap, findEventByContentHash,
  renderDescriptorRows,
} from './shared.js';

// ── page-specific helpers (most are imported from ./shared.js) ──

const RELAY_URL =
  getParam('relay')
  || document.querySelector('meta[name=relay]')?.content
  || 'wss://relay.bitcoindeposits.net';
document.getElementById('relay-url').textContent = RELAY_URL;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

async function sha256(buf) {
  const h = await crypto.subtle.digest('SHA-256', buf);
  return new Uint8Array(h);
}

function utf8(s) { return new TextEncoder().encode(s); }

// ── interpret a TLV value ──────────────────────────────────────────
//
// Multiple shapes are plausible for a given byte string (a 32-byte
// blob could be a hash or a pubkey or just bytes). We pick by length
// and tag context but always show the raw hex too.
function interpretValue(rec) {
  const { value, type } = rec;
  const len = value.length;
  const hex = bytesToHex(value);

  // Single-byte discriminant — common for op-type fields
  if (len === 1) return { hex, ann: `u8 = ${value[0]}` };
  if (len === 2) return { hex, ann: `u16 = ${(value[0] << 8) | value[1]}` };
  if (len === 4) {
    const u32 = ((value[0] << 24) | (value[1] << 16) | (value[2] << 8) | value[3]) >>> 0;
    return { hex, ann: `u32 = ${u32}` };
  }
  if (len === 8) {
    let u64 = 0n;
    for (let i = 0; i < 8; i++) u64 = (u64 << 8n) | BigInt(value[i]);
    return { hex, ann: `u64 = ${u64.toString()}` };
  }
  if (len === 16) return { hex, ann: '16 bytes (deposit_id?)' };
  if (len === 32) return { hex, ann: '32 bytes (hash / xonly pubkey?)' };
  if (len === 33) return { hex, ann: '33 bytes (compressed pubkey?)' };
  if (len === 64) return { hex, ann: '64 bytes (signature?)' };

  // ASCII-ish? Show as text too.
  if (value.every(b => b >= 0x20 && b < 0x7f)) {
    try { return { hex, ann: `string (${len}B) = ${JSON.stringify(new TextDecoder().decode(value))}` }; }
    catch { return { hex, ann: `${len} bytes` }; }
  }
  return { hex, ann: `${len} bytes` };
}

// ── pretty hex dump ────────────────────────────────────────────────
function hexDump(buf) {
  const lines = [];
  for (let off = 0; off < buf.length; off += 16) {
    const slice = buf.slice(off, off + 16);
    const hex = [...slice].map(b => b.toString(16).padStart(2, '0')).join(' ');
    const padded = hex.padEnd(16 * 3 - 1, ' ');
    const ascii = [...slice].map(b => (b >= 0x20 && b < 0x7f) ? String.fromCharCode(b) : '·').join('');
    const offHex = off.toString(16).padStart(6, '0');
    lines.push(
      `<span class="off">${offHex}</span>  ${escapeHtml(padded)}  <span class="ascii">${escapeHtml(ascii)}</span>`
    );
  }
  return lines.join('\n');
}

// ── op-name category for color coding ──────────────────────────────
function opCategory(name) {
  if (!name) return 'unknown';
  if (name.startsWith('Dispute')) return 'dispute';
  if (name.startsWith('Quorum') || name.startsWith('Ledger')) return 'quorum';
  if (name.startsWith('Transfer')) return 'transfer';
  if (name.startsWith('Deposit') || name === 'FeeChange' || name === 'FeeCollect') return 'deposit';
  if (name.endsWith('Credit') || name === 'InvoiceFulfill' || name === 'OnchainFulfill') return 'credit';
  if (name.endsWith('Lock') || name.endsWith('Fail')) return 'lock';
  return 'unknown';
}

// ── Nostr event-id verification (NIP-01 canonical hash) ───────────
//
// id = sha256(JSON.stringify([0, pubkey, created_at, kind, tags, content]))
// using the canonical separator-free encoding.
async function verifyEventId(event) {
  const canonical = JSON.stringify([
    0, event.pubkey, event.created_at, event.kind, event.tags, event.content
  ]);
  const computed = bytesToHex(await sha256(utf8(canonical)));
  return { ok: computed === event.id, computed };
}

// ── BIP-340 Schnorr signature verification (Nostr event sig) ──────
//
// `sig = schnorr(event_id_bytes, x-only_pubkey)`. The Nostr event's
// `pubkey` field is already x-only hex.
function hexToBytesU8(s) {
  const out = new Uint8Array(s.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(s.slice(i * 2, i * 2 + 2), 16);
  return out;
}
function verifyEventSig(event) {
  try {
    const sig = hexToBytesU8(event.sig);
    const msg = hexToBytesU8(event.id);
    const pk  = hexToBytesU8(event.pubkey);
    return schnorr.verify(sig, msg, pk);
  } catch {
    return false;
  }
}

// ── render ────────────────────────────────────────────────────────

function renderEventCard(event, idCheck, sigOk) {
  const tagsHtml = event.tags.length === 0
    ? '<div class="muted">(none)</div>'
    : `<table class="tags">${event.tags.map(t => `
        <tr>
          <td class="k">${escapeHtml(t[0])}</td>
          <td class="v">${escapeHtml(t.slice(1).join(' '))}</td>
        </tr>`).join('')}</table>`;
  const idBadge = idCheck.ok
    ? '<span class="check ok">id valid</span>'
    : '<span class="check bad">id mismatch (computed ' + escapeHtml(idCheck.computed) + ')</span>';
  const sigBadge = sigOk
    ? '<span class="check ok">BIP-340 sig valid</span>'
    : '<span class="check bad">BIP-340 sig invalid</span>';
  return `
    <div class="card">
      <h3>nostr event</h3>
      <dl class="kv">
        <dt>kind</dt><dd>${event.kind} <span class="ann">(${event.kind === 9100 ? 'KIND_LEDGER_UPDATE' : event.kind === 39100 ? 'KIND_LEDGER_ADVERTISE' : 'other'})</span></dd>
        <dt>created at</dt><dd>${new Date(event.created_at * 1000).toISOString().replace('T', ' ').slice(0, 19)} UTC <span class="ann">(${event.created_at})</span></dd>
        <dt>pubkey</dt><dd class="mono">${escapeHtml(event.pubkey)}</dd>
        <dt>signature</dt><dd class="mono">${escapeHtml(event.sig)} <span class="ann">${sigBadge}</span></dd>
        <dt>id</dt><dd class="mono">${escapeHtml(event.id)} <span class="ann">${idBadge}</span></dd>
        <dt>tags</dt><dd>${tagsHtml}</dd>
        <dt>content</dt><dd class="muted">${event.content.length} chars (base64 — decoded below)</dd>
      </dl>
    </div>`;
}

function renderUpdateFields(records, hashOk) {
  // Map deposits-protocol's outer SignedLedgerUpdate tags to friendly names.
  const SIGNED_UPDATE_NAMES = {
    0: 'operator_id',
    2: 'ledger_id',
    4: 'sequence_number',
    6: 'previous_hash',
    8: 'message',
    10: 'block_height',
    12: 'block_hash',
    14: 'cosign_signature',  // legacy single
    16: 'member_ledger_hash', // legacy single
    18: 'cosignature',        // legacy alt
    20: 'operator_signature',
    22: 'cosignatures',       // multi-cosig (length-prefixed entries)
  };
  return `
    <div class="card">
      <h3>signed ledger update <span class="ann" style="font-family:var(--sans);font-size:0.78rem;color:var(--fg-muted);">${hashOk.ok ? '<span class="check ok">content_hash valid</span>' : '<span class="check bad">content_hash mismatch</span>'}</span></h3>
      <table class="tlv">
        <thead><tr><th>tag</th><th>name</th><th>len</th><th>value</th></tr></thead>
        <tbody>
          ${records.map(r => {
            const interp = interpretValue(r);
            const name = SIGNED_UPDATE_NAMES[r.type] || FIELD_NAMES[r.type] || `tag_${r.type}`;
            // Tags with their own breakdown sections get a small
            // accent-colored link in the interp line; the hex itself
            // stays plain so the value column is uniform across rows.
            //   tag 8  → message (op + fields)
            //   tag 22 → cosignatures (per-entry pk/sig/member_hash)
            let interpExtra = '';
            if (r.type === 8) {
              interpExtra = ' — see <a href="#message" style="color:var(--accent);">decoded below</a>';
            } else if (r.type === 22) {
              interpExtra = ' — see <a href="#cosignatures" style="color:var(--accent);">per-cosigner breakdown below</a>';
            }
            const valueCell = `${escapeHtml(interp.hex)}<span class="interp">${escapeHtml(interp.ann)}${interpExtra}</span>`;
            return `<tr>
              <td class="tag-id">${r.type}</td>
              <td class="name">${escapeHtml(name)}</td>
              <td class="len">${r.value.length}</td>
              <td class="value">${valueCell}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

// Parse the multi-cosig (tag 22) blob: each entry is a 2-byte
// big-endian length prefix followed by `pk(33) || sig(64) || mh(32)`
// = 129 bytes. Mirrors the wallet's decoder (deposits-web/wallet/index.html).
function parseCosignatures(buf) {
  const entries = [];
  let off = 0;
  while (off + 2 <= buf.length) {
    const entryLen = (buf[off] << 8) | buf[off + 1];
    off += 2;
    if (entryLen < 129 || off + entryLen > buf.length) break;
    entries.push({
      pubkey: buf.slice(off, off + 33),
      signature: buf.slice(off + 33, off + 97),
      member_ledger_hash: buf.slice(off + 97, off + 129),
      // Anything past 129 bytes — currently unused but parse gracefully.
      extra: entryLen > 129 ? buf.slice(off + 129, off + entryLen) : null,
    });
    off += entryLen;
  }
  return { entries, leftover: buf.length - off };
}

function renderCosignatures(records, cosignerLedgers) {
  // Multi-cosig (tag 22) is the modern shape. The legacy single-cosig
  // path (tags 16/18) was always a 1-of-N at most; show it under the
  // same card if present.
  const multi = records.find(r => r.type === 22)?.value;
  const legacyMh = records.find(r => r.type === 16)?.value;
  const legacySig = records.find(r => r.type === 18)?.value
    || records.find(r => r.type === 14)?.value;

  if (!multi && !legacyMh && !legacySig) return '';

  let entries = [];
  let leftover = 0;
  if (multi) {
    const parsed = parseCosignatures(multi);
    entries = parsed.entries;
    leftover = parsed.leftover;
  } else if (legacyMh || legacySig) {
    // Synthesize a single legacy entry for display. No pk available
    // in the legacy shape — show the cosigner_pubkey as "?" and let
    // the user know it's the single-cosig fallback.
    entries.push({
      pubkey: null,
      signature: legacySig || new Uint8Array(64),
      member_ledger_hash: legacyMh || new Uint8Array(32),
      extra: null,
      legacy: true,
    });
  }

  const note = multi
    ? `${entries.length} cosigner${entries.length === 1 ? '' : 's'} · multi-cosig (tag 22)`
    : `legacy single-cosig (tags 16/18) — pubkey not on the wire`;

  return `
    <div class="card" id="cosignatures">
      <h3>cosignatures <span class="ann" style="font-family:var(--sans);font-size:0.78rem;color:var(--fg-muted);margin-left:0.4rem;">${escapeHtml(note)}</span></h3>
      ${entries.map((e, i) => {
        const pkHex = e.pubkey ? bytesToHex(e.pubkey) : null;
        const lid = pkHex ? cosignerLedgers?.get(pkHex) : null;
        const lidLink = lid
          ? `<a href="/ledger#ledger=${encodeURIComponent(lid)}&relay=${encodeURIComponent(RELAY_URL)}" style="color:var(--accent);font-family:var(--mono);">${escapeHtml(lid)}</a>`
          : '<span class="muted">(no QuorumBegin or QuorumAddMember on this relay binds this pubkey to a ledger)</span>';
        // member_ledger_hash → the actual update on the cosigner's
        // ledger that produced that hash. Links go through /update's
        // content_hash lookup mode (see main()), which scans the
        // cosigner's events and redirects to the matching event_id.
        // Only useful when we know the cosigner's ledger.
        const mhHex = bytesToHex(e.member_ledger_hash);
        const mhDisplay = lid
          ? `<a href="/update#content_hash=${encodeURIComponent(mhHex)}&ledger=${encodeURIComponent(lid)}&relay=${encodeURIComponent(RELAY_URL)}" style="color:var(--accent);">${escapeHtml(mhHex)}</a>`
          : escapeHtml(mhHex);
        return `
        <div style="margin: ${i === 0 ? '0' : '0.85rem 0 0'}; padding: ${i === 0 ? '0' : '0.85rem 0 0'}; ${i === 0 ? '' : 'border-top: 1px solid var(--border);'}">
          <dl class="kv" style="grid-template-columns: 9rem 1fr;">
            <dt>cosigner</dt>
            <dd class="mono">${e.pubkey ? escapeHtml(pkHex) : '<span class="muted">(legacy — not encoded)</span>'}</dd>
            <dt>member ledger</dt>
            <dd>${lidLink}</dd>
            <dt>member ledger hash</dt>
            <dd class="mono">${mhDisplay}</dd>
            <dt>signature</dt>
            <dd class="mono">${escapeHtml(bytesToHex(e.signature))}</dd>
            ${e.extra ? `<dt>trailing bytes</dt><dd class="mono">${escapeHtml(bytesToHex(e.extra))} <span class="muted">(${e.extra.length} bytes — newer fields the explorer doesn't know about yet)</span></dd>` : ''}
          </dl>
        </div>
      `;
      }).join('')}
      ${leftover > 0 ? `<div class="ann" style="margin-top:0.85rem;color:var(--red);font-family:var(--sans);font-size:0.78rem;">${leftover} byte(s) of trailing junk in the cosignatures blob — parse may be incomplete.</div>` : ''}
    </div>`;
}

function renderInnerOp(opBytes, ledgerRef) {
  if (!opBytes) return '';
  const inner = parseTlv(opBytes);
  let opName = '?', opDisc = 0, opCat = 'unknown';
  if (inner.length > 0 && inner[0].type === 0 && inner[0].value.length === 1) {
    opDisc = inner[0].value[0];
    opName = OP_NAMES[opDisc] || `Unknown(${opDisc})`;
    opCat = opCategory(opName);
  }
  // deposit_id (200) / source_deposit_id (212) / destination_deposit_id
  // (214) link to the per-deposit view, scoped to this update's ledger.
  const depositLink = (hex) =>
    `/deposit#deposit=${encodeURIComponent(hex)}` +
    (ledgerRef ? `&ledger=${encodeURIComponent(ledgerRef)}` : '') +
    `&relay=${encodeURIComponent(RELAY_URL)}`;
  return `
    <div class="card" id="message">
      <h3>message · <span class="op ${opCat}">${escapeHtml(opName)}</span> <span class="ann" style="font-family:var(--sans);font-size:0.78rem;color:var(--fg-muted);margin-left:0.4rem;">discriminant ${opDisc}</span></h3>
      <table class="tlv">
        <thead><tr><th>tag</th><th>name</th><th>len</th><th>value</th></tr></thead>
        <tbody>
          ${inner.map(r => {
            const name = FIELD_NAMES[r.type] || `field_${r.type}`;
            // descriptor (202) / new_descriptor (208): decode the UTF-8 string
            // and show it parsed into nested fragment rows, like the op's own
            // decoded sub-fields, rather than one long string.
            let valueCell;
            if (r.type === 202 || r.type === 208) {
              const descStr = new TextDecoder().decode(r.value);
              valueCell = `<div class="desc-tree">${renderDescriptorRows(descStr, escapeHtml)}</div>`;
            } else if (r.type === 200 || r.type === 212 || r.type === 214) {
              // deposit identifiers — link to the per-deposit view.
              const idHex = bytesToHex(r.value);
              valueCell = `<a href="${escapeHtml(depositLink(idHex))}" style="color:var(--accent);">${escapeHtml(idHex)}</a><span class="interp">16-byte deposit_id — open deposit view ↗</span>`;
            } else {
              const interp = interpretValue(r);
              valueCell = `${escapeHtml(interp.hex)}<span class="interp">${escapeHtml(interp.ann)}</span>`;
            }
            return `<tr>
              <td class="tag-id">${r.type}</td>
              <td class="name">${escapeHtml(name)}</td>
              <td class="len">${r.value.length}</td>
              <td class="value">${valueCell}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

function renderHexDump(label, buf) {
  return `
    <div class="card">
      <h3>${escapeHtml(label)}</h3>
      <div class="hex-meta">
        <span><b>${buf.length}</b> bytes · <b>0x${buf.length.toString(16)}</b> hex</span>
        <span>sha256: <span style="font-family:var(--mono);color:var(--fg);" id="hex-sha-${label.replace(/\s+/g, '-')}">…</span></span>
      </div>
      <pre class="hexdump">${hexDump(buf)}</pre>
    </div>`;
}

// ── main ──────────────────────────────────────────────────────────

async function main() {
  // Lookup-by-content-hash mode: caller provides `ledger=<hex>` and
  // `content_hash=<hex>` instead of `event=<id>`. Used by the
  // cosignatures section to jump from a cosigner's member_ledger_hash
  // to the actual update on the cosigner's ledger that produced it.
  // We scan that ledger's recent events, recompute each one's
  // content_hash, and redirect to the matching event_id form once
  // found.
  if (!getParam('event') && getParam('content_hash') && getParam('ledger')) {
    const targetHash = getParam('content_hash').toLowerCase();
    const targetLedger = getParam('ledger').toLowerCase();
    document.getElementById('event-id').textContent = '— resolving content_hash …';
    document.getElementById('body').innerHTML = `
      <div class="empty">
        Looking up which update on
        <a href="/ledger#ledger=${encodeURIComponent(targetLedger)}&relay=${encodeURIComponent(RELAY_URL)}"
           style="font-family:var(--mono);color:var(--accent);">${escapeHtml(targetLedger.slice(0, 16))}…</a>
        has content_hash
        <span style="font-family:var(--mono);color:var(--fg);">${escapeHtml(targetHash.slice(0, 16))}…</span>
      </div>`;
    const found = await findEventByContentHash(RELAY_URL, targetLedger.slice(0, 16), targetHash);
    if (found) {
      const params = new URLSearchParams({ event: found, relay: RELAY_URL });
      window.location.replace(`/update#${params.toString()}`);
      return;
    }
    document.getElementById('body').innerHTML = `
      <div class="empty err">Couldn't find an update on
        <span style="font-family:var(--mono)">${escapeHtml(targetLedger.slice(0, 16))}…</span>
        with content_hash <span style="font-family:var(--mono)">${escapeHtml(targetHash)}</span>
        on <span style="font-family:var(--mono)">${escapeHtml(RELAY_URL)}</span>.</div>`;
    return;
  }

  const eventId = getParam('event');
  if (!eventId || eventId.length !== 64 || !/^[0-9a-f]+$/i.test(eventId)) {
    document.getElementById('event-id').textContent = '— missing/invalid event id';
    document.getElementById('body').innerHTML = `<div class="empty err">Pass <code>#event=&lt;64-hex-event-id&gt;</code> in the URL to inspect a specific update.</div>`;
    return;
  }
  document.getElementById('event-id').textContent = eventId;

  const events = await nostrFetch(RELAY_URL, { ids: [eventId.toLowerCase()], limit: 1 });
  if (!events.length) {
    document.getElementById('body').innerHTML = `<div class="empty err">Event ${escapeHtml(eventId)} not found on
      <span style="font-family:var(--mono)">${escapeHtml(RELAY_URL)}</span>.</div>`;
    return;
  }
  const event = events[0];

  // Hero meta
  const ledgerTagD = event.tags.find(t => t[0] === 'd')?.[1];
  const seqTag = event.tags.find(t => t[0] === 'n')?.[1];
  const opTag = event.tags.find(t => t[0] === 't')?.[1];
  const opNameStr = opTag ? (OP_NAMES[Number(opTag)] || `op(${opTag})`) : '';
  const opCat = opCategory(opNameStr);
  const ledgerLink = ledgerTagD
    ? `/ledger#ledger=${ledgerTagD}&relay=${encodeURIComponent(RELAY_URL)}`
    : null;
  document.getElementById('hero-meta').innerHTML = `
    <span class="op ${opCat}">${escapeHtml(opNameStr || `kind ${event.kind}`)}</span>
    ${seqTag ? `<span style="color:var(--fg-dim)">·</span> <span>seq <b style="color:var(--fg)">${escapeHtml(seqTag)}</b></span>` : ''}
    ${ledgerLink ? `<span style="color:var(--fg-dim)">·</span> <a href="${escapeHtml(ledgerLink)}">ledger ${escapeHtml(ledgerTagD)}…</a>` : ''}
    <span style="color:var(--fg-dim)">·</span>
    <span>${new Date(event.created_at * 1000).toISOString().replace('T', ' ').slice(0, 19)} UTC</span>
  `;

  // Verify Nostr event id + Schnorr signature
  const idCheck = await verifyEventId(event);
  const sigOk = verifyEventSig(event);

  let html = '';
  html += renderEventCard(event, idCheck, sigOk);

  // Decode the base64 TLV body
  let rawTlv = null;
  try { rawTlv = b64ToBytes(event.content); }
  catch (e) {
    html += `<div class="empty err">Failed to base64-decode event content: ${escapeHtml(e.message)}</div>`;
    document.getElementById('body').innerHTML = html;
    return;
  }

  let outerRecords = [];
  try { outerRecords = parseTlv(rawTlv); }
  catch (e) {
    html += `<div class="empty err">Failed to TLV-parse event content: ${escapeHtml(e.message)}</div>`;
    document.getElementById('body').innerHTML = html;
    return;
  }

  // content_hash check (only meaningful for kind 9100)
  let hashOk = { ok: false };
  if (event.kind === 9100) {
    const computed = await computeContentHash(outerRecords);
    if (computed) {
      // The on-wire content_hash isn't usually present in the TLV (it's
      // wire-derived). Compare against what's tagged in the operator's
      // emit if any; otherwise we just surface the computed value.
      const provided = outerRecords.find(r => r.type === 24)?.value; // some shapes carry it under tag 24
      hashOk = { ok: provided ? bytesToHex(computed) === bytesToHex(provided) : true, computed: bytesToHex(computed) };
    }
  }

  html += renderUpdateFields(outerRecords, hashOk);

  // Per-cosigner breakdown of the cosignatures field (tag 22) or
  // legacy single-cosig fallback (tags 16/18). Skipped silently if
  // neither is present.
  //
  // Look up which member-ledger each cosigner operates by fetching
  // this ledger's most-recent QuorumBegin (it carries
  // QUORUM_MEMBER_LEDGER_IDS as of `11bc5c0`; older events return an
  // empty map and the cosignatures section says so per row).
  let cosignerLedgers = new Map();
  if (ledgerTagD) {
    cosignerLedgers = await fetchCosignerLedgerMap(RELAY_URL, ledgerTagD);
  }
  html += renderCosignatures(outerRecords, cosignerLedgers);

  // Inner operation
  const msgBytes = outerRecords.find(r => r.type === 8)?.value;
  if (msgBytes) html += renderInnerOp(msgBytes, ledgerTagD);

  html += renderHexDump('raw TLV body (base64-decoded)', rawTlv);
  html += `<div class="card"><h3>raw event content (base64)</h3>
    <pre class="hexdump" style="white-space:pre-wrap;word-break:break-all;">${escapeHtml(event.content)}</pre>
  </div>`;

  document.getElementById('body').innerHTML = html;

  // Fill in hex-dump sha256 line
  const sha = bytesToHex(await sha256(rawTlv));
  const target = document.getElementById('hex-sha-raw-TLV-body-(base64-decoded)');
  if (target) target.textContent = sha;
}

main();
</script>
</body>
</html>
