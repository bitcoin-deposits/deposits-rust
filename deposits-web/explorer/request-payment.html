<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request to Pay · deposits</title>
  <style>
    :root {
      --bg:#11131f; --bg-elev:#181c2c; --bg-card:#1d2237; --border:#2a304a;
      --fg:#e7e9f0; --fg-strong:#fff; --muted:#8d96b3; --dim:#5b6386;
      --accent:#f7931a; --green:#4cae5a; --red:#d9534f;
      --mono: ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
      --sans: -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
    }
    * { box-sizing:border-box; }
    html,body { background:var(--bg); }
    body { margin:0; color:var(--fg); font:14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
    a { color:inherit; } a:hover { color:var(--accent); }
    .topnav { display:flex; align-items:center; gap:0.45rem; padding:0.85rem 1.25rem;
      background:var(--bg-elev); border-bottom:1px solid var(--border); }
    .logo { color:var(--accent); font-size:1.25rem; line-height:1; }
    .name { color:var(--fg-strong); font-weight:600; }
    .sub { color:var(--muted); font-size:0.85rem; }
    main { max-width:440px; margin:0 auto; padding:1.5rem 1.25rem 4rem; }
    h1 { font-size:1.15rem; margin:0 0 0.25rem; color:var(--fg-strong); }
    .lead { color:var(--muted); font-size:0.85rem; margin:0 0 1.25rem; }
    label { display:block; font-size:0.78rem; color:var(--muted); margin:0.7rem 0 0.2rem; }
    input, textarea { width:100%; background:var(--bg-card); border:1px solid var(--border);
      color:var(--fg); border-radius:6px; padding:0.55rem 0.7rem; font:inherit; }
    input:focus, textarea:focus { outline:none; border-color:var(--accent); }
    input.mono { font-family:var(--mono); font-size:0.8rem; }
    textarea { resize:vertical; min-height:2.4rem; }
    .ctx { display:flex; align-items:baseline; justify-content:space-between; gap:0.5rem;
      background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:0.5rem 0.7rem; }
    .ctx .k { color:var(--muted); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; }
    .ctx .v { font-family:var(--mono); font-size:0.8rem; color:var(--fg); }
    .ctx button { background:none; border:none; color:var(--accent); font:inherit; font-size:0.75rem; cursor:pointer; padding:0; }
    .btn { width:100%; margin-top:1.1rem; background:var(--accent); border:none; color:#1a1205;
      font:600 0.95rem var(--sans); border-radius:7px; padding:0.7rem; cursor:pointer; }
    .btn:disabled { opacity:0.55; cursor:default; }
    .btn.secondary { background:var(--bg-card); color:var(--fg); border:1px solid var(--border); margin-top:0.6rem; }
    .err { color:var(--red); font-size:0.85rem; margin-top:0.8rem; min-height:1em; }
    .result { display:none; margin-top:1.25rem; text-align:center; }
    .result.show { display:block; }
    .qr-wrap { background:#fff; display:inline-block; padding:10px; border-radius:8px; }
    canvas { display:block; image-rendering:pixelated; }
    .amt { font-size:1.6rem; font-weight:300; color:var(--accent); margin:0.5rem 0 0.1rem; letter-spacing:-0.5px; }
    .for { color:var(--muted); font-size:0.85rem; margin-bottom:0.9rem; word-break:break-word; }
    .invoice { font-family:var(--mono); font-size:0.7rem; color:var(--muted); background:var(--bg-card);
      border:1px solid var(--border); border-radius:6px; padding:0.6rem; margin-top:0.9rem;
      word-break:break-all; max-height:5.5rem; overflow:auto; text-align:left; }
    .status { margin-top:0.9rem; font-size:0.9rem; color:var(--muted); }
    .status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--yellow);
      margin-right:0.4rem; vertical-align:1px; animation:pulse 1.4s infinite; }
    @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.25;} 100%{opacity:1;} }
    .status.paid { color:var(--green); font-weight:600; font-size:1.2rem; }
    .paid-check { font-size:3rem; color:var(--green); line-height:1; }
    footer { margin-top:2rem; color:var(--dim); font-size:0.78rem; text-align:center; }
  </style>
</head>
<body>
  <nav class="topnav"><span class="logo">⟁</span><span class="name">deposits</span><span class="sub">request to pay</span></nav>
  <main>
    <h1>Request a Lightning payment</h1>
    <p class="lead">Generate an invoice for a deposit. Share the QR or the invoice string with whoever's paying.</p>

    <div id="form">
      <!-- Ledger comes from the page context (subdomain or #ledger=) when present. -->
      <div id="ledger-ctx" class="ctx" style="display:none;">
        <span><span class="k">Ledger</span> &nbsp;<span class="v" id="ledger-short"></span></span>
        <button id="ledger-change" type="button">change</button>
      </div>
      <div id="ledger-row" style="display:none;">
        <label for="ledger">Ledger</label>
        <input id="ledger" class="mono" placeholder="64-hex or bech32 ledger id" autocomplete="off">
      </div>

      <label for="deposit">Deposit</label>
      <input id="deposit" class="mono" placeholder="deposit id" autocomplete="off">
      <label for="amount">Amount (sats)</label>
      <input id="amount" type="number" min="1" step="1" placeholder="1000" inputmode="numeric">
      <label for="message">Message <span style="color:var(--dim)">(optional)</span></label>
      <textarea id="message" placeholder="what's this for?"></textarea>
      <button class="btn" id="gen">Generate invoice</button>
      <div class="err" id="err"></div>
    </div>

    <div class="result" id="result">
      <div class="amt" id="r-amt"></div>
      <div class="for" id="r-for"></div>
      <div class="qr-wrap" id="qr-wrap"><canvas id="qr"></canvas></div>
      <div class="status" id="status"></div>
      <div class="invoice" id="r-invoice"></div>
      <button class="btn" id="copy">Copy invoice</button>
      <button class="btn secondary" id="again">New request</button>
    </div>

    <footer>invoice is created by the operator for this deposit · expires per the operator's policy</footer>
  </main>

<script type="module">
import qrcode from './vendor/qrcode-generator.js';
import { parseTlv, b64ToBytes, bytesToHex } from './shared.js';

const $ = (id) => document.getElementById(id);
const qp = new URLSearchParams(location.hash.replace(/^#/, '') || location.search);

const RELAY_URL = qp.get('relay')
  || document.querySelector('meta[name=relay]')?.content
  || 'wss://relay.bitcoindeposits.net';

const BECH32 = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
function bech32ToHex(s) {
  let acc = 0, bits = 0; const out = [];
  for (const ch of s.toLowerCase()) {
    const v = BECH32.indexOf(ch);
    if (v < 0) return null;
    acc = (acc << 5) | v; bits += 5;
    if (bits >= 8) { bits -= 8; out.push((acc >> bits) & 0xff); }
  }
  if (out.length !== 32) return null;
  return out.map(b => b.toString(16).padStart(2, '0')).join('');
}
// A ledger id from a value (64-hex or 52-bech32) → 64-hex, else null.
function toHexLedger(v) {
  if (!v) return null;
  const s = v.trim().toLowerCase();
  if (s.length === 64 && /^[0-9a-f]+$/.test(s)) return s;
  if (s.length === 52) return bech32ToHex(s);
  return null;
}
// Resolve the ledger from #ledger=/?ledger=, else the host subdomain. The page
// is meant to live on a ledger subdomain or be reached from a ledger/deposit
// page, so the ledger is usually already in context.
function resolveLedger() {
  const fromParam = toHexLedger(qp.get('ledger'));
  if (fromParam) return fromParam;
  const sub = location.hostname.split('.')[0];
  return toHexLedger(sub);
}

const relay = qp.get('relay') || '';

// Wire up the ledger context vs. manual-entry rows.
const ctxLedger = resolveLedger();
if (ctxLedger) {
  $('ledger').value = ctxLedger;
  $('ledger-short').textContent = ctxLedger.slice(0, 10) + '…' + ctxLedger.slice(-8);
  $('ledger-ctx').style.display = 'flex';
} else {
  $('ledger-row').style.display = 'block';
}
$('ledger-change').addEventListener('click', () => {
  $('ledger-ctx').style.display = 'none';
  $('ledger-row').style.display = 'block';
  $('ledger').focus();
});

for (const k of ['deposit', 'amount', 'message']) {
  const v = qp.get(k);
  if (v != null) $(k).value = v;
}

function renderQR(canvas, text, targetSize = 220) {
  const qr = qrcode(0, 'L');
  qr.addData(text.toUpperCase());  // uppercase → alphanumeric mode → smaller QR
  qr.make();
  const modules = qr.getModuleCount();
  const border = 4;
  const total = modules + border * 2;
  const scale = Math.max(2, Math.floor(targetSize / total));
  const px = total * scale;
  canvas.width = px; canvas.height = px;
  canvas.style.width = px + 'px'; canvas.style.height = px + 'px';
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = '#000';
  for (let r = 0; r < modules; r++)
    for (let c = 0; c < modules; c++)
      if (qr.isDark(r, c)) ctx.fillRect((c + border) * scale, (r + border) * scale, scale, scale);
}

function showError(msg) { $('err').textContent = msg || ''; }

async function generate() {
  const ledger = $('ledger').value.trim();
  const deposit = $('deposit').value.trim();
  const amount = parseInt($('amount').value, 10);
  const message = $('message').value.trim();
  showError('');
  if (!ledger) return showError('A ledger is required.');
  if (!deposit) return showError('A deposit is required.');
  if (!Number.isInteger(amount) || amount <= 0) return showError('Enter an amount in sats.');

  const btn = $('gen');
  btn.disabled = true; btn.textContent = 'Requesting invoice…';
  try {
    const params = new URLSearchParams({ ledger, deposit, amount_sats: String(amount) });
    if (message) params.set('message', message);
    if (relay) params.set('relay', relay);
    const resp = await fetch('/api/request-payment?' + params.toString());
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || !data.pr) {
      throw new Error(data.reason || data.error || `request failed (${resp.status})`);
    }
    const ph = (data.attestations && data.attestations.payment_hash) || null;
    showInvoice(data.pr, amount, message, deposit, ph);
  } catch (e) {
    showError(e.message || String(e));
  } finally {
    btn.disabled = false; btn.textContent = 'Generate invoice';
  }
}

let currentInvoice = '';
function showInvoice(pr, amountSats, message, deposit, paymentHash) {
  currentInvoice = pr;
  $('r-amt').textContent = '₿ ' + amountSats.toLocaleString() + ' sat';
  $('r-for').textContent = message ? '“' + message + '”' : '';
  $('r-invoice').textContent = pr;
  $('qr-wrap').style.display = ''; $('r-invoice').style.display = ''; $('copy').style.display = '';
  renderQR($('qr'), pr);
  $('form').style.display = 'none';
  $('result').classList.add('show');
  watchPayment(deposit, paymentHash, amountSats * 1000);
}

// ── Payment detection ──────────────────────────────────────────────
// When the invoice is paid the operator commits an InvoiceCredit (op type 30)
// on the ledger, tagged with our deposit id and carrying the payment_hash
// (TLV tag 14). Watch the relay for it and flip the UI to "paid". Best-effort
// UX only — the payment itself doesn't depend on this.
let ws = null, watching = false, watchTimer = null;

function decodeCredit(content) {
  try {
    const outer = parseTlv(b64ToBytes(content));
    const msg = outer.find(r => r.type === 8)?.value;  // inner op
    if (!msg) return null;
    const inner = parseTlv(msg);
    const phV = inner.find(r => r.type === 14)?.value;  // payment_hash
    const amtV = inner.find(r => r.type === 2)?.value;  // amount (msats, big-endian)
    const ph = (phV && phV.length === 32) ? bytesToHex(phV) : null;
    let amt = null;
    if (amtV && amtV.length === 8) { amt = 0; for (const b of amtV) amt = amt * 256 + b; }
    return { ph, amt };
  } catch { return null; }
}
window.__rp = { decodeCredit, markPaid };  // exposed for tests

function setWaiting() {
  $('status').className = 'status';
  $('status').innerHTML = '<span class="dot"></span> waiting for payment…';
}

function markPaid() {
  stopWatch();
  $('qr-wrap').style.display = 'none';
  $('r-invoice').style.display = 'none';
  $('copy').style.display = 'none';
  $('status').className = 'status paid';
  $('status').innerHTML = '<div class="paid-check">✓</div>paid';
}

function stopWatch() {
  watching = false;
  if (watchTimer) { clearTimeout(watchTimer); watchTimer = null; }
  if (ws) { try { ws.close(); } catch {} ws = null; }
}

function watchPayment(deposit, paymentHash, amountMsats) {
  stopWatch();
  watching = true;
  setWaiting();
  watchTimer = setTimeout(stopWatch, 20 * 60 * 1000);  // don't watch forever
  const sub = 'rp' + Math.random().toString(36).slice(2, 8);
  const connect = () => {
    if (!watching) return;
    try { ws = new WebSocket(RELAY_URL); } catch { return; }
    ws.onopen = () => {
      const since = Math.floor(Date.now() / 1000) - 60;
      ws.send(JSON.stringify(['REQ', sub, { kinds: [9100], '#i': [deposit], '#t': ['30'], since, limit: 20 }]));
    };
    ws.onmessage = (m) => {
      try {
        const d = JSON.parse(m.data);
        if (d[0] !== 'EVENT' || d[1] !== sub) return;
        const c = decodeCredit(d[2].content);
        if (!c) return;
        // Prefer an exact payment_hash match; fall back to amount when the
        // operator didn't forward attestations.
        const hit = paymentHash ? (c.ph === paymentHash.toLowerCase()) : (c.amt === amountMsats);
        if (hit) markPaid();
      } catch {}
    };
    ws.onclose = () => { if (watching) setTimeout(connect, 3000); };
    ws.onerror = () => { try { ws.close(); } catch {} };
  };
  connect();
}

$('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(currentInvoice);
    $('copy').textContent = 'Copied!';
    setTimeout(() => ($('copy').textContent = 'Copy invoice'), 1500);
  } catch {
    const r = document.createRange(); r.selectNodeContents($('r-invoice'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
});

$('again').addEventListener('click', () => {
  stopWatch();
  $('status').textContent = '';
  $('result').classList.remove('show');
  $('form').style.display = '';
  $('amount').value = ''; $('message').value = '';
});

$('gen').addEventListener('click', generate);
for (const id of ['ledger', 'deposit', 'amount'])
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });

// Auto-generate when the request is fully specified (shareable deep link).
if ($('ledger').value && qp.get('deposit') && qp.get('amount')) generate();
</script>
</body>
</html>
