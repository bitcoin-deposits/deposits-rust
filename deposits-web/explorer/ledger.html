<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ledger · Deposits Explorer</title>
  <style>
    :root {
      --bg:        #11131f;
      --bg-elev:   #181c2c;
      --bg-card:   #1d2237;
      --bg-card-h: #232943;
      --border:    #2a304a;
      --border-strong: #3a4263;
      --fg:        #e7e9f0;
      --fg-strong: #ffffff;
      --fg-muted:  #8d96b3;
      --fg-dim:    #5b6386;
      --accent:    #f7931a;
      --green:     #4cae5a;
      --red:       #d9534f;
      --yellow:    #f0ad4e;
      --blue:      #5b8def;
      --purple:    #b58cf0;
      --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body {
      margin: 0;
      color: var(--fg);
      font: 14px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }

    .topnav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.25rem;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: baseline; gap: 0.45rem; font-weight: 600; font-size: 1.05rem; }
    .brand .logo { color: var(--accent); font-size: 1.25rem; line-height: 1; }
    .brand .name { color: var(--fg-strong); }
    .brand .sub { color: var(--fg-muted); font-weight: 400; font-size: 0.85rem; }
    .nav-links { display: flex; gap: 1rem; font-size: 0.9rem; color: var(--fg-muted); }
    .nav-links a.active { color: var(--accent); }

    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    h1.section-title {
      font-size: 0.78rem; font-weight: 600;
      color: var(--fg-muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 1.5rem 0 0.85rem;
    }
    h1.section-title:first-child { margin-top: 0; }

    .hero {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .hero .lbl {
      color: var(--fg-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.25rem;
    }
    .hero .lid {
      font: 0.95rem var(--mono);
      color: var(--accent);
      word-break: break-all;
      letter-spacing: -0.01em;
    }
    .hero .meta {
      display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
      margin-top: 0.55rem;
      color: var(--fg-muted);
      font-size: 0.85rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.95rem 1.1rem;
    }
    .card h3 {
      font-size: 0.72rem; font-weight: 600;
      color: var(--fg-muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 0 0 0.6rem;
    }
    .card .big {
      font: 600 1.4rem/1 var(--sans);
      color: var(--fg-strong);
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      margin-bottom: 0.25rem;
    }
    .card .big.accent { color: var(--accent); }
    .card .big-sub {
      font-size: 0.78rem;
      color: var(--fg-muted);
    }

    .kv {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.4rem 1rem;
      font-size: 0.85rem;
    }
    .kv dt { color: var(--fg-muted); }
    .kv dd {
      margin: 0;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .kv dd.mono { font-family: var(--mono); font-size: 0.82rem; color: var(--fg-strong); }

    .quorum-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .quorum-item {
      display: flex; align-items: center; gap: 0.6rem;
      font: 0.82rem var(--mono);
      color: var(--fg);
    }
    .quorum-num {
      flex: 0 0 1.5rem;
      color: var(--fg-dim);
      font-family: var(--sans);
      font-size: 0.75rem;
    }
    .quorum-pk { word-break: break-all; }

    .branch-tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .branch-tab {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left-width: 3px;
      border-radius: 4px;
      color: var(--fg-muted);
      cursor: pointer;
      font: 600 0.7rem var(--sans);
      letter-spacing: 0.04em;
      padding: 0.25rem 0.55rem;
    }
    .branch-tab:hover { background: var(--bg-card-h); color: var(--fg); }
    .branch-tab.active { color: var(--fg-strong); background: var(--bg-card-h); }
    .branch-tab .pk { color: var(--fg-dim); font-family: var(--mono); font-weight: 400; }

    .vs-status {
      color: var(--fg-muted);
      font-size: 0.78rem;
      margin-bottom: 0.5rem;
      font-variant-numeric: tabular-nums;
    }

    .vs-viewport {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-y: auto;
      position: relative;
      height: 600px;
      transition: height 0.15s;
    }
    .vs-spacer { width: 100%; }
    .vs-rows { position: absolute; top: 0; left: 0; right: 0; }
    .vs-row {
      position: absolute;
      left: 0; right: 0;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
      border-left: 3px solid var(--border);
      cursor: pointer;
      font-size: 0.85rem;
      background: var(--bg-card);
    }
    .vs-row:hover { background: var(--bg-card-h); }
    .vs-row.active { border-left-color: var(--accent); background: var(--bg-card-h); }
    .vs-row .top {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 0.5rem;
    }
    .vs-row .seq {
      color: var(--fg-dim); font: 0.72rem var(--mono); margin-right: 0.4rem;
      font-variant-numeric: tabular-nums;
    }
    .vs-row .opname { font-weight: 600; }
    .vs-row .meta {
      color: var(--fg-muted); font-size: 0.72rem; font-family: var(--mono);
      margin-top: 0.1rem;
    }
    .vs-row .meta .op { color: var(--fg-dim); }
    .vs-row .fork {
      color: var(--red); font: 700 0.65rem var(--sans);
      letter-spacing: 0.06em; margin-left: 0.4rem;
    }
    .vs-row .forklink {
      font: 0.65rem var(--mono); margin-left: 0.4rem;
    }

    .vs-detail {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.95rem 1.1rem;
      margin-top: 0.6rem;
      max-height: 340px;
      overflow-y: auto;
    }
    .vs-detail .head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 1rem; margin-bottom: 0.3rem;
    }
    .vs-detail .title { font-size: 1rem; font-weight: 600; }
    .vs-detail .actions a {
      font-size: 0.78rem; color: var(--accent);
    }
    .vs-detail .submeta {
      color: var(--fg-muted); font-size: 0.78rem; font-family: var(--mono);
      margin-bottom: 0.7rem; word-break: break-all;
    }
    .vs-detail .close {
      background: none; border: none; color: var(--fg-muted); cursor: pointer;
      font-size: 0.78rem; padding: 0;
    }
    .vs-detail .close:hover { color: var(--accent); }

    pre.hexdump {
      margin: 0;
      padding: 0.85rem 1rem;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 4px;
      font: 0.78rem/1.45 var(--mono);
      color: var(--fg);
      overflow-x: auto;
      white-space: pre;
    }
    pre.hexdump .off { color: var(--fg-dim); }
    pre.hexdump .ascii { color: var(--fg-muted); }

    .op {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 3px;
      font: 600 0.72rem var(--mono);
      letter-spacing: -0.01em;
    }
    .op.credit    { background: rgba(76, 174, 90, 0.15); color: var(--green); }
    .op.lock      { background: rgba(240, 173, 78, 0.15); color: var(--yellow); }
    .op.deposit   { background: rgba(91, 141, 239, 0.15); color: var(--blue); }
    .op.quorum    { background: rgba(181, 140, 240, 0.15); color: var(--purple); }
    .op.dispute   { background: rgba(217, 83, 79, 0.18); color: var(--red); }
    .op.transfer  { background: rgba(91, 141, 239, 0.15); color: var(--blue); }
    .op.unknown   { background: var(--border); color: var(--fg-muted); }

    .badge {
      display: inline-block;
      padding: 0.05rem 0.45rem;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      vertical-align: 1px;
    }
    .badge.active   { background: rgba(76, 174, 90, 0.18); color: var(--green); }
    .badge.pre      { background: rgba(141, 150, 179, 0.15); color: var(--fg-muted); }
    .badge.expired  { background: rgba(217, 83, 79, 0.18); color: var(--red); }
    .badge.gated    { background: rgba(240, 173, 78, 0.18); color: var(--yellow); }
    .badge.q        { background: rgba(91, 141, 239, 0.18); color: var(--blue); }

    .empty {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      color: var(--fg-muted);
    }
    .empty.err { color: var(--red); border-color: rgba(217, 83, 79, 0.4); }
    .loading { color: var(--fg-muted); padding: 0.5rem 0; }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--fg-dim);
      font-size: 0.78rem;
      text-align: center;
    }
    footer .mono { font-family: var(--mono); color: var(--fg-muted); }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">
      <span class="logo">⟁</span>
      <span class="name">deposits</span>
      <span class="sub">explorer</span>
    </div>
    <div class="nav-links">
      <a href="/explorer">overview</a>
      <a href="/ledger" class="active">ledger</a>
      <a href="/deposit">deposit</a>
    </div>
  </nav>
  <script>
    // When the page is loaded on a `<bech32-or-hex>.ledger.<basedomain>`
    // subdomain, any nav link that leaves the per-ledger view (today
    // just /explorer; tomorrow whatever else we add) should hop off
    // the ledger subdomain to `explorer.<basedomain>` rather than just
    // change the path on the same host. The host-aware root route would
    // otherwise keep serving the per-ledger view since the subdomain
    // still matches a ledger.
    (function () {
      const host = window.location.hostname;
      const m = host.match(/^[^.]+\.ledger\.(.+)$/);
      if (!m) return;
      const base = m[1];
      // Anything pointing at /explorer on the same host gets rewritten
      // to the explorer subdomain. Same-ledger links (/ledger, /update)
      // stay on the current host.
      document.querySelectorAll('.nav-links a[href^="/explorer"]').forEach(a => {
        a.href = `${window.location.protocol}//explorer.${base}/`;
      });
    })();
  </script>

  <main>
    <div class="hero">
      <div class="lbl">ledger</div>
      <div class="lid" id="ledger-id">…</div>
      <div class="meta" id="hero-meta"></div>
    </div>

    <div id="overview-body">
      <div class="loading">querying relay…</div>
    </div>

    <h1 class="section-title">activity</h1>
    <div id="branch-tabs" class="branch-tabs"></div>
    <div id="vs-status" class="vs-status">querying relay…</div>
    <div id="vs-viewport" class="vs-viewport" style="display:none;">
      <div id="vs-spacer" class="vs-spacer"></div>
      <div id="vs-rows" class="vs-rows"></div>
    </div>
    <div id="vs-detail" class="vs-detail" style="display:none;"></div>
    <div id="vs-empty"></div>

    <footer>
      data via nostr relay <span class="mono" id="relay-url"></span>
    </footer>
  </main>

<script type="module">
import { OP_NAMES, FIELD_NAMES } from './tlv-catalog.js';
import { fetchCosignerLedgerMap } from './shared.js';

const BECH32_CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';

function getParam(name) {
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (hashParams.has(name)) return hashParams.get(name);
  return new URLSearchParams(window.location.search).get(name);
}

function bech32DataToBytes(s) {
  let acc = 0, bits = 0;
  const out = [];
  for (const ch of s.toLowerCase()) {
    const v = BECH32_CHARSET.indexOf(ch);
    if (v < 0) return null;
    acc = (acc << 5) | v; bits += 5;
    if (bits >= 8) { bits -= 8; out.push((acc >> bits) & 0xff); }
  }
  return new Uint8Array(out);
}

function hex(buf) {
  return [...buf].map(b => b.toString(16).padStart(2, '0')).join('');
}

function resolveLedgerFromUrl() {
  const override = getParam('ledger');
  if (override) {
    const v = override.toLowerCase();
    if (v.length === 64 && /^[0-9a-f]+$/.test(v)) return v;
    const decoded = bech32DataToBytes(v);
    if (decoded && decoded.length === 32) return hex(decoded);
    throw new Error(`ledger=${override} is neither 64-hex nor 52-char bech32-data`);
  }
  const host = window.location.hostname;
  const sub = host.split('.')[0];
  if (sub.length === 64 && /^[0-9a-f]+$/.test(sub)) return sub.toLowerCase();
  if (sub.length === 52) {
    const decoded = bech32DataToBytes(sub);
    if (decoded && decoded.length === 32) return hex(decoded);
  }
  throw new Error(
    `Cannot determine ledger ID from "${host}". Use the canonical ` +
    `<bech32-or-hex>.ledger.bitcoindeposits.net subdomain or pass ` +
    `#ledger=<id>.`
  );
}

const RELAY_URL =
  getParam('relay')
  || document.querySelector('meta[name=relay]')?.content
  || 'wss://relay.bitcoindeposits.net';

document.getElementById('relay-url').textContent = RELAY_URL;

function nostrFetch(relayUrl, filter, { timeoutMs = 8000 } = {}) {
  return new Promise((resolve) => {
    const events = [];
    let ws;
    try { ws = new WebSocket(relayUrl); }
    catch { resolve([]); return; }
    const subId = 'q' + Math.random().toString(36).slice(2, 8);
    const finish = () => { try { ws.close(); } catch {} clearTimeout(timer); resolve(events); };
    const timer = setTimeout(finish, timeoutMs);
    ws.onopen = () => ws.send(JSON.stringify(['REQ', subId, filter]));
    ws.onmessage = (msg) => {
      try {
        const d = JSON.parse(msg.data);
        if (d[0] === 'EVENT' && d[1] === subId) events.push(d[2]);
        else if (d[0] === 'EOSE' && d[1] === subId) finish();
      } catch {}
    };
    ws.onerror = finish;
    ws.onclose = finish;
  });
}

const fmt = {
  short: (s, n = 16) => s ? s.slice(0, n) + (s.length > n ? '…' : '') : '',
  msats: (n) => {
    if (n == null) return '—';
    const sats = n / 1000;
    if (sats >= 100_000_000) {
      return `₿ ${(sats / 100_000_000).toLocaleString(undefined, { maximumFractionDigits: 4 })}`;
    }
    if (sats >= 1_000) return `${sats.toLocaleString()} sat`;
    return `${sats} sat`;
  },
  bps: (b) => b == null ? '—' : `${(b / 100).toFixed(2)}%`,
  ts: (t) => {
    if (!t) return '—';
    const d = new Date(t * 1000);
    return d.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  },
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function quorumBadge(state) {
  const cls = state === 'Active' ? 'active'
    : state === 'PreQuorum' ? 'pre'
    : state === 'Expired' ? 'expired'
    : state === 'Unknown' ? 'pre'  // neutral/muted — no chain tip to decide
    : '';
  return `<span class="badge ${cls}">${escapeHtml(state || 'unknown')}</span>`;
}

// Format a quorum-expiry status snippet for the overview card. The
// inputs come from messages the wallet/explorer trust independently
// of the operator's advertisement: `expiry` comes from the most
// recent QuorumBegin op embedded in a Kind 9100 update; `tip` comes
// from the most recent Kind 39101 price-oracle event (operators piggyback
// the chain tip on the price feed).
function quorumStatusBlock(expiry, tip) {
  if (!expiry) {
    return `<div class="big">—</div>
            <div class="big-sub">no QuorumBegin observed yet</div>`;
  }
  if (!tip) {
    return `<div class="big">block ${expiry}</div>
            <div class="big-sub">expires at this block (chain tip unknown)</div>`;
  }
  if (tip >= expiry) {
    const stale = tip - expiry;
    return `<div class="big" style="color:var(--red, #d9534f)">EXPIRED</div>
            <div class="big-sub">${stale} block(s) ago (~${(stale/144).toFixed(1)} day(s)) — tip ${tip}, expired at ${expiry}</div>`;
  }
  const remaining = expiry - tip;
  const days = remaining / 144;
  const human = days >= 1 ? `${days.toFixed(1)} day(s)` : `${(remaining*10/60).toFixed(1)} hour(s)`;
  const warn = remaining < 144 ? ' style="color:var(--yellow, #f0ad4e)"' : '';
  return `<div class="big"${warn}>${remaining} block(s) left</div>
          <div class="big-sub">~${human} (tip ${tip} → expires at ${expiry})</div>`;
}

function renderOverview(ad, cosignerLedgers, quorumExpiry, chainTip) {
  const el = document.getElementById('overview-body');
  if (!ad) {
    el.innerHTML = `<div class="empty err">No advertisement found for this ledger on
      <span style="font-family:var(--mono)">${escapeHtml(RELAY_URL)}</span>.<br>
      If the operator publishes ads on a different relay, append <code>#relay=wss://your-relay</code>.</div>`;
    document.getElementById('hero-meta').innerHTML = '';
    return;
  }

  // Quorum state derived strictly from messages we trust independently
  // of the operator's advertisement: the cosigned QuorumBegin (op 12)
  // gives `quorum_expiry`; the cross-operator Kind 39101 oracle stream
  // gives `chainTip`. Never fall back to `ad.quorum_state` — it's
  // operator-self-reported and the entire point of this card is to
  // catch operators whose actual quorum has lapsed but whose ad still
  // says Active.
  let derivedState;
  if (!quorumExpiry) {
    derivedState = 'PreQuorum';
  } else if (chainTip) {
    derivedState = chainTip >= quorumExpiry ? 'Expired' : 'Active';
  } else {
    derivedState = 'Unknown';
  }
  document.getElementById('hero-meta').innerHTML = `
    ${quorumBadge(derivedState)}
    ${ad.quorum_members?.length ? `<span class="badge q">Q=${ad.quorum_members.length}</span>` : ''}
    ${ad.access_control ? `<span class="badge gated">gated</span>` : ''}
    <span style="color:var(--fg-dim)">·</span>
    <span>${escapeHtml(ad.network || '')}</span>
    ${ad.operator_name ? `<span style="color:var(--fg-dim)">·</span> <span>operator <b style="color:var(--fg)">${escapeHtml(ad.operator_name)}</b></span>` : ''}
  `;

  el.innerHTML = `
    <div class="grid">
      <div class="card">
        <h3>reserves</h3>
        <div class="big accent">${escapeHtml(fmt.msats(ad.reserves_amount_msats))}</div>
        <div class="big-sub">backing depositor balances</div>
      </div>
      <div class="card">
        <h3>collateral</h3>
        <div class="big">${escapeHtml(fmt.msats(ad.collateral_amount_msats))}</div>
        <div class="big-sub">forfeit on proven non-conformance</div>
      </div>
      <div class="card">
        <h3>annual fees</h3>
        <div class="big">${escapeHtml(fmt.bps(ad.annual_fee_bps))} <span style="font-size:0.85rem;color:var(--fg-muted);">+ ${escapeHtml(fmt.msats(ad.annualized_fixed_msats))}</span></div>
        <div class="big-sub">period: ${ad.fee_period_blocks} blocks</div>
      </div>
      <div class="card">
        <h3>per-deposit cap</h3>
        <div class="big">${ad.max_deposit_balance_msats ? escapeHtml(fmt.msats(ad.max_deposit_balance_msats)) : 'unlimited'}</div>
        <div class="big-sub">${ad.max_deposit_balance_msats ? 'maximum balance per deposit' : 'no per-deposit cap'}</div>
      </div>
      <div class="card">
        <h3>operator</h3>
        <dl class="kv">
          <dt>name</dt><dd>${escapeHtml(ad.operator_name || '—')}</dd>
          <dt>pubkey</dt><dd class="mono">${escapeHtml(ad.operator_pubkey || '—')}</dd>
          ${ad.delegate_pubkey ? `<dt>nostr delegate</dt><dd class="mono" title="Daemon's per-host Nostr key (DEP-04 §Operator → Delegate). Kind 9100 events + NIP-04 DMs flow here; the operator pubkey above is the trust anchor.">${escapeHtml(ad.delegate_pubkey)}</dd>` : ''}
          <dt>reserves addr</dt><dd class="mono">${escapeHtml(fmt.short(ad.reserves_address || '—', 32))}</dd>
        </dl>
      </div>
      <div class="card">
        <h3>quorum status</h3>
        ${quorumStatusBlock(quorumExpiry, chainTip)}
      </div>
      <div class="card">
        <h3>quorum (${ad.quorum_members?.length || 0})</h3>
        ${ad.quorum_members?.length ? `
          <div class="quorum-list">
            ${ad.quorum_members.map((m, i) => {
              // Member's pubkey on the ad is 33-byte compressed (66
              // hex). Look up their member_ledger_id; link to it when
              // we found one. Until we have an operator view, we just
              // hop to that operator's ledger detail.
              const lid = cosignerLedgers?.get(m);
              const pkSpan = lid
                ? `<a class="quorum-pk" href="/ledger#ledger=${encodeURIComponent(lid)}&relay=${encodeURIComponent(RELAY_URL)}" style="color:var(--accent);text-decoration:none;">${escapeHtml(m)}</a>`
                : `<span class="quorum-pk">${escapeHtml(m)}</span>`;
              return `
                <div class="quorum-item">
                  <span class="quorum-num">${i + 1}.</span>
                  ${pkSpan}
                </div>
              `;
            }).join('')}
          </div>
        ` : `<div class="big-sub">no members listed (legacy ad or pre-QuorumBegin)</div>`}
      </div>
    </div>
  `;
}

// ===========================================================================
// Virtual-scrolled activity list with cursor-based lazy fetching.
// Designed for ledgers with millions of updates: only the loaded window is
// kept in memory; older chunks load when the viewport approaches the bottom.
// ===========================================================================

const VS_ROW_H = 52;
const VS_OVERSCAN = 5;
const VS_PAGE = 500;             // events per relay round-trip
const VS_NEAR_BOTTOM_PX = 400;   // trigger more-fetch when scrollBottom < this
const VS_VIEWPORT_FULL = 600;
const VS_VIEWPORT_DETAIL = 280;
const BRANCH_COLORS = ['#4cae5a','#e8a','#5b8def','#f0ad4e','#d9534f','#0cc','#b58cf0','#fff'];

const vsState = {
  ledgerTag: '',
  rendered: [],            // current view (after branch filter), seq desc
  all: [],                 // every loaded entry, seq desc
  expanded: null,          // index in `rendered`
  branch: 'all',           // 'all' or branch index
  oldestUntil: undefined,  // created_at cursor for next older fetch
  hasMoreOlder: true,
  fetching: false,
  forkPoints: {},          // branchIdx → { forkSeq, branchSeq, operator }
  opToBranch: {},
  numBranches: 0,
};

function readVarint(buf, off) {
  const b = buf[off];
  if (b < 0xfd) return [b, off + 1];
  if (b === 0xfd) return [(buf[off+1] << 8) | buf[off+2], off + 3];
  if (b === 0xfe) return [(buf[off+1]<<24)|(buf[off+2]<<16)|(buf[off+3]<<8)|buf[off+4], off + 5];
  let val = 0;
  for (let i = 0; i < 8; i++) val = val * 256 + buf[off + 1 + i];
  return [val, off + 9];
}

function parseTlv(buf) {
  const records = [];
  let off = 0;
  while (off < buf.length) {
    const [type_, o1] = readVarint(buf, off);
    const [len, o2]   = readVarint(buf, o1);
    records.push({ type: type_, value: buf.slice(o2, o2 + len) });
    off = o2 + len;
  }
  return records;
}

function bytesToHex(buf) { return [...buf].map(b => b.toString(16).padStart(2, '0')).join(''); }

// Pretty hex dump (16 bytes/row, ascii gutter). Same shape as update.html.
function hexDump(buf) {
  const lines = [];
  for (let off = 0; off < buf.length; off += 16) {
    const slice = buf.slice(off, off + 16);
    const hex = [...slice].map(b => b.toString(16).padStart(2, '0')).join(' ');
    const padded = hex.padEnd(16 * 3 - 1, ' ');
    const ascii = [...slice].map(b => (b >= 0x20 && b < 0x7f) ? String.fromCharCode(b) : '·').join('');
    const offHex = off.toString(16).padStart(6, '0');
    lines.push(`<span class="off">${offHex}</span>  ${escapeHtml(padded)}  <span class="ascii">${escapeHtml(ascii)}</span>`);
  }
  return lines.join('\n');
}

async function sha256(buf) {
  const h = await crypto.subtle.digest('SHA-256', buf);
  return new Uint8Array(h);
}

async function decodeUpdate(base64Content) {
  const raw = Uint8Array.from(atob(base64Content), c => c.charCodeAt(0));
  const outer = parseTlv(raw);
  const get = (t) => outer.find(r => r.type === t)?.value;
  const getHex = (t) => { const v = get(t); return v ? bytesToHex(v) : ''; };
  const getU64 = (t) => { const v = get(t); if (!v || v.length < 8) return 0; let n=0; for(let i=0;i<8;i++) n=n*256+v[i]; return n; };
  const getU32 = (t) => { const v = get(t); if (!v || v.length < 4) return 0; return (v[0]<<24)|(v[1]<<16)|(v[2]<<8)|v[3]; };

  const seq = getU64(4);
  const prevHash = getHex(6);
  const blockHeight = getU32(10);
  const operatorHex = getHex(0);

  const msgBytes = get(8);
  let opName = '?', opDisc = 0, opFields = [];
  if (msgBytes) {
    const inner = parseTlv(msgBytes);
    if (inner.length > 0 && inner[0].type === 0 && inner[0].value.length === 1) {
      opDisc = inner[0].value[0];
      opName = OP_NAMES[opDisc] || `Unknown(${opDisc})`;
    }
    opFields = inner.map(r => ({
      type: r.type,
      name: FIELD_NAMES[r.type] || `field_${r.type}`,
      hex: bytesToHex(r.value).slice(0, 64) + (r.value.length > 32 ? '…' : ''),
      len: r.value.length,
      text: r.value.every(b => b >= 0x20 && b < 0x7f) ? new TextDecoder().decode(r.value) : null,
      u64: r.value.length === 8 ? (() => { let n=0; for(let i=0;i<8;i++) n=n*256+r.value[i]; return n; })() : null,
      u32: r.value.length === 4 ? ((r.value[0]<<24)|(r.value[1]<<16)|(r.value[2]<<8)|r.value[3]) : null,
    }));
  }

  // Compute curHash matching the wallet (ksy hashing rules).
  const seqBytes = new Uint8Array(8);
  new DataView(seqBytes.buffer).setUint32(0, seq & 0xFFFFFFFF, true);
  new DataView(seqBytes.buffer).setUint32(4, Math.floor(seq / 0x100000000), true);
  const prevHashBytes = get(6) || new Uint8Array(32);
  const parts = [seqBytes, prevHashBytes];
  if (msgBytes) parts.push(msgBytes);
  const cosignaturesRaw = get(22);
  if (cosignaturesRaw && cosignaturesRaw.length >= 131) {
    let cOff = 0;
    while (cOff + 2 <= cosignaturesRaw.length) {
      const entryLen = (cosignaturesRaw[cOff] << 8) | cosignaturesRaw[cOff + 1];
      cOff += 2;
      if (cOff + entryLen > cosignaturesRaw.length || entryLen < 129) break;
      const sig = cosignaturesRaw.slice(cOff + 33, cOff + 97);
      const mh  = cosignaturesRaw.slice(cOff + 97, cOff + 129);
      parts.push(mh); parts.push(sig);
      cOff += entryLen;
    }
  } else {
    const memberHash = get(16);
    const cosignSig = get(18) || new Uint8Array(64);
    if (memberHash) parts.push(memberHash);
    if (cosignSig.some(b => b !== 0)) parts.push(cosignSig);
  }
  const totalLen = parts.reduce((s, p) => s + p.length, 0);
  const buf = new Uint8Array(totalLen);
  let o = 0; for (const p of parts) { buf.set(p, o); o += p.length; }
  const curHash = bytesToHex(await sha256(buf));

  return { seq, prevHash, curHash, blockHeight, operatorHex, opName, opDisc, opFields, rawTlv: raw };
}

function vsRowColor(opName) {
  if (!opName) return 'var(--fg)';
  if (opName.endsWith('Credit') || opName === 'InvoiceFulfill' || opName === 'OnchainFulfill') return 'var(--green)';
  if (opName.endsWith('Lock') || opName.endsWith('Fail')) return 'var(--yellow)';
  if (opName.startsWith('Dispute') || opName === 'LedgerClose' || opName === 'DepositClose') return 'var(--red)';
  if (opName.startsWith('Quorum') || opName.startsWith('Ledger')) return 'var(--purple)';
  if (opName.startsWith('Transfer') || opName.startsWith('Deposit')) return 'var(--blue)';
  return 'var(--fg)';
}

async function ingest(events) {
  const seenKey = new Set(vsState.all.map(u => u.seq + ':' + u.curHash));
  const decoded = [];
  for (const ev of events) {
    try {
      const u = await decodeUpdate(ev.content);
      const key = u.seq + ':' + u.curHash;
      if (seenKey.has(key)) continue;
      seenKey.add(key);
      u.eventId = ev.id;
      u.createdAt = ev.created_at;
      decoded.push(u);
    } catch {}
  }
  vsState.all.push(...decoded);
  vsState.all.sort((a, b) => b.seq - a.seq || a.curHash.localeCompare(b.curHash));

  // Mark forks (multiple distinct curHashes at the same seq).
  const seqCount = {};
  for (const u of vsState.all) seqCount[u.seq] = (seqCount[u.seq] || 0) + 1;
  for (const u of vsState.all) u.isFork = seqCount[u.seq] > 1;

  // Branch assignment by operator pubkey, in chronological order so the
  // first-seen operator becomes branch 0.
  const opToBranch = {};
  let next = 0;
  for (const u of [...vsState.all].sort((a, b) => a.seq - b.seq)) {
    const op = u.operatorHex || '';
    if (!(op in opToBranch)) opToBranch[op] = next++;
  }
  for (const u of vsState.all) {
    u.branch = opToBranch[u.operatorHex || ''] ?? 0;
    u.branchColor = BRANCH_COLORS[u.branch % BRANCH_COLORS.length];
  }
  vsState.opToBranch = opToBranch;
  vsState.numBranches = next;

  // Fork points: where a non-main-branch operator's first seq diverges.
  vsState.forkPoints = {};
  for (const u of [...vsState.all].sort((a, b) => a.seq - b.seq)) {
    if (u.branch > 0 && !(u.branch in vsState.forkPoints)) {
      const mainParent = vsState.all.find(m => m.branch === 0 && m.curHash === u.prevHash);
      vsState.forkPoints[u.branch] = {
        forkSeq: mainParent ? mainParent.seq : u.seq - 1,
        branchSeq: u.seq,
        operator: u.operatorHex,
      };
    }
  }

  applyBranchFilter();
  renderBranchTabs();
  renderStatus();
}

function applyBranchFilter() {
  vsState.rendered = vsState.branch === 'all'
    ? vsState.all
    : vsState.all.filter(u => u.branch === vsState.branch);
  document.getElementById('vs-spacer').style.height = (vsState.rendered.length * VS_ROW_H) + 'px';
}

function renderBranchTabs() {
  const wrap = document.getElementById('branch-tabs');
  if (vsState.numBranches <= 1) { wrap.innerHTML = ''; return; }
  let html = '';
  const totalAll = vsState.all.length;
  html += `<button class="branch-tab ${vsState.branch === 'all' ? 'active' : ''}" data-branch="all" style="border-left-color:var(--border);">all <span class="pk">(${totalAll})</span></button>`;
  for (let b = 0; b < vsState.numBranches; b++) {
    const op = Object.entries(vsState.opToBranch).find(([, v]) => v === b)?.[0] || '';
    const count = vsState.all.filter(u => u.branch === b).length;
    const label = b === 0 ? 'operator' : `fork ${b}`;
    const color = BRANCH_COLORS[b % BRANCH_COLORS.length];
    html += `<button class="branch-tab ${vsState.branch === b ? 'active' : ''}" data-branch="${b}" style="border-left-color:${color};">${label} (${count}) <span class="pk">${escapeHtml(op.slice(0, 8))}…</span></button>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll('button[data-branch]').forEach(btn => {
    btn.onclick = () => {
      const b = btn.dataset.branch;
      vsState.branch = b === 'all' ? 'all' : Number(b);
      vsState.expanded = null;
      closeDetail();
      applyBranchFilter();
      vsRender();
      renderBranchTabs();
    };
  });
}

function renderStatus() {
  const el = document.getElementById('vs-status');
  const loaded = vsState.all.length;
  const more = vsState.hasMoreOlder ? ', loading more as you scroll' : ' (all loaded)';
  el.textContent = `${loaded} update${loaded === 1 ? '' : 's'} loaded${more}`;
}

function vsRender() {
  const viewport = document.getElementById('vs-viewport');
  const rows = document.getElementById('vs-rows');
  const scrollTop = viewport.scrollTop;
  const viewH = viewport.clientHeight;

  const first = Math.max(0, Math.floor(scrollTop / VS_ROW_H) - VS_OVERSCAN);
  const last  = Math.min(vsState.rendered.length - 1, Math.ceil((scrollTop + viewH) / VS_ROW_H) + VS_OVERSCAN);

  let html = '';
  for (let i = first; i <= last; i++) {
    const u = vsState.rendered[i];
    const top = i * VS_ROW_H;
    const time = u.createdAt ? fmt.ts(u.createdAt) : '';
    const color = vsRowColor(u.opName);
    const isExpanded = vsState.expanded === i;
    const branchColor = u.branchColor || 'var(--border)';
    const opLabel = (u.operatorHex || '').slice(0, 12);
    const forkTag = u.isFork ? `<span class="fork">FORK</span>` : '';
    let forkLink = '';
    const fp = vsState.forkPoints[u.branch];
    if (fp && u.seq === fp.branchSeq) {
      forkLink = ` <a href="#seq=${fp.forkSeq}" class="forklink" style="color:${branchColor};" onclick="event.stopPropagation();">forked from #${fp.forkSeq}</a>`;
    }
    html += `<div class="vs-row ${isExpanded ? 'active' : ''}" style="top:${top}px; height:${VS_ROW_H}px; border-left-color:${branchColor};" data-idx="${i}">
      <div class="top">
        <span><span class="seq">#${u.seq}</span><span class="opname" style="color:${color};">${escapeHtml(u.opName)}</span>${forkTag}${forkLink}</span>
        <span style="color:var(--fg-muted); font-size:0.72rem;">${escapeHtml(time)}</span>
      </div>
      <div class="meta">hash ${u.curHash.slice(0, 12)}… block ${u.blockHeight} <span class="op">op ${escapeHtml(opLabel)}…</span></div>
    </div>`;
  }
  rows.innerHTML = html;
  rows.querySelectorAll('.vs-row').forEach(r => {
    r.onclick = () => vsToggle(Number(r.dataset.idx));
  });
}

function vsToggle(idx) {
  if (vsState.expanded === idx) {
    closeDetail();
    return;
  }
  vsState.expanded = idx;
  const u = vsState.rendered[idx];
  if (!u) return;
  history.replaceState(null, '', `#seq=${u.seq}`);

  const viewport = document.getElementById('vs-viewport');
  viewport.style.height = VS_VIEWPORT_DETAIL + 'px';

  const detail = document.getElementById('vs-detail');
  const time = u.createdAt ? fmt.ts(u.createdAt) : '';
  const color = vsRowColor(u.opName);
  detail.innerHTML = `
    <div class="head">
      <div class="title"><span style="color:var(--fg-dim);">#${u.seq}</span> <span style="color:${color};">${escapeHtml(u.opName)}</span></div>
      <div class="actions">
        <a href="/update#event=${u.eventId}&relay=${encodeURIComponent(RELAY_URL)}">open ↗</a>
        <button class="close" onclick="window._vsClose()">close</button>
      </div>
    </div>
    <div class="submeta">${escapeHtml(time)} · block ${u.blockHeight} · hash ${u.curHash.slice(0, 16)}… · prev ${u.prevHash.slice(0, 16)}…</div>
    <pre class="hexdump">${hexDump(u.rawTlv)}</pre>`;
  detail.style.display = 'block';
  vsRender();
}

function closeDetail() {
  vsState.expanded = null;
  document.getElementById('vs-detail').style.display = 'none';
  document.getElementById('vs-viewport').style.height = VS_VIEWPORT_FULL + 'px';
  history.replaceState(null, '', '#');
  vsRender();
}
window._vsClose = closeDetail;

async function loadMoreOlder() {
  if (vsState.fetching || !vsState.hasMoreOlder) return;
  vsState.fetching = true;
  try {
    const filter = { kinds: [9100], '#d': [vsState.ledgerTag], limit: VS_PAGE };
    if (vsState.oldestUntil != null) filter.until = vsState.oldestUntil;
    const events = await nostrFetch(RELAY_URL, filter);
    if (!events.length) { vsState.hasMoreOlder = false; renderStatus(); return; }
    const sizeBefore = vsState.all.length;
    await ingest(events);
    const oldest = events.reduce((m, e) => Math.min(m, e.created_at), Infinity);
    vsState.oldestUntil = (vsState.oldestUntil != null && oldest >= vsState.oldestUntil) ? oldest - 1 : oldest;
    if (vsState.all.length === sizeBefore) vsState.hasMoreOlder = false;
    if (events.length < VS_PAGE) vsState.hasMoreOlder = false;
    renderStatus();
    vsRender();
  } finally {
    vsState.fetching = false;
  }
}

async function jumpToSeq(seq) {
  // Already loaded?
  let idx = vsState.rendered.findIndex(u => u.seq === seq);
  if (idx < 0) {
    // Try a relay-side targeted fetch (#n).
    const events = await nostrFetch(RELAY_URL, { kinds: [9100], '#d': [vsState.ledgerTag], '#n': [String(seq)], limit: 8 });
    if (events.length) {
      await ingest(events);
      // Also pull a window of older events around it for context.
      const target = events.reduce((m, e) => Math.min(m, e.created_at), Infinity);
      const around = await nostrFetch(RELAY_URL, { kinds: [9100], '#d': [vsState.ledgerTag], until: target + 1, limit: VS_PAGE });
      if (around.length) await ingest(around);
    }
    idx = vsState.rendered.findIndex(u => u.seq === seq);
  }
  if (idx < 0) return;
  const viewport = document.getElementById('vs-viewport');
  viewport.scrollTop = Math.max(0, idx * VS_ROW_H - viewport.clientHeight / 2);
  vsRender();
  vsToggle(idx);
}

function attachScrollHandler() {
  const viewport = document.getElementById('vs-viewport');
  viewport.addEventListener('scroll', () => {
    vsRender();
    const scrollBottom = viewport.scrollHeight - (viewport.scrollTop + viewport.clientHeight);
    if (scrollBottom < VS_NEAR_BOTTOM_PX) loadMoreOlder();
  });
}

async function loadActivity(ledgerId) {
  vsState.ledgerTag = ledgerId.slice(0, 16);
  const status = document.getElementById('vs-status');
  status.textContent = 'querying relay…';
  await loadMoreOlder();
  if (vsState.all.length === 0) {
    document.getElementById('vs-empty').innerHTML =
      `<div class="empty">No ledger updates fetched. Either no activity or relay didn't surface this ledger's history.</div>`;
    return;
  }
  document.getElementById('vs-viewport').style.display = 'block';
  attachScrollHandler();
  vsRender();

  // Honor #seq=<n> in the URL after initial load.
  const seqParam = getParam('seq');
  if (seqParam != null) {
    const n = Number(seqParam);
    if (Number.isFinite(n)) jumpToSeq(n);
  }

  // Re-fire on hash changes (e.g. user clicks a "forked from #N" link).
  window.addEventListener('hashchange', () => {
    const s = getParam('seq');
    if (s == null) { closeDetail(); return; }
    const n = Number(s);
    if (Number.isFinite(n)) jumpToSeq(n);
  });
}

async function main() {
  let ledgerId;
  try { ledgerId = resolveLedgerFromUrl(); }
  catch (e) {
    document.getElementById('ledger-id').textContent = '— error';
    document.getElementById('overview-body').innerHTML =
      `<div class="empty err">${escapeHtml(e.message)}</div>`;
    document.getElementById('vs-status').textContent = '';
    return;
  }
  document.getElementById('ledger-id').textContent = ledgerId;

  const adFilter = { kinds: [39100], '#d': [ledgerId], limit: 1 };
  // Kind 9100 events tag the 16-char `ledger_tag` (deposits-nostr
  // `ledger_tag()`), not the full hex id; and the operation type
  // is exposed as the single-letter `t` tag (12 = QuorumBegin) so
  // the relay can return only that op-class. Cost is O(rotations),
  // not O(updates) — fine on ledgers with millions of entries.
  const ledgerUpdatesFilter = { kinds: [9100], '#d': [ledgerId.slice(0, 16)], '#t': ['12'], limit: 5 };
  const priceFilter = { kinds: [39101], '#d': ['btcusd'], limit: 5 };

  const [adEvents, cosignerLedgers, ledgerUpdateEvents, priceEvents] = await Promise.all([
    nostrFetch(RELAY_URL, adFilter),
    fetchCosignerLedgerMap(RELAY_URL, ledgerId.slice(0, 16)),
    nostrFetch(RELAY_URL, ledgerUpdatesFilter),
    nostrFetch(RELAY_URL, priceFilter),
  ]);

  let ad = null;
  if (adEvents.length) {
    adEvents.sort((a, b) => b.created_at - a.created_at);
    try { ad = JSON.parse(adEvents[0].content); } catch {}
  }

  // Find the most recent QuorumBegin (opDisc 12, quorum_expiry = field type 86).
  let quorumExpiry = 0;
  if (ledgerUpdateEvents.length) {
    ledgerUpdateEvents.sort((a, b) => b.created_at - a.created_at);
    for (const ev of ledgerUpdateEvents) {
      try {
        const u = await decodeUpdate(ev.content);
        if (u.opDisc === 12) {
          const f = u.opFields.find(f => f.type === 86);
          if (f && f.u32 != null) { quorumExpiry = f.u32; break; }
        }
      } catch {}
    }
  }

  // Chain tip = highest `block_height` across recent BTC/USD oracle
  // events (DEP-04 §Price Oracle). Older publishers omit it; sampling
  // multiple events keeps a single bad publisher from dragging the
  // tip backwards and tolerates a fresh-but-stripped publisher.
  let chainTip = 0;
  for (const ev of priceEvents) {
    try {
      const data = JSON.parse(ev.content);
      if (Number.isFinite(data.block_height) && data.block_height > chainTip) {
        chainTip = data.block_height;
      }
    } catch {}
  }

  renderOverview(ad, cosignerLedgers, quorumExpiry, chainTip);
  loadActivity(ledgerId);
}

main();
</script>
