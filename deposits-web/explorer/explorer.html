<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deposits Explorer</title>
  <style>
    :root {
      --bg:        #11131f;
      --bg-elev:   #181c2c;
      --bg-card:   #1d2237;
      --bg-card-h: #232943;
      --border:    #2a304a;
      --border-strong: #3a4263;
      --fg:        #e7e9f0;
      --fg-strong: #ffffff;
      --fg-muted:  #8d96b3;
      --fg-dim:    #5b6386;
      --accent:    #f7931a;
      --green:     #4cae5a;
      --red:       #d9534f;
      --yellow:    #f0ad4e;
      --blue:      #5b8def;
      --purple:    #b58cf0;
      --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body {
      margin: 0;
      color: var(--fg);
      font: 14px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }

    /* ── nav ─────────────────────────────────────────────────────── */
    .topnav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.25rem;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .brand {
      display: flex; align-items: baseline; gap: 0.45rem;
      font-weight: 600; font-size: 1.05rem;
    }
    .brand .logo {
      color: var(--accent); font-size: 1.25rem; line-height: 1;
    }
    .brand .name { color: var(--fg-strong); }
    .brand .sub { color: var(--fg-muted); font-weight: 400; font-size: 0.85rem; }
    .nav-links { display: flex; gap: 1rem; font-size: 0.9rem; color: var(--fg-muted); }
    .nav-links a.active { color: var(--accent); }

    /* ── stats strip ─────────────────────────────────────────────── */
    .stats-strip {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat {
      background: var(--bg-elev);
      padding: 1.1rem 1.25rem 0.95rem;
    }
    .stat-value {
      font: 600 1.65rem/1 var(--sans);
      color: var(--fg-strong);
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.accent { color: var(--accent); }
    .stat-label {
      margin-top: 0.3rem;
      color: var(--fg-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    @media (max-width: 720px) {
      .stats-strip { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── main ────────────────────────────────────────────────────── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }
    h1.section-title {
      font-size: 0.78rem; font-weight: 600;
      color: var(--fg-muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 0 0 0.85rem;
    }

    /* ── operator card ───────────────────────────────────────────── */
    .operator {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .operator-header {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
    }
    .operator-name {
      font-size: 1rem; font-weight: 600;
      color: var(--fg-strong);
      margin: 0;
      display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
    }
    .operator-name .pubkey {
      color: var(--fg-dim);
      font: 400 0.78rem var(--mono);
    }
    .operator-summary {
      color: var(--fg-muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }
    .operator-summary b {
      color: var(--fg-strong);
      font-weight: 600;
    }
    .ledger-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      /* Wider gap (4px) makes the underlying texture readable
         between tiles. Empty trailing tracks (auto-fill keeps them)
         show the same texture, so the grid never looks "amputated"
         when ledger count doesn't fill the row. */
      gap: 4px;
      background: repeating-linear-gradient(
        -45deg,
        var(--bg-card) 0,
        var(--bg-card) 14px,
        var(--bg-elev) 14px,
        var(--bg-elev) 28px
      );
    }
    .ledger-tile {
      background: var(--bg-card);
      padding: 0.85rem 1rem;
      transition: background 0.1s;
      display: block;
    }
    .ledger-tile:hover { background: var(--bg-card-h); color: inherit; }
    .ledger-tile .lid {
      font: 0.82rem var(--mono);
      color: var(--accent);
      word-break: break-all;
      margin-bottom: 0.45rem;
    }
    .ledger-tile .row {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--fg-muted);
      font-variant-numeric: tabular-nums;
      margin-top: 0.2rem;
    }
    .ledger-tile .row b {
      color: var(--fg);
      font-weight: 500;
    }

    /* ── badges ──────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 0.05rem 0.45rem;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      vertical-align: 1px;
    }
    .badge.active   { background: rgba(76, 174, 90, 0.18); color: var(--green); }
    .badge.pre      { background: rgba(141, 150, 179, 0.15); color: var(--fg-muted); }
    .badge.expired  { background: rgba(217, 83, 79, 0.18); color: var(--red); }
    .badge.dispute  { background: rgba(217, 83, 79, 0.18); color: var(--red); }
    .badge.q        { background: rgba(91, 141, 239, 0.18); color: var(--blue); }
    .badge.gated    { background: rgba(240, 173, 78, 0.18); color: var(--yellow); }

    /* ── status / errors ─────────────────────────────────────────── */
    .empty {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      color: var(--fg-muted);
    }
    .empty.err { color: var(--red); border-color: rgba(217, 83, 79, 0.4); }
    .loading { color: var(--fg-muted); padding: 0.5rem 0; }

    /* ── footer ──────────────────────────────────────────────────── */
    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--fg-dim);
      font-size: 0.78rem;
      text-align: center;
    }
    footer .mono { font-family: var(--mono); color: var(--fg-muted); }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">
      <span class="logo">⟁</span>
      <span class="name">deposits</span>
      <span class="sub">explorer</span>
    </div>
    <div class="nav-links" id="crumbs"></div>
  </nav>

  <div class="stats-strip">
    <div class="stat">
      <div class="stat-value" id="op-count">—</div>
      <div class="stat-label">operators</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="ledger-count">—</div>
      <div class="stat-label">ledgers</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="active-count">—</div>
      <div class="stat-label">active quorums</div>
    </div>
    <div class="stat">
      <div class="stat-value accent" id="reserves-total">—</div>
      <div class="stat-label">total reserves</div>
    </div>
  </div>

  <main>
    <h1 class="section-title">operators</h1>
    <div id="operators"><div class="loading">querying relay…</div></div>
    <footer>
      data via nostr relay <span class="mono" id="relay-url"></span>
    </footer>
  </main>

<script type="module">
import { parseTlv, b64ToBytes, installBreadcrumbs } from './shared.js';

// Breadcrumb trail — overview is the root (just the current crumb here).
installBreadcrumbs('overview');

const BECH32_CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';

function getParam(name) {
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (hashParams.has(name)) return hashParams.get(name);
  return new URLSearchParams(window.location.search).get(name);
}

function bytesToBech32(bytes) {
  let acc = 0, bits = 0, out = '';
  for (const b of bytes) {
    acc = (acc << 8) | b; bits += 8;
    while (bits >= 5) { bits -= 5; out += BECH32_CHARSET[(acc >> bits) & 0x1f]; }
  }
  if (bits > 0) out += BECH32_CHARSET[(acc << (5 - bits)) & 0x1f];
  return out;
}

function hexToBytes(s) {
  const out = new Uint8Array(s.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(s.slice(i * 2, i * 2 + 2), 16);
  return out;
}

const RELAY_URL =
  getParam('relay')
  || document.querySelector('meta[name=relay]')?.content
  || 'wss://relay.bitcoindeposits.net';

document.getElementById('relay-url').textContent = RELAY_URL;

// In prod the explorer lives at `explorer.<basedomain>` and per-ledger
// views at `<bech32>.ledger.<basedomain>`. Detect that and link
// accordingly. Otherwise (dev) link to `/ledger#ledger=…&relay=…`.
function ledgerLink(ledgerIdHex) {
  const host = window.location.hostname;
  const sub = bytesToBech32(hexToBytes(ledgerIdHex));
  if (host.startsWith('explorer.')) {
    const base = host.replace(/^explorer\./, 'ledger.');
    return `https://${sub}.${base}/`;
  }
  const params = new URLSearchParams({ ledger: ledgerIdHex, relay: RELAY_URL });
  return `/ledger#${params.toString()}`;
}

function nostrFetch(relayUrl, filter, { timeoutMs = 8000 } = {}) {
  return new Promise((resolve) => {
    const events = [];
    let ws;
    try { ws = new WebSocket(relayUrl); }
    catch { resolve([]); return; }
    const subId = 'q' + Math.random().toString(36).slice(2, 8);
    const finish = () => { try { ws.close(); } catch {} clearTimeout(timer); resolve(events); };
    const timer = setTimeout(finish, timeoutMs);
    ws.onopen = () => ws.send(JSON.stringify(['REQ', subId, filter]));
    ws.onmessage = (msg) => {
      try {
        const d = JSON.parse(msg.data);
        if (d[0] === 'EVENT' && d[1] === subId) events.push(d[2]);
        else if (d[0] === 'EOSE' && d[1] === subId) finish();
      } catch {}
    };
    ws.onerror = finish;
    ws.onclose = finish;
  });
}

const fmt = {
  short: (s, n = 16) => s ? s.slice(0, n) + (s.length > n ? '…' : '') : '',
  msats: (n) => {
    if (n == null) return '—';
    const sats = n / 1000;
    if (sats >= 100_000_000) {
      return `₿ ${(sats / 100_000_000).toLocaleString(undefined, { maximumFractionDigits: 4 })}`;
    }
    if (sats >= 1_000) return `${sats.toLocaleString()} sat`;
    return `${sats} sat`;
  },
  bps: (b) => b == null ? '—' : `${(b / 100).toFixed(2)}%`,
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function quorumBadge(state) {
  const cls = state === 'Active' ? 'active'
    : state === 'PreQuorum' ? 'pre'
    : state === 'Expired' ? 'expired'
    : state === 'Unknown' ? 'pre'  // neutral/muted — no chain tip to decide
    : '';
  return `<span class="badge ${cls}">${escapeHtml(state || 'unknown')}</span>`;
}

// Decode `quorum_expiry` (TLV field 86, u32) from a Kind 9100
// QuorumBegin event. Caller already filtered by `#t: ['12']`, so the
// inner discriminant is known to be 12. Returns null on malformed
// input (treated as unknown).
function extractQuorumExpiry(eventContent) {
  try {
    const raw = b64ToBytes(eventContent);
    const outer = parseTlv(raw);
    const msg = outer.find(r => r.type === 8)?.value;
    if (!msg) return null;
    const inner = parseTlv(msg);
    const rec = inner.find(r => r.type === 86);
    if (!rec || rec.value.length < 4) return null;
    const v = rec.value;
    return (v[0] << 24) | (v[1] << 16) | (v[2] << 8) | v[3];
  } catch { return null; }
}

// Derive quorum state from messages we trust independently of the
// operator's advertisement: cosigned QuorumBegin gives `expiry`, the
// cross-operator price oracle gives `tip`. Never falls back to the
// ad's self-reported `quorum_state`.
function deriveQuorumState(expiry, tip) {
  if (!expiry) return 'PreQuorum';
  if (!tip) return 'Unknown';
  return tip >= expiry ? 'Expired' : 'Active';
}

async function main() {
  // Three relay round-trips in parallel:
  //   - Kind 39100: one ad per (pubkey, d-tag).
  //   - Kind 9100 with #t='12': every QuorumBegin across the network.
  //     `t` is the op-discriminant tag; QuorumBegin = 12. Filtering
  //     server-side keeps this O(rotations) instead of O(updates).
  //   - Kind 39101: BTC/USD price feed; we read the highest
  //     `block_height` to derive Active/Expired without trusting the
  //     operator's self-reported quorum_state on each ad.
  const [events, qbEvents, priceEvents] = await Promise.all([
    nostrFetch(RELAY_URL, { kinds: [39100], limit: 500 }),
    nostrFetch(RELAY_URL, { kinds: [9100], '#t': ['12'], limit: 5000 }),
    nostrFetch(RELAY_URL, { kinds: [39101], '#d': ['btcusd'], limit: 5 }),
  ]);

  const ads = [];
  for (const e of events) {
    try {
      const ad = JSON.parse(e.content);
      ad.signer_pubkey = e.pubkey;
      ads.push(ad);
    } catch {}
  }

  // ledger_tag (16-char prefix of ledger_id) → newest QuorumBegin's
  // `quorum_expiry`. Multiple QuorumBegins per ledger are possible
  // (rotations); keep the most recent by created_at.
  const tagToExpiry = new Map();
  for (const ev of qbEvents) {
    const dTag = (ev.tags || []).find(t => t[0] === 'd')?.[1];
    if (!dTag) continue;
    const prev = tagToExpiry.get(dTag);
    if (prev && prev.created_at >= ev.created_at) continue;
    const expiry = extractQuorumExpiry(ev.content);
    if (expiry == null) continue;
    tagToExpiry.set(dTag, { expiry, created_at: ev.created_at });
  }

  // Chain tip = highest `block_height` across recent BTC/USD oracle
  // events (DEP-04 §Price Oracle); a single bad publisher can't drag
  // it backwards.
  let chainTip = 0;
  for (const ev of priceEvents) {
    try {
      const data = JSON.parse(ev.content);
      if (Number.isFinite(data.block_height) && data.block_height > chainTip) {
        chainTip = data.block_height;
      }
    } catch {}
  }

  // Annotate each ad with the derived state once.
  for (const ad of ads) {
    const tag = (ad.ledger_id || '').slice(0, 16);
    const expiry = tagToExpiry.get(tag)?.expiry;
    ad.derived_quorum_state = deriveQuorumState(expiry, chainTip);
  }

  const byOp = new Map();
  for (const ad of ads) {
    const k = ad.operator_pubkey || ad.signer_pubkey;
    if (!byOp.has(k)) byOp.set(k, { name: ad.operator_name || null, ledgers: [] });
    const op = byOp.get(k);
    if (!op.name && ad.operator_name) op.name = ad.operator_name;
    op.ledgers.push(ad);
  }

  const operators = [...byOp.entries()]
    .sort(([ka, va], [kb, vb]) => (va.name || ka).localeCompare(vb.name || kb));
  for (const [, op] of operators) {
    op.ledgers.sort((a, b) => a.ledger_id.localeCompare(b.ledger_id));
  }

  let totalReservesMsat = 0, totalActive = 0;
  for (const ad of ads) {
    totalReservesMsat += Number(ad.reserves_amount_msats || 0);
    if (ad.derived_quorum_state === 'Active') totalActive += 1;
  }

  document.getElementById('op-count').textContent = operators.length || '0';
  document.getElementById('ledger-count').textContent = ads.length || '0';
  document.getElementById('active-count').textContent = totalActive;
  document.getElementById('reserves-total').textContent = fmt.msats(totalReservesMsat);

  const root = document.getElementById('operators');
  if (!operators.length) {
    root.innerHTML = `<div class="empty err">No advertisements on
      <span style="font-family:var(--mono)">${escapeHtml(RELAY_URL)}</span>.
      Append <code>#relay=wss://your-relay</code> to point at a different one.</div>`;
    return;
  }

  root.innerHTML = operators.map(([pubkey, op]) => {
    const opReserves = op.ledgers.reduce((s, a) => s + Number(a.reserves_amount_msats || 0), 0);
    return `
      <article class="operator">
        <header class="operator-header">
          <h2 class="operator-name">
            <span>${escapeHtml(op.name || '(unnamed operator)')}</span>
            <span class="pubkey">${escapeHtml(pubkey)}</span>
          </h2>
          <div class="operator-summary">
            <b>${op.ledgers.length}</b> ledger${op.ledgers.length === 1 ? '' : 's'}
            · <b>${escapeHtml(fmt.msats(opReserves))}</b> reserves
          </div>
        </header>
        <div class="ledger-grid">
          ${op.ledgers.map(ad => `
            <a class="ledger-tile" href="${escapeHtml(ledgerLink(ad.ledger_id))}">
              <div class="lid">${escapeHtml(fmt.short(ad.ledger_id, 32))}</div>
              <div class="row">
                <span>${quorumBadge(ad.derived_quorum_state)} ${
                  ad.quorum_members?.length ? `<span class="badge q">Q=${ad.quorum_members.length}</span>` : ''
                } ${ad.access_control ? '<span class="badge gated">gated</span>' : ''}</span>
                <span class="muted">${escapeHtml(ad.network || '')}</span>
              </div>
              <div class="row">
                <span><b>${escapeHtml(fmt.msats(ad.reserves_amount_msats))}</b> reserves</span>
                <span><b>${escapeHtml(fmt.msats(ad.collateral_amount_msats))}</b> collateral</span>
              </div>
              <div class="row">
                <span>${escapeHtml(fmt.bps(ad.annual_fee_bps))} + ${escapeHtml(fmt.msats(ad.annualized_fixed_msats))}/yr</span>
                <span>${ad.max_deposit_balance_msats
                  ? `cap ${escapeHtml(fmt.msats(ad.max_deposit_balance_msats))}`
                  : 'no cap'}</span>
              </div>
            </a>`).join('')}
        </div>
      </article>`;
  }).join('');
}

main();
</script>
</body>
</html>
