<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deposits Explorer</title>
  <style>
    :root {
      --fg: #d8dee9;
      --fg-muted: #8c95a3;
      --bg: #1a1d23;
      --panel: #232830;
      --border: #2c323b;
      --accent: #88c0d0;
      --warn: #d08770;
      --ok: #a3be8c;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 1rem 4rem 1rem;
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 system-ui, sans-serif;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 {
      font-size: 1.1rem; font-weight: 600;
      margin: 1.5rem 0 0.25rem;
      color: var(--fg-muted);
    }
    h1 small { color: var(--fg-muted); font-size: 0.85rem; font-weight: normal; }
    .stats { display: flex; gap: 1.5rem; margin: 0.5rem 0 1rem; color: var(--fg-muted); font-size: 0.85rem; }
    .stats b { color: var(--fg); font-weight: 600; }
    .operator {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin: 0.75rem 0;
    }
    .operator h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }
    .operator h2 .name { color: var(--fg); }
    .operator h2 .pubkey {
      color: var(--fg-muted);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: normal;
    }
    .operator table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .operator th, .operator td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); }
    .operator th { color: var(--fg-muted); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.04em; }
    .operator tr:last-child td { border-bottom: 0; }
    .operator td.mono { font-family: var(--mono); font-size: 0.8rem; }
    .pill {
      display: inline-block; padding: 0.05rem 0.4rem; border-radius: 3px;
      font-size: 0.7rem; background: var(--border); color: var(--fg);
    }
    .pill.active { background: var(--ok); color: var(--bg); }
    .pill.expired { background: var(--warn); color: var(--bg); }
    .pill.pre { background: var(--border); color: var(--fg-muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .err { color: var(--warn); padding: 0.5rem 0; }
    .loading { color: var(--fg-muted); font-style: italic; }
    .footer { text-align: center; color: var(--fg-muted); font-size: 0.8rem; margin-top: 2rem; }
    .footer .mono { font-family: var(--mono); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>deposits explorer <small id="hint">(loading…)</small></h1>
    <div class="stats">
      <span><b id="op-count">0</b> operators</span>
      <span><b id="ledger-count">0</b> ledgers</span>
      <span><b id="active-count">0</b> active quorums</span>
      <span><b id="reserves-total">—</b> total reserves</span>
    </div>

    <div id="operators"></div>

    <div class="footer">
      data via nostr relay <span class="mono" id="relay-url"></span>
    </div>
  </div>

<script type="module">
const BECH32_CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';

function getParam(name) {
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (hashParams.has(name)) return hashParams.get(name);
  return new URLSearchParams(window.location.search).get(name);
}

function bytesToBech32(bytes) {
  let acc = 0, bits = 0;
  let out = '';
  for (const b of bytes) {
    acc = (acc << 8) | b;
    bits += 8;
    while (bits >= 5) {
      bits -= 5;
      out += BECH32_CHARSET[(acc >> bits) & 0x1f];
    }
  }
  if (bits > 0) out += BECH32_CHARSET[(acc << (5 - bits)) & 0x1f];
  return out;
}

function hexToBytes(s) {
  const out = new Uint8Array(s.length / 2);
  for (let i = 0; i < out.length; i++) {
    out[i] = parseInt(s.slice(i * 2, i * 2 + 2), 16);
  }
  return out;
}

const RELAY_URL =
  getParam('relay')
  || document.querySelector('meta[name=relay]')?.content
  || 'wss://relay.bitcoindeposits.net';

document.getElementById('relay-url').textContent = RELAY_URL;

//
// Determine where ledger links should point.
//
// In prod the explorer lives at `explorer.<basedomain>` (e.g.
// `explorer.bitcoindeposits.net`) and per-ledger views live at
// `<bech32>.ledger.<basedomain>`. We detect prod mode by an
// `explorer.` hostname prefix and link absolutely; otherwise (dev,
// or any non-prod hosting) we fall back to a relative URL on the
// same gateway: `/ledger#ledger=<hex>&relay=<url>`.
//
function ledgerLink(ledgerIdHex) {
  const host = window.location.hostname;
  const ledgerSubdomain = bytesToBech32(hexToBytes(ledgerIdHex));
  if (host.startsWith('explorer.')) {
    const baseDomain = host.replace(/^explorer\./, 'ledger.');
    return `https://${ledgerSubdomain}.${baseDomain}/`;
  }
  // Dev / unknown hosting: pin the relay so we keep looking at the
  // same data the explorer found this ledger on.
  const params = new URLSearchParams();
  params.set('ledger', ledgerIdHex);
  params.set('relay', RELAY_URL);
  return `/ledger#${params.toString()}`;
}

//
// Tiny Nostr REQ helper. Same shape as ledger.html — accumulates
// EVENTs until EOSE or timeout.
//
function nostrFetch(relayUrl, filter, { timeoutMs = 8000 } = {}) {
  return new Promise((resolve) => {
    const events = [];
    let ws;
    try { ws = new WebSocket(relayUrl); }
    catch (e) { resolve([]); return; }
    const subId = 'q' + Math.random().toString(36).slice(2, 8);
    const finish = () => {
      try { ws.close(); } catch {}
      clearTimeout(timer);
      resolve(events);
    };
    const timer = setTimeout(finish, timeoutMs);
    ws.onopen = () => ws.send(JSON.stringify(['REQ', subId, filter]));
    ws.onmessage = (msg) => {
      try {
        const data = JSON.parse(msg.data);
        if (data[0] === 'EVENT' && data[1] === subId) events.push(data[2]);
        else if (data[0] === 'EOSE' && data[1] === subId) finish();
      } catch {}
    };
    ws.onerror = finish;
    ws.onclose = finish;
  });
}

const fmt = {
  short: (s, n = 16) => s ? s.slice(0, n) + (s.length > n ? '…' : '') : '',
  msats: (n) => {
    if (n == null) return '—';
    const sats = n / 1000;
    if (sats >= 100_000_000) return `₿ ${(sats / 100_000_000).toLocaleString(undefined, { maximumFractionDigits: 8 })}`;
    return `${sats.toLocaleString()} sat`;
  },
  bps: (b) => b == null ? '—' : `${(b / 100).toFixed(2)}%`,
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function quorumPill(state) {
  const cls = state === 'Active' ? 'active'
    : state === 'Expired' ? 'expired'
    : state === 'PreQuorum' ? 'pre'
    : '';
  return `<span class="pill ${cls}">${escapeHtml(state || 'unknown')}</span>`;
}

//
// Main: fetch all 39100 ads on the relay, group by operator, render.
//
// Kind 39100 is replaceable per (pubkey, d-tag) — the operator's
// daemon publishes one event per ledger and the relay keeps the
// latest. So a `kinds=[39100]` filter without further constraints
// returns one event per ledger, capped by `limit` for safety.
//
async function main() {
  const events = await nostrFetch(RELAY_URL, { kinds: [39100], limit: 500 });

  const ads = [];
  for (const e of events) {
    try {
      const ad = JSON.parse(e.content);
      ad.event_id = e.id;
      ad.timestamp = e.created_at;
      ad.signer_pubkey = e.pubkey;
      ads.push(ad);
    } catch {}
  }

  // Group by operator. Prefer `operator_pubkey` field; fall back to the
  // event signer (which always equals it in practice).
  const byOp = new Map();
  for (const ad of ads) {
    const key = ad.operator_pubkey || ad.signer_pubkey;
    if (!byOp.has(key)) byOp.set(key, { name: ad.operator_name || null, ledgers: [] });
    const op = byOp.get(key);
    if (!op.name && ad.operator_name) op.name = ad.operator_name;
    op.ledgers.push(ad);
  }

  // Stable order: operators by name (or pubkey), ledgers by ledger_id.
  const operators = [...byOp.entries()]
    .sort(([ka, va], [kb, vb]) =>
      (va.name || ka).localeCompare(vb.name || kb));
  for (const [, op] of operators) {
    op.ledgers.sort((a, b) => a.ledger_id.localeCompare(b.ledger_id));
  }

  let totalReservesMsat = 0;
  let totalActive = 0;
  for (const ad of ads) {
    totalReservesMsat += Number(ad.reserves_amount_msats || 0);
    if (ad.quorum_state === 'Active') totalActive += 1;
  }

  document.getElementById('op-count').textContent = operators.length;
  document.getElementById('ledger-count').textContent = ads.length;
  document.getElementById('active-count').textContent = totalActive;
  document.getElementById('reserves-total').textContent = fmt.msats(totalReservesMsat);
  document.getElementById('hint').textContent = '';

  const root = document.getElementById('operators');
  if (!operators.length) {
    root.innerHTML = `<div class="err">No advertisements on ${escapeHtml(RELAY_URL)}.
      Append <code>#relay=wss://your-relay</code> to point at a different one.</div>`;
    return;
  }

  root.innerHTML = operators.map(([pubkey, op]) => `
    <div class="operator">
      <h2>
        <span class="name">${escapeHtml(op.name || '(unnamed operator)')}</span>
        <span class="pubkey">${escapeHtml(pubkey)}</span>
      </h2>
      <table>
        <thead><tr>
          <th>ledger</th>
          <th>quorum</th>
          <th>reserves</th>
          <th>collateral</th>
          <th>fees / year</th>
        </tr></thead>
        <tbody>
          ${op.ledgers.map(ad => `
            <tr>
              <td><a href="${escapeHtml(ledgerLink(ad.ledger_id))}">${escapeHtml(fmt.short(ad.ledger_id, 24))}</a></td>
              <td>${quorumPill(ad.quorum_state)} ${ad.quorum_members?.length ? `<span class="pill">${ad.quorum_members.length}</span>` : ''}</td>
              <td>${fmt.msats(ad.reserves_amount_msats)}</td>
              <td>${fmt.msats(ad.collateral_amount_msats)}</td>
              <td>${fmt.bps(ad.annual_fee_bps)} + ${fmt.msats(ad.annualized_fixed_msats)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}

main();
</script>
</body>
</html>
