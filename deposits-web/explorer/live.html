<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live · Deposits Explorer</title>
  <style>
    :root {
      --bg:#11131f; --bg-elev:#181c2c; --bg-card:#1d2237; --bg-card-h:#232943;
      --border:#2a304a; --border-strong:#3a4263; --fg:#e7e9f0; --fg-strong:#fff;
      --fg-muted:#8d96b3; --fg-dim:#5b6386; --accent:#f7931a; --green:#4cae5a;
      --red:#d9534f; --yellow:#f0ad4e; --blue:#5b8def; --purple:#b58cf0;
      --mono: ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
      --sans: -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body { margin:0; color:var(--fg); font:14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }
    .topnav { display:flex; align-items:center; justify-content:space-between;
      padding:0.85rem 1.25rem; background:var(--bg-elev); border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:10; }
    .brand { display:flex; align-items:baseline; gap:0.45rem; font-weight:600; font-size:1.05rem; }
    .brand .logo { color:var(--accent); font-size:1.25rem; line-height:1; }
    .brand .name { color:var(--fg-strong); }
    .brand .sub { color:var(--fg-muted); font-weight:400; font-size:0.85rem; }
    .nav-links { display:flex; gap:1rem; font-size:0.9rem; color:var(--fg-muted); }

    main { max-width:1100px; margin:0 auto; padding:1.25rem 1.25rem 4rem; }

    .bar { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; }
    .bar h1 { font-size:1.1rem; margin:0; color:var(--fg-strong); }
    .live-dot { width:9px; height:9px; border-radius:50%; background:var(--fg-dim);
      display:inline-block; margin-right:0.4rem; vertical-align:1px; }
    .live-dot.on { background:var(--green); box-shadow:0 0 0 0 rgba(76,174,90,0.5);
      animation:pulse 2s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(76,174,90,0.5);} 70%{box-shadow:0 0 0 6px rgba(76,174,90,0);} 100%{box-shadow:0 0 0 0 rgba(76,174,90,0);} }
    .stat { color:var(--fg-muted); font-size:0.85rem; }
    .stat b { color:var(--fg-strong); font-variant-numeric:tabular-nums; }
    .btn { margin-left:auto; background:var(--bg-card); border:1px solid var(--border);
      color:var(--fg); border-radius:6px; padding:0.35rem 0.8rem; font:inherit; font-size:0.85rem; cursor:pointer; }
    .btn:hover { border-color:var(--accent); }
    .btn.paused { color:var(--yellow); border-color:var(--yellow); }

    .chart { border:1px solid var(--border); border-radius:8px; background:var(--bg-elev);
      padding:0.5rem 0.6rem; margin-bottom:0.9rem; }
    .chart .lbl { color:var(--fg-dim); font-size:0.66rem; text-transform:uppercase;
      letter-spacing:0.06em; margin-bottom:0.25rem; }
    .chart canvas { width:100%; height:44px; display:block; }

    .feed { border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .row { display:grid; grid-template-columns:5.5rem 8.5rem 1fr 1fr auto;
      gap:0.6rem; align-items:center; padding:0.45rem 0.8rem;
      border-bottom:1px solid var(--border); font-size:0.85rem; }
    .row:last-child { border-bottom:none; }
    .row.fresh { animation:flash 1.2s ease-out; }
    @keyframes flash { from { background:rgba(247,147,26,0.16);} to { background:transparent; } }
    .row .t { color:var(--fg-dim); font-family:var(--mono); font-size:0.78rem; white-space:nowrap; }
    .op { justify-self:start; display:inline-block; padding:0.1rem 0.5rem; border-radius:3px;
      font:600 0.72rem var(--mono); white-space:nowrap; }
    .op.credit{background:rgba(76,174,90,0.15);color:var(--green);}
    .op.settle{background:rgba(70,199,199,0.14);color:#46c7c7;}
    /* Locks (pending holds) and fails (released holds) are informative lifecycle
       markers, not value movements — both rendered muted/de-emphasized. */
    .op.lock,.op.fail{background:var(--border);color:var(--fg-muted);}
    .op.deposit{background:rgba(91,141,239,0.15);color:var(--blue);}
    .op.quorum{background:rgba(181,140,240,0.15);color:var(--purple);}
    .op.dispute{background:rgba(217,83,79,0.18);color:var(--red);}
    .op.transfer{background:rgba(91,141,239,0.15);color:var(--blue);}
    .op.unknown{background:var(--border);color:var(--fg-muted);}
    .row .lid, .row .did { font-family:var(--mono); font-size:0.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row .lid a { color:var(--accent); }
    .row .did { color:var(--fg-muted); }
    .row .amt { font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; color:var(--fg); }
    .feed-head { display:grid; grid-template-columns:5.5rem 8.5rem 1fr 1fr auto; gap:0.6rem;
      padding:0.45rem 0.8rem; background:var(--bg-elev); color:var(--fg-muted);
      font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; }
    .feed-head .amt { text-align:right; }
    .empty { padding:2rem; text-align:center; color:var(--fg-muted); }
    footer { margin-top:2rem; padding-top:1rem; border-top:1px solid var(--border);
      color:var(--fg-dim); font-size:0.78rem; text-align:center; }
    footer .mono { font-family:var(--mono); color:var(--fg-muted); }
    @media (max-width:640px) {
      .row, .feed-head { grid-template-columns:4.5rem 7rem 1fr auto; }
      .row .did, .feed-head .did { display:none; }
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="brand"><span class="logo">⟁</span><span class="name">deposits</span><span class="sub">explorer</span></div>
    <div class="nav-links" id="crumbs"></div>
  </nav>

  <main>
    <div class="bar">
      <h1><span class="live-dot" id="dot"></span>live</h1>
      <span class="stat"><b id="count">0</b> updates</span>
      <span class="stat"><b id="rate">0</b>/min</span>
      <span class="stat" id="status">connecting…</span>
      <button class="btn" id="pause">pause</button>
    </div>

    <div class="chart">
      <div class="lbl">activity · updates/sec (last 60s)</div>
      <canvas id="spark"></canvas>
    </div>

    <div class="feed">
      <div class="feed-head"><div>time</div><div>op</div><div>ledger</div><div class="did">deposit</div><div class="amt">amount</div></div>
      <div id="rows"><div class="empty" id="empty">waiting for the next ledger update…</div></div>
    </div>

    <footer>live tap on every kind:9100 across all ledgers · relay <span class="mono" id="relay-url"></span></footer>
  </main>

<script type="module">
import { OP_NAMES } from './tlv-catalog.js';
import { getParam, parseTlv, b64ToBytes, bytesToHex, installBreadcrumbs, installTopNav } from './shared.js';

installBreadcrumbs('live');
installTopNav();

const RELAY_URL =
  getParam('relay')
  || document.querySelector('meta[name=relay]')?.content
  || 'wss://relay.bitcoindeposits.net';
document.getElementById('relay-url').textContent = RELAY_URL;

const MAX_ROWS = 300;
const KIND = 9100;
const FRESH_WINDOW_SEC = 30;  // flash only entries this recent — not the load-time backlog
const AMOUNT_TAG = 2;   // inner-op TLV: amount (msats)
const OP_DISC_TAG = 0;  // inner-op TLV: discriminant

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shortHex(s,n=12){return s?(s.length>n?s.slice(0,n)+'…':s):'';}
function fmtMsats(n){ if(n==null)return ''; const s=n/1000;
  if(s>=100_000_000) return '₿ '+(s/100_000_000).toLocaleString(undefined,{maximumFractionDigits:4});
  if(s>=1000) return s.toLocaleString()+' sat'; return s+' sat'; }
function fmtTime(t){ const d=t?new Date(t*1000):new Date(); return d.toTimeString().slice(0,8); }

function opClass(name){
  if(!name) return 'unknown';
  // Classify by the op's effect on a deposit's balance. A Lock only *holds*
  // funds (balance unchanged, locked++); the matching Fulfill is what settles
  // the outflow. Coloring Fulfill as a credit (inflow) was backwards.
  if(name.endsWith('Credit')) return 'credit';        // inflow
  if(name.endsWith('Lock')) return 'lock';            // pending hold
  if(name.endsWith('Fulfill')||name.endsWith('Complete')) return 'settle'; // settled movement
  if(name.endsWith('Fail')||name.endsWith('Timeout')) return 'fail';       // released / cancelled
  if(name.startsWith('Dispute')||name==='LedgerClose'||name==='DepositClose') return 'dispute';
  if(name.startsWith('Quorum')||name.startsWith('Ledger')) return 'quorum';
  if(name.startsWith('Transfer')) return 'transfer';
  if(name.startsWith('Deposit')) return 'deposit';
  return 'unknown';
}

// Decode a kind:9100 nostr event into a firehose row. Ledger / op / deposit /
// sequence come from the relay-filterable single-letter tags (d/t/i/n); the
// amount is pulled from the inner-op TLV in the base64 content. Exposed for
// tests as window.__decodeEvent.
function decodeEvent(ev){
  const tag = (k) => (ev.tags || []).find(t => t[0] === k)?.[1];
  // The relay `d` tag is only a 16-hex prefix (deposits-nostr `ledger_tag`),
  // which /ledger rejects as "neither 64-hex nor bech32". Recover the full id
  // from the outer SignedLedgerUpdate TLV (tag 2) below; fall back to prefix.
  const ledgerPrefix = (tag('d') || '').toLowerCase();
  let ledgerFull = null;
  const seq = tag('n');
  const deposit = (tag('i') || '').toLowerCase();
  let opDisc = tag('t') != null ? Number(tag('t')) : null;
  let amount = null;
  try {
    const raw = b64ToBytes(ev.content);
    const outer = parseTlv(raw);
    const lidVal = outer.find(r => r.type === 2)?.value;  // full 32-byte ledger_id
    if (lidVal && lidVal.length === 32) ledgerFull = bytesToHex(lidVal);
    const msg = outer.find(r => r.type === 8)?.value;  // message (inner op)
    if (msg) {
      const inner = parseTlv(msg);
      if (opDisc == null) {
        const disc = inner.find(r => r.type === OP_DISC_TAG)?.value;
        if (disc && disc.length === 1) opDisc = disc[0];
      }
      const amt = inner.find(r => r.type === AMOUNT_TAG)?.value;
      if (amt && amt.length === 8) { let n=0; for (const b of amt) n=n*256+b; amount = n; }
    }
  } catch {}
  const op = opDisc != null ? (OP_NAMES[opDisc] || ('Unknown('+opDisc+')')) : '?';
  return { id: ev.id, ts: ev.created_at, ledger: ledgerFull || ledgerPrefix, seq, deposit, op, amount };
}
window.__decodeEvent = decodeEvent;

function rowHtml(r){
  const frag = (l) => `ledger=${encodeURIComponent(l)}&relay=${encodeURIComponent(RELAY_URL)}`;
  // The specific ledger entry — per-event view, keyed by the nostr event id.
  // Time and op badge both drill into it; ledger/deposit go to their own pages.
  const entry = r.id
    ? `/update#event=${encodeURIComponent(r.id)}&`
      + (r.ledger ? frag(r.ledger) : `relay=${encodeURIComponent(RELAY_URL)}`)
    : null;
  const t = entry ? `<a href="${entry}">${esc(fmtTime(r.ts))}</a>` : esc(fmtTime(r.ts));
  const opBadge = entry
    ? `<a href="${entry}" class="op ${opClass(r.op)}">${esc(r.op)}</a>`
    : `<span class="op ${opClass(r.op)}">${esc(r.op)}</span>`;
  const lid = r.ledger
    ? `<a href="/ledger#${frag(r.ledger)}">${esc(shortHex(r.ledger,16))}</a>`
    : '—';
  const did = r.deposit
    ? `<a href="/deposit#deposit=${encodeURIComponent(r.deposit)}&${frag(r.ledger)}">${esc(shortHex(r.deposit,12))}</a>`
    : '—';
  return `<div class="t">${t}</div>`
    + opBadge
    + `<div class="lid">${lid}${r.seq!=null?` <span style="color:var(--fg-dim)">#${esc(r.seq)}</span>`:''}</div>`
    + `<div class="did">${did}</div>`
    + `<div class="amt">${r.amount!=null?esc(fmtMsats(r.amount)):''}</div>`;
}
window.__rowHtml = rowHtml;

// ── live state ──
const rowsEl = document.getElementById('rows');
const emptyEl = document.getElementById('empty');
let total = 0, paused = false, ws = null;
const seen = new Set();
const recent = []; // timestamps (ms) for rate
const CHART_SECONDS = 60;
const buckets = new Array(CHART_SECONDS).fill(0); // per-second arrival counts; newest = last
window.__activityBuckets = buckets; // exposed for tests

function addEvent(ev){
  if (!ev || !ev.id || seen.has(ev.id)) return;
  seen.add(ev.id);
  if (seen.size > 5000) seen.clear(); // bound memory
  total++;
  document.getElementById('count').textContent = total.toLocaleString();
  recent.push(Date.now());
  buckets[buckets.length - 1]++; // count this second's arrivals (chart tracks activity even when paused)
  if (paused) return;

  if (emptyEl && emptyEl.parentNode) emptyEl.remove();
  const r = decodeEvent(ev);
  const ts = r.ts || 0;
  const div = document.createElement('div');
  // Flash only genuinely-new entries. The relay replays a backlog on load (and
  // may resend old events); those used to light up the whole page on arrival.
  const isFresh = ts >= (Date.now() / 1000) - FRESH_WINDOW_SEC;
  div.className = isFresh ? 'row fresh' : 'row';
  div.dataset.ts = String(ts);
  div.innerHTML = rowHtml(r);
  // Insert sorted by created_at descending (newest on top). Blind prepend
  // reversed the relay backlog, which arrives newest-first — so an idle feed
  // ended up oldest-on-top. Walk from the top to the first older row.
  let anchor = null;
  for (const child of rowsEl.children) {
    if (Number(child.dataset.ts || 0) < ts) { anchor = child; break; }
  }
  if (anchor) rowsEl.insertBefore(div, anchor); else rowsEl.appendChild(div);
  while (rowsEl.children.length > MAX_ROWS) rowsEl.removeChild(rowsEl.lastChild);
}
window.__addEvent = addEvent;

setInterval(() => {
  const cut = Date.now() - 60_000;
  while (recent.length && recent[0] < cut) recent.shift();
  document.getElementById('rate').textContent = recent.length.toString();
  // Roll the activity histogram one second forward, then redraw.
  buckets.push(0);
  while (buckets.length > CHART_SECONDS) buckets.shift();
  drawChart();
}, 1000);

// Activity sparkline: per-second arrival counts, oldest→newest left→right.
function drawChart(){
  const cv = document.getElementById('spark');
  if (!cv) return;
  const w = cv.clientWidth || 600, h = 44;
  if (cv.width !== w) cv.width = w;
  if (cv.height !== h) cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  const max = Math.max(1, ...buckets);
  const n = buckets.length;
  const bw = w / n;
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#f7931a';
  ctx.fillStyle = accent;
  for (let i = 0; i < n; i++){
    if (!buckets[i]) continue;
    const bh = Math.max(1, Math.round((buckets[i] / max) * (h - 2)));
    ctx.fillRect(i * bw, h - bh, Math.max(1, bw - 1), bh);
  }
}
window.__drawChart = drawChart;
drawChart();

function setStatus(text, live){
  document.getElementById('status').textContent = text;
  document.getElementById('dot').classList.toggle('on', !!live);
}

function connect(){
  setStatus('connecting…', false);
  try { ws = new WebSocket(RELAY_URL); }
  catch { setStatus('connection failed', false); scheduleReconnect(); return; }
  const sub = 'fh' + Math.random().toString(36).slice(2, 8);
  ws.onopen = () => {
    setStatus('live', true);
    // Small backlog for context, then stays open for the live stream.
    ws.send(JSON.stringify(['REQ', sub, { kinds: [KIND], limit: 30 }]));
  };
  ws.onmessage = (m) => {
    try {
      const d = JSON.parse(m.data);
      if (d[0] === 'EVENT' && d[1] === sub) addEvent(d[2]);
    } catch {}
  };
  ws.onclose = () => { setStatus('disconnected — reconnecting…', false); scheduleReconnect(); };
  ws.onerror = () => { try { ws.close(); } catch {} };
}
let reconnectTimer = null;
function scheduleReconnect(){
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 3000);
}

document.getElementById('pause').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? 'resume' : 'pause';
  e.target.classList.toggle('paused', paused);
  setStatus(paused ? 'paused' : 'live', !paused);
});

connect();
</script>
</body>
</html>
