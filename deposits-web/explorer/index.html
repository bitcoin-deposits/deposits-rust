<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deposit Ledger Explorer</title>
  <style>
    :root {
      --fg: #d8dee9;
      --fg-muted: #8c95a3;
      --bg: #1a1d23;
      --panel: #232830;
      --border: #2c323b;
      --accent: #88c0d0;
      --warn: #d08770;
      --ok: #a3be8c;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 1rem 4rem 1rem;
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 system-ui, sans-serif;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 1.5rem 0 0.25rem; color: var(--fg-muted); }
    h1 small { color: var(--fg-muted); font-size: 0.85rem; font-weight: normal; }
    .ledger-id {
      font-family: var(--mono); font-size: 0.85rem;
      word-break: break-all;
      color: var(--accent);
    }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin: 0.75rem 0;
    }
    section h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .kv { display: grid; grid-template-columns: 11rem 1fr; gap: 0.25rem 1rem; font-size: 0.9rem; }
    .kv dt { color: var(--fg-muted); }
    .kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
    .pubkey, .hash { font-family: var(--mono); font-size: 0.82rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--fg-muted); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.04em; }
    td.mono { font-family: var(--mono); font-size: 0.8rem; }
    .muted { color: var(--fg-muted); }
    .pill {
      display: inline-block; padding: 0.05rem 0.4rem; border-radius: 3px;
      font-size: 0.72rem; background: var(--border); color: var(--fg);
    }
    .pill.active { background: var(--ok); color: var(--bg); }
    .pill.expired { background: var(--warn); color: var(--bg); }
    .pill.dispute { background: var(--warn); color: var(--bg); }
    .err { color: var(--warn); padding: 0.5rem 0; }
    .loading { color: var(--fg-muted); font-style: italic; }
    .footer { text-align: center; color: var(--fg-muted); font-size: 0.8rem; margin-top: 2rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>deposits ledger <small id="hint">(loading…)</small></h1>
    <div class="ledger-id" id="ledger-id"></div>

    <section id="overview">
      <h2>overview</h2>
      <div id="overview-body" class="loading">querying relay…</div>
    </section>

    <section id="quorum">
      <h2>quorum</h2>
      <div id="quorum-body" class="loading">…</div>
    </section>

    <section id="activity">
      <h2>recent activity</h2>
      <div id="activity-body" class="loading">…</div>
    </section>

    <div class="footer">
      generated locally · data via nostr relay <span class="mono" id="relay-url"></span>
    </div>
  </div>

<script>
//
// 1. Resolve the ledger ID from the hostname.
//
// Subdomain shapes accepted:
//   - 52-char bech32-data → 32-byte ledger_id
//   - 64-char hex → ledger_id verbatim
//   - anything else → error UI
//
// `?ledger=<hex|bech32>` query-param override is also accepted, useful
// when serving the page from a non-subdomain dev URL.
//
const BECH32_CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';

function bech32DataToBytes(s) {
  let acc = 0, bits = 0;
  const out = [];
  for (const ch of s.toLowerCase()) {
    const v = BECH32_CHARSET.indexOf(ch);
    if (v < 0) return null;
    acc = (acc << 5) | v;
    bits += 5;
    if (bits >= 8) { bits -= 8; out.push((acc >> bits) & 0xff); }
  }
  return new Uint8Array(out);
}

function hex(buf) {
  return [...buf].map(b => b.toString(16).padStart(2, '0')).join('');
}

function resolveLedgerFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const override = params.get('ledger');
  if (override) {
    const v = override.toLowerCase();
    if (v.length === 64 && /^[0-9a-f]+$/.test(v)) return v;
    const decoded = bech32DataToBytes(v);
    if (decoded && decoded.length === 32) return hex(decoded);
    throw new Error(`?ledger=${override} is neither 64-hex nor 52-char bech32-data`);
  }
  // Subdomain: take the leftmost label of window.location.hostname.
  const host = window.location.hostname;
  const sub = host.split('.')[0];
  if (sub.length === 64 && /^[0-9a-f]+$/.test(sub)) return sub.toLowerCase();
  if (sub.length === 52) {
    const decoded = bech32DataToBytes(sub);
    if (decoded && decoded.length === 32) return hex(decoded);
  }
  throw new Error(
    `Cannot determine ledger ID from "${host}". Use the canonical ` +
    `<bech32-or-hex>.ledger.bitcoindeposits.net subdomain or pass ?ledger=<id>.`
  );
}

const RELAY_URL =
  new URLSearchParams(window.location.search).get('relay')
  || document.querySelector('meta[name=relay]')?.content
  || 'wss://relay.bitcoindeposits.net';

document.getElementById('relay-url').textContent = RELAY_URL;

//
// 2. Tiny Nostr REQ helper. Opens a websocket, sends one filter,
//    accumulates EVENTs, resolves on EOSE or timeout.
//
function nostrFetch(relayUrl, filter, { timeoutMs = 8000 } = {}) {
  return new Promise((resolve) => {
    const events = [];
    const ws = new WebSocket(relayUrl);
    const subId = 'q' + Math.random().toString(36).slice(2, 8);
    const finish = () => {
      try { ws.close(); } catch {}
      clearTimeout(timer);
      resolve(events);
    };
    const timer = setTimeout(finish, timeoutMs);
    ws.onopen = () => ws.send(JSON.stringify(['REQ', subId, filter]));
    ws.onmessage = (msg) => {
      try {
        const data = JSON.parse(msg.data);
        if (data[0] === 'EVENT' && data[1] === subId) events.push(data[2]);
        else if (data[0] === 'EOSE' && data[1] === subId) finish();
      } catch {}
    };
    ws.onerror = finish;
    ws.onclose = finish;
  });
}

//
// 3. Render helpers.
//
const fmt = {
  short: (s, n = 16) => s ? s.slice(0, n) + (s.length > n ? '…' : '') : '',
  msats: (n) => {
    if (n == null) return '—';
    const sats = n / 1000;
    if (sats >= 100_000_000) return `₿ ${(sats / 100_000_000).toLocaleString(undefined, { maximumFractionDigits: 8 })}`;
    return `${sats.toLocaleString()} sat`;
  },
  bps: (b) => b == null ? '—' : `${(b / 100).toFixed(2)}%`,
  ts: (t) => {
    if (!t) return '—';
    const d = new Date(t * 1000);
    return d.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  },
};

function renderOverview(ledgerId, ad) {
  const el = document.getElementById('overview-body');
  if (!ad) {
    el.innerHTML = `<div class="err">No advertisement found for this ledger on ${RELAY_URL}.</div>
       <div class="muted">If the operator publishes ads on a different relay, append <code>?relay=wss://your-relay</code> to the URL.</div>`;
    return;
  }
  const stateBadge = (() => {
    const s = ad.quorum_state || '';
    const cls = s === 'Active' ? 'active' : (s === 'Expired' ? 'expired' : '');
    return `<span class="pill ${cls}">${s || 'unknown'}</span>`;
  })();
  el.innerHTML = `
    <dl class="kv">
      <dt>operator</dt>
      <dd>${ad.operator_name ? `<b>${escapeHtml(ad.operator_name)}</b> · ` : ''}<span class="pubkey">${ad.operator_pubkey}</span></dd>
      <dt>network</dt><dd>${ad.network || '—'}</dd>
      <dt>quorum state</dt><dd>${stateBadge}</dd>
      <dt>reserves</dt><dd>${fmt.msats(ad.reserves_amount_msats)}</dd>
      <dt>collateral</dt><dd>${fmt.msats(ad.collateral_amount_msats)}</dd>
      <dt>annual fee</dt><dd>${fmt.bps(ad.annual_fee_bps)} + ${fmt.msats(ad.annualized_fixed_msats)}/year fixed (period: ${ad.fee_period_blocks} blocks)</dd>
      <dt>per-deposit cap</dt><dd>${ad.max_deposit_balance_msats ? fmt.msats(ad.max_deposit_balance_msats) : 'unlimited'}</dd>
      <dt>deposit limits</dt><dd>min ${fmt.msats(ad.min_deposit_msats)} · max ${fmt.msats(ad.max_deposit_msats)}</dd>
      ${ad.access_control ? `<dt>access</dt><dd><span class="pill expired">gated</span> ${ad.allowed_domains?.length ? `domains: ${ad.allowed_domains.join(', ')}` : ''}</dd>` : ''}
    </dl>
  `;
}

function renderQuorum(ad) {
  const el = document.getElementById('quorum-body');
  const members = ad?.quorum_members || [];
  if (!members.length) {
    el.innerHTML = `<div class="muted">No quorum members listed (legacy ad or pre-QuorumBegin).</div>`;
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr><th>#</th><th>pubkey</th></tr></thead>
      <tbody>
        ${members.map((m, i) => `<tr><td>${i + 1}</td><td class="mono">${m}</td></tr>`).join('')}
      </tbody>
    </table>`;
}

function renderActivity(events) {
  const el = document.getElementById('activity-body');
  if (!events.length) {
    el.innerHTML = `<div class="muted">No ledger updates fetched. Either this ledger has no activity or the relay didn't surface its history.</div>`;
    return;
  }
  // Sort newest first.
  events.sort((a, b) => b.created_at - a.created_at);
  el.innerHTML = `
    <table>
      <thead><tr><th>seq</th><th>op</th><th>deposit</th><th>payment</th><th>when</th></tr></thead>
      <tbody>
        ${events.map(e => {
          const seq = tagValue(e, 'n') || '?';
          const op = tagValue(e, 't') || '?';
          const dep = tagValue(e, 'i');
          const ph = tagValue(e, 'payment_hash');
          return `<tr>
            <td>${seq}</td>
            <td><b>${escapeHtml(opName(op))}</b></td>
            <td class="mono">${dep ? fmt.short(dep, 16) : '—'}</td>
            <td class="mono">${ph ? fmt.short(ph, 16) : '—'}</td>
            <td class="muted">${fmt.ts(e.created_at)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function tagValue(event, name) {
  const t = event.tags?.find(t => t[0] === name);
  return t ? t[1] : null;
}

function opName(disc) {
  // OP_NAMES populated by tlv-catalog.js if present.
  if (typeof window.OP_NAMES === 'object' && window.OP_NAMES[disc]) {
    return window.OP_NAMES[disc];
  }
  return disc;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

//
// 4. Main: fetch ad + recent updates, render.
//
async function main() {
  let ledgerId;
  try { ledgerId = resolveLedgerFromUrl(); }
  catch (e) {
    document.getElementById('hint').textContent = '— error';
    document.getElementById('overview-body').innerHTML =
      `<div class="err">${escapeHtml(e.message)}</div>`;
    return;
  }
  document.getElementById('ledger-id').textContent = ledgerId;
  document.getElementById('hint').textContent = '';

  // Ad: most-recent Kind 39100 with `#l` matching this ledger.
  // Updates: most-recent Kind 9100 with `#d` matching the 16-char prefix
  // operators tag with (see deposits-node/src/nostr.rs:1350 area).
  const adFilter = { kinds: [39100], '#l': [ledgerId], limit: 1 };
  const updateFilter = { kinds: [9100], '#d': [ledgerId.slice(0, 16)], limit: 30 };

  const [adEvents, updateEvents] = await Promise.all([
    nostrFetch(RELAY_URL, adFilter),
    nostrFetch(RELAY_URL, updateFilter),
  ]);

  let ad = null;
  if (adEvents.length) {
    // Pick the most recent.
    adEvents.sort((a, b) => b.created_at - a.created_at);
    try { ad = JSON.parse(adEvents[0].content); } catch { ad = null; }
  }
  renderOverview(ledgerId, ad);
  renderQuorum(ad);
  renderActivity(updateEvents);
}

main();
</script>
</body>
</html>
