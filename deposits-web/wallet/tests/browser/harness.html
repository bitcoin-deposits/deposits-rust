<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>dep17.js test harness</title>
</head>
<body>
  <h1>dep17.js test harness</h1>
  <p>Loaded by Playwright specs. Loads dep17.js as an ES module so the
  spec can call its functions via `page.evaluate`. Importing here (not
  inside `evaluate`) lets us pin the module to the page's worker so
  later evaluates can refer to `window.dep17`.</p>

  <script type="module">
    import * as dep17 from '../../vendor/dep17.js';
    window.dep17 = dep17;
    window._loaded = true;
  </script>
</body>
</html>
