[package]
name = "deposits-lnurl"
version = "0.1.0"
edition = "2021"
description = "LNURL-pay gateway that turns LUD-06/LUD-16 callbacks into deposits-node make_invoice requests over Nostr"
license = "MIT OR Apache-2.0"

[[bin]]
name = "deposits-lnurl"
path = "src/bin/deposits-lnurl.rs"

[dependencies]
# Web server
axum = "0.7"

# Static file serving for the bundled web UI (wallet + explorer). ServeDir
# means we don't hand-wire a route per asset — adding a vendor file is just
# dropping it in the directory.
tower-http = { version = "0.6", features = ["fs"] }

# Pulled in for the rustls `install_default_crypto_provider()` helper —
# binaries that talk to wss:// relays need to call it once at startup.
# `default-features = false` disables the `signer` feature (we don't
# touch NostrTransport's operator-side methods) so deposits-signer-api
# stays out of the lnurl gateway's build.
deposits-nostr = { path = "../deposits-nostr", default-features = false }

# Nostr transport. nip04 is required for the NIP-59-shaped gift-wrap envelope
# the operator daemon uses (see deposits-nostr send_admin_request).
nostr-sdk = { version = "0.37", features = ["nip04"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# sha256 for NIP-57 zap-request description_hash + receipt-tag work.
sha2 = "0.10"

[dev-dependencies]
# oneshot() for driving the static-file service in tests without a socket.
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lints]
workspace = true
