[package]
name = "deposits-lnurl"
version = "0.1.0"
edition = "2021"
description = "LNURL-pay gateway that turns LUD-06/LUD-16 callbacks into deposits-node make_invoice requests over Nostr"
license = "MIT OR Apache-2.0"

[[bin]]
name = "deposits-lnurl"
path = "src/bin/deposits-lnurl.rs"

[dependencies]
# Web server
axum = "0.7"

# Nostr transport
nostr-sdk = "0.37"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

[lints]
workspace = true
