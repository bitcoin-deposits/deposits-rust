[package]
name = "deposits-explorer"
version = "0.1.0"
edition = "2021"
description = "Terminal-based Bitcoin + Deposits protocol explorer"
license = "MIT OR Apache-2.0"

[[bin]]
name = "deposits-explorer"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for electrs
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bitcoin primitives
bitcoin = { version = "0.32", features = ["serde"] }

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Home directory
dirs = "6"

# Deposits protocol types
deposits-core = { path = "../deposits-core" }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time formatting
chrono = "0.4"

# Hex encoding
hex = "0.4"
