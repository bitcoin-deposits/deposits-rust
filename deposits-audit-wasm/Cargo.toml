[package]
name = "deposits-audit-wasm"
version = "0.1.0"
edition = "2021"

# Browser-facing wasm wrapper around `deposits-audit`. Exposes a single
# `audit(json)` function the explorer calls with the base64 TLV update blobs it
# already fetches from the relay; returns the AuditReport as JSON. Reuses the
# canonical LedgerState replay — no second implementation of the accounting.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deposits-audit = { path = "../deposits-audit" }
# Pinned exact: must match the wasm-bindgen-cli baked into the builder image
# (deposits-audit-wasm/Dockerfile). As an excluded crate we don't share the
# workspace lock, so without the pin cargo drifts to a newer wasm-bindgen and
# the CLI rejects the schema mismatch.
wasm-bindgen = "=0.2.114"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Excluded from the workspace, so the root's [patch] doesn't apply here.
# Mirror it: deposits-core (transitively) uses the vendored miniscript fork.
[patch.crates-io]
miniscript = { path = "../third_party/rust-miniscript" }
