[package]
name = "deposits-hub"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Deposits — operator control plane (signer + node inventory, TUI dashboard)"
license = "MIT OR Apache-2.0"

[dependencies]
# Wire protocol + transport — also used by deposits-signer (and later
# deposits-node) so peers can register with the hub.
deposits-hub-proto = { path = "../deposits-hub-proto" }

# Shared deps for nostr keypair handling — match the project's pins
bitcoin = { version = "0.32", features = ["serde"] }
secp256k1 = { version = "0.29", features = ["serde", "rand", "rand-std"] }

# TUI — event-stream brings the futures-aware EventStream for async input
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"

# QR codes for the funding-address view
qrcode = "0.14"

# BIP-39 mnemonic encoding of the hub master seed — first-launch UI
# shows the 24-word phrase so the operator can back it up before any
# signer is derived. Matches the version pinned in deposits-node.
bip39 = "2"

# Direct dep on nostr-sdk (also a transitive dep through hub-proto)
# so the peers module can build typed Filter/Kind/etc directly without
# round-tripping through hub-proto's wire types. Version pinned to
# match hub-proto's lock.
nostr-sdk = { version = "0.37", default-features = false }

# Full nostr transport (gift-wrap, NIP-04, response correlation) — the
# hub's admin client reuses the exact machinery deposits-node's CLI
# uses to send gift-wrapped Kind 20101 admin requests to a daemon.
# `default-features = false` drops the `signer` feature (which would
# pull in deposits-signer-api) — the hub never needs operator-key
# signs.
deposits-nostr = { path = "../deposits-nostr", default-features = false }

# Async runtime + process supervision
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "io-util", "sync", "time", "fs"] }

# Serde + JSON state persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utility
hex = "0.4"
thiserror = "1.0"
dirs = "5"

# Single-process lock on the hub data dir (advisory flock(2) on Unix).
libc = "0.2"

# Pinned rustls crypto provider — both `ring` and `aws-lc-rs` end up in
# the workspace dep tree, so rustls' auto-detection fails. Hub's main()
# installs ring explicitly before any wss:// connect.
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
tempfile = "3"
# Enable the proto's in-process relay so the binary smoke test has
# something for hub/signer subprocesses to talk through.
deposits-hub-proto = { path = "../deposits-hub-proto", features = ["test-relay"] }

[lints]
workspace = true

[[bin]]
name = "deposits-hub"
path = "src/main.rs"
