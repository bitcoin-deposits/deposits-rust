name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Integration (4-operator regtest)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # dangerous-testing: the dispute phase has the operator equivocate.
      - name: Build
        run: |
          cargo build --release -p deposits-node --features dangerous-testing --bin deposits-node
          cargo build --release -p deposits-wallet --bin deposits-wallet

      - name: Install Bitcoin Core 28.1
        run: |
          curl -sSL -o /tmp/btc.tgz https://bitcoincore.org/bin/bitcoin-core-28.1/bitcoin-28.1-x86_64-linux-gnu.tar.gz
          echo "07f77afd326639145b9ba9562912b2ad2ccec47b8a305bd075b4f4cb127b7ed7  /tmp/btc.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/btc.tgz -C /opt
          sudo ln -s /opt/bitcoin-28.1/bin/bitcoind /opt/bitcoin-28.1/bin/bitcoin-cli /usr/local/bin/

      - name: Install strfry
        run: |
          sudo apt-get update && sudo apt-get install -y git g++ make pkg-config libtool \
            libssl-dev zlib1g-dev liblmdb-dev libflatbuffers-dev libsecp256k1-dev libzstd-dev
          git clone --depth 1 https://github.com/hoytech/strfry.git /tmp/strfry-build
          cd /tmp/strfry-build && git submodule update --init && make setup-golpe
          make -j$(nproc)
          cp strfry ${{ github.workspace }}/deposits-tools/bin/strfry

      # Quorum formation, deposits and a transfer, an equivocation disputed through
      # confiscation and lottery claim, and a Tier-1 recovery spend past its CLTV.
      - name: Regtest end to end
        run: deposits-tools/bin/ci-regtest.sh
        timeout-minutes: 40
