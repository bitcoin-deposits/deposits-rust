name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Integration (4-operator regtest)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Build all required binaries
      - name: Build
        run: |
          cargo build --release \
            -p deposits-node --bin deposits-node --bin deposits-wallet \
            -p deposits-tools --bin replay-ledger

      # Install strfry relay (the scripts expect a native binary)
      - name: Install strfry
        run: |
          # Build from source (no official binary releases)
          sudo apt-get update && sudo apt-get install -y git g++ make pkg-config libtool \
            libssl-dev zlib1g-dev liblmdb-dev libflatbuffers-dev libsecp256k1-dev libzstd-dev
          git clone --depth 1 https://github.com/hoytech/strfry.git /tmp/strfry-build
          cd /tmp/strfry-build && git submodule update --init
          make -j$(nproc)
          cp strfry ${{ github.workspace }}/deposits-tools/bin/strfry

      # The test scripts use _common.sh which expects:
      #   - bitcoind on port 18543 (mapped from container 18443)
      #   - electrs on port 3102
      #   - strfry binary at deposits-tools/bin/strfry
      #   - docker compose for infrastructure

      # reinit.sh handles: start infra, start relays, fund operators,
      # create reserves, open ledgers, form quorum, lock collateral
      - name: Setup 4-operator network
        working-directory: deposits-tools
        run: |
          ./bin/reinit.sh --nodes 4
        timeout-minutes: 15

      # Verify all ledgers are replayable from the slow relay
      - name: Verify ledgers via replay
        working-directory: deposits-tools
        run: |
          echo "=== Ledgers on slow relay ==="
          ../target/release/replay-ledger --relay ws://localhost:7779 || true
          echo ""

          # Replay each operator's ledger
          FAILURES=0
          source bin/_common.sh
          for op in $(get_node_names); do
            LEDGER_ID=$(run_node_cmd "$op" ledger list 2>/dev/null \
              | grep "Ledger ID:" | grep -oE '[0-9a-f]{48,}' | head -1)
            if [ -z "$LEDGER_ID" ]; then
              echo "  $op: no ledger (SKIP)"
              continue
            fi
            PREFIX="${LEDGER_ID:0:8}"
            OUTPUT=$(../target/release/replay-ledger "$PREFIX" --relay ws://localhost:7779 2>/dev/null) || true
            if echo "$OUTPUT" | grep -q "updates in chain"; then
              echo "  $op ($PREFIX): OK — $OUTPUT"
            else
              echo "  $op ($PREFIX): FAILED"
              FAILURES=$((FAILURES + 1))
            fi
          done
          [ "$FAILURES" -eq 0 ] || { echo "ERROR: $FAILURES ledger(s) failed"; exit 1; }

      # Run the quorum test (adds quorum members, rotates reserves,
      # opens deposits, locks collateral — the full lifecycle)
      - name: Test quorum protocol
        working-directory: deposits-tools
        run: |
          ./bin/test-quorum.sh
        timeout-minutes: 15

      # Run the dispute test (invalid update, dispute, rebuild quorum,
      # arm, confiscate, reveal, lottery — the full recovery flow)
      - name: Test dispute protocol
        working-directory: deposits-tools
        run: |
          # Reinit for a clean state before dispute test
          ./bin/reinit.sh --quick --nodes 4
          ./bin/test-dispute-4op.sh
        timeout-minutes: 15

      # Verify on-chain state matches ledger claims
      - name: Verify reserves UTXOs
        working-directory: deposits-tools
        run: |
          source bin/_common.sh
          FAILURES=0

          for op in $(get_node_names); do
            echo "=== $op ==="

            # Get reserves info from node
            RESERVES_OUTPUT=$(run_node_cmd "$op" reserves list 2>/dev/null | grep -v '^\[2m') || true

            # Extract UTXO details: txid:vout, amount, address
            TXID=$(echo "$RESERVES_OUTPUT" | grep -i "txid\|outpoint" | grep -oE '[0-9a-f]{64}' | head -1)
            VOUT=$(echo "$RESERVES_OUTPUT" | grep -i "vout\|outpoint" | grep -oE ':[0-9]+' | head -1 | tr -d ':')
            DECLARED_AMOUNT=$(echo "$RESERVES_OUTPUT" | grep -i "amount" | grep -oE '[0-9]+' | head -1)
            ADDRESS=$(echo "$RESERVES_OUTPUT" | grep -i "address" | grep -oE 'bcrt1[a-z0-9]+' | head -1)

            if [ -z "$TXID" ] || [ -z "$VOUT" ]; then
              echo "  Could not extract UTXO from reserves list"
              echo "  Raw: $(echo "$RESERVES_OUTPUT" | head -5)"
              FAILURES=$((FAILURES + 1))
              continue
            fi

            echo "  Declared: ${TXID:0:16}...:$VOUT = $DECLARED_AMOUNT sats"

            # Query electrs for the actual UTXO
            ELECTRS_URL="http://localhost:${ELECTRS_PORT:-3102}"
            TX_JSON=$(curl -sf "$ELECTRS_URL/tx/$TXID" 2>/dev/null) || true
            if [ -z "$TX_JSON" ]; then
              echo "  WARNING: Could not fetch tx $TXID from electrs"
              FAILURES=$((FAILURES + 1))
              continue
            fi

            # Extract the actual output value and scriptpubkey
            # electrs returns JSON with vout array
            ACTUAL_VALUE=$(echo "$TX_JSON" | python3 -c "
          import sys, json
          tx = json.load(sys.stdin)
          vout = int('$VOUT')
          if vout < len(tx.get('vout', [])):
              print(tx['vout'][vout].get('value', 0))
          " 2>/dev/null)
            ACTUAL_ADDR=$(echo "$TX_JSON" | python3 -c "
          import sys, json
          tx = json.load(sys.stdin)
          vout = int('$VOUT')
          if vout < len(tx.get('vout', [])):
              print(tx['vout'][vout].get('scriptpubkey_address', ''))
          " 2>/dev/null)

            echo "  On-chain: value=$ACTUAL_VALUE sats, addr=$ACTUAL_ADDR"

            # Verify amount matches
            if [ -n "$ACTUAL_VALUE" ] && [ -n "$DECLARED_AMOUNT" ]; then
              if [ "$ACTUAL_VALUE" = "$DECLARED_AMOUNT" ]; then
                echo "  Amount: MATCH"
              else
                echo "  Amount: MISMATCH (declared=$DECLARED_AMOUNT, actual=$ACTUAL_VALUE)"
                FAILURES=$((FAILURES + 1))
              fi
            fi

            # Verify address matches (if we have both)
            if [ -n "$ACTUAL_ADDR" ] && [ -n "$ADDRESS" ]; then
              if [ "$ACTUAL_ADDR" = "$ADDRESS" ]; then
                echo "  Address: MATCH"
              else
                echo "  Address: MISMATCH (declared=$ADDRESS, actual=$ACTUAL_ADDR)"
                FAILURES=$((FAILURES + 1))
              fi
            fi

            # Verify UTXO is unspent
            SPENT=$(echo "$TX_JSON" | python3 -c "
          import sys, json
          tx = json.load(sys.stdin)
          vout = int('$VOUT')
          status = tx.get('status', {})
          # Check if output is spent by looking at spending info
          print('unspent')
          " 2>/dev/null)
            UTXO_STATUS=$(curl -sf "$ELECTRS_URL/tx/$TXID/outspend/$VOUT" 2>/dev/null) || true
            if echo "$UTXO_STATUS" | grep -q '"spent":false'; then
              echo "  UTXO: unspent (confirmed)"
            elif echo "$UTXO_STATUS" | grep -q '"spent":true'; then
              echo "  UTXO: SPENT (may be expected after dispute/rotation)"
            else
              echo "  UTXO: unknown status"
            fi

            # Get ledger obligations
            LEDGER_INFO=$(run_node_cmd "$op" info 2>/dev/null | grep -v '^\[2m') || true
            TOTAL_DEPOSITS=$(echo "$LEDGER_INFO" | grep -i "deposit.*balance\|total.*balance" | grep -oE '[0-9]+' | head -1)
            if [ -n "$TOTAL_DEPOSITS" ] && [ -n "$DECLARED_AMOUNT" ]; then
              if [ "$DECLARED_AMOUNT" -ge "$TOTAL_DEPOSITS" ]; then
                echo "  Reserves >= Obligations: OK ($DECLARED_AMOUNT >= $TOTAL_DEPOSITS)"
              else
                echo "  Reserves < Obligations: VIOLATION ($DECLARED_AMOUNT < $TOTAL_DEPOSITS)"
                FAILURES=$((FAILURES + 1))
              fi
            fi

            echo ""
          done

          if [ "$FAILURES" -gt 0 ]; then
            echo "ERROR: $FAILURES verification failure(s)"
            exit 1
          fi
          echo "=== ALL RESERVES VERIFIED ==="

      # Cleanup
      - name: Cleanup
        if: always()
        working-directory: deposits-tools
        run: |
          source bin/_common.sh
          stop_all_nodes 2>/dev/null || true
          stop_all_relays 2>/dev/null || true
          stop_all_electrs 2>/dev/null || true
          $DC down -v --remove-orphans 2>/dev/null || true
