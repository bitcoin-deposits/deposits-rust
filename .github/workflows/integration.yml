name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Integration (4-operator regtest)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release \
            -p deposits-node --bin deposits-node --bin deposits-wallet \
            -p deposits-tools --bin replay-ledger

      - name: Install strfry
        run: |
          sudo apt-get update && sudo apt-get install -y git g++ make pkg-config libtool \
            libssl-dev zlib1g-dev liblmdb-dev libflatbuffers-dev libsecp256k1-dev libzstd-dev
          git clone --depth 1 https://github.com/hoytech/strfry.git /tmp/strfry-build
          cd /tmp/strfry-build && git submodule update --init
          make -j$(nproc)
          cp strfry ${{ github.workspace }}/deposits-tools/bin/strfry

      # =====================================================================
      # Test 1: Quorum protocol (formation, rotation, deposits, collateral)
      # test-quorum.sh handles its own setup via reinit-like flow
      # =====================================================================

      - name: Test quorum protocol
        working-directory: deposits-tools
        run: |
          # Start infrastructure (test-quorum.sh expects infra running)
          source bin/_common.sh
          $DC up -d bitcoin
          wait_for_bitcoin
          start_all_electrs
          wait_for_all_electrs
          start_all_relays
          wait_for_nostr
          setup_faucet
          $DC up -d miner

          # Run the test (it does its own operator setup)
          ./bin/test-quorum.sh
        timeout-minutes: 20

      # Verify ledgers from relay after quorum test
      - name: Verify ledgers after quorum test
        working-directory: deposits-tools
        run: |
          source bin/_common.sh && init_topology

          echo "=== Ledgers on slow relay ==="
          ../target/release/replay-ledger --relay ws://localhost:7779 2>/dev/null || true

          FAILURES=0
          for op in alice bob charlie diana; do
            LEDGER_ID=$(run_node_cmd "$op" ledger list 2>/dev/null \
              | grep "Ledger ID:" | grep -oE '[0-9a-f]{48,}' | head -1)
            [ -z "$LEDGER_ID" ] && continue
            PREFIX="${LEDGER_ID:0:8}"
            OUTPUT=$(../target/release/replay-ledger "$PREFIX" --relay ws://localhost:7779 2>/dev/null) || true
            if echo "$OUTPUT" | grep -q "updates in chain"; then
              echo "  $op ($PREFIX): OK"
            else
              echo "  $op ($PREFIX): FAILED"
              FAILURES=$((FAILURES + 1))
            fi
          done
          [ "$FAILURES" -eq 0 ] || { echo "ERROR: $FAILURES ledger(s) failed replay"; exit 1; }

      # =====================================================================
      # Test 2: Dispute protocol (invalid update, dispute, lottery, recovery)
      # Needs a fresh environment
      # =====================================================================

      - name: Test dispute protocol
        working-directory: deposits-tools
        run: |
          # Clean reset for dispute test
          source bin/_common.sh
          stop_all_nodes 2>/dev/null || true

          # Clear node data for fresh state
          rm -rf "$DATA_ROOT"

          # Setup fresh faucet (mine more blocks for new funds)
          FAUCET=$(docker exec bitcoind bitcoin-cli -regtest -rpcuser=user -rpcpassword=pass \
            -rpcwallet=faucet getnewaddress 2>/dev/null)
          docker exec bitcoind bitcoin-cli -regtest -rpcuser=user -rpcpassword=pass \
            generatetoaddress 110 "$FAUCET" 2>/dev/null

          # Run the test (it does its own operator setup)
          ./bin/test-dispute-4op.sh
        timeout-minutes: 20

      # =====================================================================
      # Verify: on-chain UTXO state after dispute
      # =====================================================================

      - name: Verify reserves UTXOs
        working-directory: deposits-tools
        run: |
          source bin/_common.sh && init_topology
          FAILURES=0

          # Find a working electrs port (per-node or shared)
          EURL=""
          for port in 3201 3202 3102; do
            if curl -sf "http://localhost:$port/blocks/tip/height" >/dev/null 2>&1; then
              EURL="http://localhost:$port"
              break
            fi
          done
          [ -z "$EURL" ] && { echo "ERROR: No electrs available"; exit 1; }
          echo "Using electrs at $EURL"

          for op in alice bob charlie diana; do
            echo "=== $op ==="
            RESERVES_OUTPUT=$(run_node_cmd "$op" reserves list 2>/dev/null | grep -v '^\[2m') || true
            TXID=$(echo "$RESERVES_OUTPUT" | grep -oE '[0-9a-f]{64}' | head -1)
            VOUT=$(echo "$RESERVES_OUTPUT" | grep -iE "vout" | grep -oE '[0-9]+' | head -1)
            DECLARED_AMOUNT=$(echo "$RESERVES_OUTPUT" | grep -i "amount" | grep -oE '[0-9]+' | head -1)
            ADDRESS=$(echo "$RESERVES_OUTPUT" | grep -i "address" | grep -oE 'bcrt1[a-z0-9p]+' | head -1)

            [ -z "$TXID" ] && { echo "  No UTXO found"; continue; }
            VOUT="${VOUT:-0}"
            echo "  Declared: ${TXID:0:16}...:$VOUT = $DECLARED_AMOUNT sats"

            # Query electrs for actual output
            TX_JSON=$(curl -sf "$EURL/tx/$TXID" 2>/dev/null) || true
            if [ -z "$TX_JSON" ]; then
              echo "  WARNING: tx not found in electrs (may need indexing time)"
              continue
            fi

            ACTUAL_VALUE=$(echo "$TX_JSON" | python3 -c "
          import sys,json; tx=json.load(sys.stdin); v=int('$VOUT')
          print(tx['vout'][v]['value'])" 2>/dev/null)
            ACTUAL_ADDR=$(echo "$TX_JSON" | python3 -c "
          import sys,json; tx=json.load(sys.stdin); v=int('$VOUT')
          print(tx['vout'][v].get('scriptpubkey_address',''))" 2>/dev/null)

            echo "  On-chain: $ACTUAL_VALUE sats @ $ACTUAL_ADDR"

            if [ -n "$ACTUAL_VALUE" ] && [ "$ACTUAL_VALUE" = "$DECLARED_AMOUNT" ]; then
              echo "  Amount: MATCH"
            elif [ -n "$ACTUAL_VALUE" ]; then
              echo "  Amount: MISMATCH (declared=$DECLARED_AMOUNT actual=$ACTUAL_VALUE)"
              FAILURES=$((FAILURES + 1))
            fi

            if [ -n "$ACTUAL_ADDR" ] && [ -n "$ADDRESS" ] && [ "$ACTUAL_ADDR" = "$ADDRESS" ]; then
              echo "  Address: MATCH"
            elif [ -n "$ACTUAL_ADDR" ] && [ -n "$ADDRESS" ]; then
              echo "  Address: MISMATCH (decl=$ADDRESS actual=$ACTUAL_ADDR)"
              FAILURES=$((FAILURES + 1))
            fi

            SPENT=$(curl -sf "$EURL/tx/$TXID/outspend/$VOUT" 2>/dev/null) || true
            if echo "$SPENT" | grep -q '"spent":false'; then
              echo "  UTXO: unspent"
            elif echo "$SPENT" | grep -q '"spent":true'; then
              echo "  UTXO: spent (expected after dispute/rotation)"
            fi
            echo ""
          done

          [ "$FAILURES" -eq 0 ] || { echo "ERROR: $FAILURES UTXO mismatch(es)"; exit 1; }
          echo "=== ALL RESERVES VERIFIED ==="

      - name: Cleanup
        if: always()
        working-directory: deposits-tools
        run: |
          source bin/_common.sh
          stop_all_nodes 2>/dev/null || true
          stop_all_relays 2>/dev/null || true
          stop_all_electrs 2>/dev/null || true
          $DC down -v --remove-orphans 2>/dev/null || true
