[package]
name = "deposits-nwc"
version = "0.1.0"
edition = "2021"
description = "NWC (Nostr Wallet Connect) service for Bitcoin Deposits"

[features]
default = ["bitcoin-deposits"]
bitcoin-deposits = ["ldk-node/bitcoin-deposits"]

[dependencies]
# Local dependencies
ldk-node = { path = "../../ldk-node" }
deposits-ldk = { path = "../deposits-ldk" }

# Lightning (via rust-lightning fork)
lightning-invoice = { path = "../../rust-lightning/lightning-invoice" }
lightning-types = { path = "../../rust-lightning/lightning-types" }

# Bitcoin
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async / WebSocket
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Crypto (NIP-44 encryption)
rand = "0.8"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
chacha20 = "0.9"
aes = "0.8"
cbc = "0.1"

# URL parsing
url = "2"

# Hex encoding
hex = "0.4"

# Logging
log = "0.4"

# Base64
base64 = "0.21"
