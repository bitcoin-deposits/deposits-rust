[package]
name = "deposits-ldk"
version = "0.1.0"
edition = "2021"
description = "LDK adapter for the Bitcoin Deposits protocol"
license = "MIT OR Apache-2.0"

[dependencies]
# Core protocol library
deposits-core = { path = "../deposits-core" }

# Bitcoin primitives
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }

# Lightning (LDK) - use rust-lightning via ldk-node's vendor symlink for path consistency
lightning = { path = "../../rust-lightning/lightning", default-features = false, features = ["std"] }
lightning-macros = { path = "../../rust-lightning/lightning-macros" }
lightning-types = { path = "../../rust-lightning/lightning-types" }
lightning-invoice = { path = "../../rust-lightning/lightning-invoice", features = ["std"] }
lightning-persister = { path = "../../rust-lightning/lightning-persister" }

# Async runtime
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }

# Error handling
thiserror = "1.0"

# Serialization
bincode = "1.3"
base64 = "0.22"

# Utilities
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography (for NWC key derivation)
hkdf = "0.12"
sha2 = "0.10"

# Logging
log = "0.4"

# Protobuf (for ldk-server compatible API)
prost = "0.11.6"

[build-dependencies]
prost-build = "0.11.6"

[features]
default = []
testing = ["lightning/_test_utils"]
bitcoin-deposits-non-conforming = []  # Testing feature for non-conforming protocol behavior

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rand = "0.8"
