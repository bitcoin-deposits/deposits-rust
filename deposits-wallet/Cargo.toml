[package]
name = "deposits-wallet"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Deposits Protocol - Wallet CLI"
license = "MIT OR Apache-2.0"

[dependencies]
# Core protocol logic + state machine
deposits-core = { path = "../deposits-core" }
# Nostr transport, swap types, relay filters. Depending on deposits-node
# at the library level is intentional — the wallet is a sibling CLI
# that speaks the same wire protocol, and sharing the transport module
# avoids drift. A future refactor could lift `deposits-node::nostr`
# into its own deposits-transport crate if the wallet needs to
# decouple.
deposits-node = { path = "../deposits-node" }

# Bitcoin
bitcoin = { version = "0.32", features = ["serde"] }

# Nostr for peer messaging
nostr-sdk = { version = "0.37", features = ["nip44", "nip47", "nip59"] }

# TLS crypto provider for nostr-sdk (must be installed before first use)
rustls = { version = "0.23", features = ["ring"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI utilities
dirs = "5.0"

# Utilities
hex = "0.4"
base64 = "0.22"
chrono = "0.4"
sha2 = "0.10"

# Lightning invoice parsing (used by pay_invoice)
lightning-invoice = "0.32"

# HTTP client (verifier round-trip for access-controlled deposits)
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }

# Memory allocator — jemalloc reduces fragmentation under sustained
# alloc/dealloc workloads, particularly the swap-listen / batch modes.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[lints]
workspace = true
