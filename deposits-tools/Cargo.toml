[package]
name = "deposits-tools"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Deposits tooling and test binaries"

[[bin]]
name = "deposits-admin"
path = "src/bin/deposits-admin.rs"

[[bin]]
name = "nwc-client"
path = "src/bin/nwc-client.rs"

[[bin]]
name = "network-init"
path = "src/bin/network-init.rs"

[[bin]]
name = "status"
path = "src/bin/status.rs"

[[bin]]
name = "decode-updates"
path = "src/bin/decode-updates.rs"

[[bin]]
name = "treasury-address"
path = "src/bin/treasury-address.rs"

[[bin]]
name = "treasury-send"
path = "src/bin/treasury-send.rs"

[[bin]]
name = "standalone-reserves-demo"
path = "src/bin/standalone_reserves_demo.rs"

[dependencies]
# Bitcoin
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }
bdk_wallet = { version = "2.2.0", default-features = false, features = ["std", "keys-bip39"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.11.6"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# HTTP
warp = "0.3"
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Serialization - binary
bincode = "1.3"

# Async
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Crypto
rand = "0.8"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
chacha20 = "0.9"
aes = "0.8"
cbc = "0.1"

# URL parsing
url = "2"

# Time
chrono = "0.4"

# Hex encoding
hex = "0.4"

# Logging
log = "0.4"
env_logger = "0.10"

# Base64
base64 = "0.21"
