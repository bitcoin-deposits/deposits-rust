[package]
name = "deposits-tools"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Deposits tooling and test binaries"

[[bin]]
name = "decode-updates"
path = "src/bin/decode-updates.rs"

[[bin]]
name = "treasury-address"
path = "src/bin/treasury-address.rs"

[[bin]]
name = "treasury-send"
path = "src/bin/treasury-send.rs"

[[bin]]
name = "standalone-reserves-demo"
path = "src/bin/standalone_reserves_demo.rs"

[[bin]]
name = "discover"
path = "src/bin/discover.rs"

[[bin]]
name = "replay-ledger"
path = "src/bin/replay-ledger.rs"

[[bin]]
name = "sweep-all"
path = "src/bin/sweep-all.rs"

[features]
# Tests gated on this feature predate the rename from "bitcoin-deposits" to "deposits".
# Kept as an empty feature so those tests remain opt-in without breaking the build.
bitcoin-deposits = []

[dependencies]
# Bitcoin
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }

# Deposits
deposits-core = { path = "../deposits-core" }

# Lightning
lightning-types = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Serialization - binary
bincode = "1.3"

# Async
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Crypto
rand = "0.8"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
chacha20 = "0.9"

# URL parsing
url = "2"

# Hex encoding
hex = "0.4"

# Logging
log = "0.4"
env_logger = "0.10"

# Base64
base64 = "0.21"

# TUI
ratatui = "0.29"
crossterm = "0.28"

[lints]
workspace = true
