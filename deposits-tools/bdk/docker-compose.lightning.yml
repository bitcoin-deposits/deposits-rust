# Docker Compose override for adding LDK Lightning nodes to BDK network
#
# This adds LDK sidecars (ldk-alice, ldk-bob) alongside the BDK nodes to enable
# Lightning channel payments. The BDK nodes handle on-chain reserves and Nostr
# messaging, while LDK nodes handle Lightning channels.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.lightning.yml up -d
#   or use: bin/reinit-lightning.sh
#
# The LDK nodes share the same Bitcoin and Electrs infrastructure as BDK nodes.
#
# Note: The LDK image build requires rust-lightning, ldk-node, ldk-server, and
# deposits-rust to all be present in ~/workspace/. First build may take 10+ min.

services:
  # LDK Node for Alice - Lightning sidecar
  bdk-alice-ln:
    build:
      context: ../../../
      dockerfile: deposits-rust/deposits-tools/Dockerfile.ldk-node
    image: bdk-ldk-node:latest
    container_name: bdk-alice-ln
    environment:
      - NODE_NAME=alice
      - LDK_DATA_DIR=/ldk
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9735
      - RUST_LOG=info,ldk_node=debug
      - RUST_BACKTRACE=0
      - LDK_ONCHAIN_WALLET_SYNC_INTERVAL_SECS=10
      - LDK_LIGHTNING_WALLET_SYNC_INTERVAL_SECS=10
    ports:
      - "9835:9735"   # Lightning P2P (offset from main LDK compose)
      - "3111:3000"   # API port
    volumes:
      - ldk_alice_data:/ldk
      - ldk_cli:/ldk-cli  # Share CLI binary with BDK nodes
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      bdk_network:
        ipv4_address: 172.21.0.50

  # LDK Node for Bob - Lightning sidecar
  bdk-bob-ln:
    image: bdk-ldk-node:latest
    container_name: bdk-bob-ln
    environment:
      - NODE_NAME=bob
      - LDK_DATA_DIR=/ldk
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9736
      - RUST_LOG=info,ldk_node=debug
      - RUST_BACKTRACE=0
      - LDK_ONCHAIN_WALLET_SYNC_INTERVAL_SECS=10
      - LDK_LIGHTNING_WALLET_SYNC_INTERVAL_SECS=10
    ports:
      - "9836:9736"   # Lightning P2P
      - "3112:3000"   # API port
    volumes:
      - ldk_bob_data:/ldk
      - ldk_cli:/ldk-cli  # Share CLI binary
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
      bdk-alice-ln:
        condition: service_started
    networks:
      bdk_network:
        ipv4_address: 172.21.0.51

  # LDK Node for Charlie - Lightning sidecar
  bdk-charlie-ln:
    image: bdk-ldk-node:latest
    container_name: bdk-charlie-ln
    environment:
      - NODE_NAME=charlie
      - LDK_DATA_DIR=/ldk
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9737
      - RUST_LOG=info,ldk_node=debug
      - RUST_BACKTRACE=0
      - LDK_ONCHAIN_WALLET_SYNC_INTERVAL_SECS=10
      - LDK_LIGHTNING_WALLET_SYNC_INTERVAL_SECS=10
    ports:
      - "9837:9737"   # Lightning P2P
      - "3113:3000"   # API port
    volumes:
      - ldk_charlie_data:/ldk
      - ldk_cli:/ldk-cli
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      bdk_network:
        ipv4_address: 172.21.0.52

  # LDK Node for Diana - Lightning sidecar
  bdk-diana-ln:
    image: bdk-ldk-node:latest
    container_name: bdk-diana-ln
    environment:
      - NODE_NAME=diana
      - LDK_DATA_DIR=/ldk
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9738
      - RUST_LOG=info,ldk_node=debug
      - RUST_BACKTRACE=0
      - LDK_ONCHAIN_WALLET_SYNC_INTERVAL_SECS=10
      - LDK_LIGHTNING_WALLET_SYNC_INTERVAL_SECS=10
    ports:
      - "9838:9738"   # Lightning P2P
      - "3114:3000"   # API port
    volumes:
      - ldk_diana_data:/ldk
      - ldk_cli:/ldk-cli
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      bdk_network:
        ipv4_address: 172.21.0.53

  # Override BDK Alice to add Lightning connection info
  bdk-alice:
    environment:
      - RUST_LOG=info,deposits_bdk=debug
      - LDK_HOST=bdk-alice-ln
      - LDK_PORT=3000
      - LDK_API_KEY=test_api_key
      - LDK_CLI=/ldk-cli/ldk-server-cli
      - LDK_TLS_CERT=/ldk-data/tls.crt
    volumes:
      - bdk_alice_data:/data
      - ldk_cli:/ldk-cli:ro
      - ldk_alice_data:/ldk-data:ro

  # Override BDK Bob to add Lightning CLI and connection info
  bdk-bob:
    environment:
      - RUST_LOG=info,deposits_bdk=debug
      - LDK_HOST=bdk-bob-ln
      - LDK_PORT=3000
      - LDK_API_KEY=test_api_key
      - LDK_CLI=/ldk-cli/ldk-server-cli
      - LDK_TLS_CERT=/ldk-data/tls.crt
    volumes:
      - bdk_bob_data:/data
      - ldk_cli:/ldk-cli:ro
      - ldk_bob_data:/ldk-data:ro

  # Override BDK Charlie to add Lightning connection info
  bdk-charlie:
    environment:
      - RUST_LOG=info,deposits_bdk=debug
      - LDK_HOST=bdk-charlie-ln
      - LDK_PORT=3000
      - LDK_API_KEY=test_api_key
      - LDK_CLI=/ldk-cli/ldk-server-cli
      - LDK_TLS_CERT=/ldk-data/tls.crt
    volumes:
      - bdk_charlie_data:/data
      - ldk_cli:/ldk-cli:ro
      - ldk_charlie_data:/ldk-data:ro

  # Override BDK Diana to add Lightning connection info
  bdk-diana:
    environment:
      - RUST_LOG=info,deposits_bdk=debug
      - LDK_HOST=bdk-diana-ln
      - LDK_PORT=3000
      - LDK_API_KEY=test_api_key
      - LDK_CLI=/ldk-cli/ldk-server-cli
      - LDK_TLS_CERT=/ldk-data/tls.crt
    volumes:
      - bdk_diana_data:/data
      - ldk_cli:/ldk-cli:ro
      - ldk_diana_data:/ldk-data:ro

volumes:
  ldk_alice_data:
  ldk_bob_data:
  ldk_charlie_data:
  ldk_diana_data:
  ldk_cli:  # Shared volume for ldk-server-cli binary
