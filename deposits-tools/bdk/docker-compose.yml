# Docker Compose for deposits-bdk network
#
# This mirrors ../docker-compose-deposits.yml but uses deposits-bdk nodes
# instead of LDK nodes. The key difference:
# - LDK nodes use Lightning channels for reserves and Lightning wire protocol for messaging
# - BDK nodes use on-chain UTXOs for reserves and Nostr for messaging
#
# Usage:
#   cd deposits-tools/bdk
#   docker-compose up -d
#   docker-compose logs -f
#   docker-compose down -v
#
# Block explorer (electrs REST API):
#   curl http://localhost:3102/blocks
#   curl http://localhost:3102/tx/<txid>
#
# Monitoring:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3010 (admin/admin)

services:
  # Strfry Nostr relay for peer messaging (low-latency fork with 1ms debounce)
  nostr-relay:
    image: strfry-performance:latest
    container_name: bdk-nostr-relay
    command: ["relay", "--config", "/app/strfry.conf"]
    ports:
      - "7778:7777"
    volumes:
      - bdk_nostr_data:/app/strfry-db
      - ../../strfry-performance/strfry.conf:/app/strfry.conf:ro
      - ../permissive-write-policy.py:/app/write-policy.py:ro
    environment:
      - STRFRY_BIND=0.0.0.0:7777
    networks:
      - bdk_network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7777"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Bitcoin Core regtest node
  bitcoin:
    image: blockstream/bitcoind:27.2
    platform: linux/amd64
    container_name: bdk-bitcoind
    command:
      [
        "bitcoind",
        "-printtoconsole",
        "-regtest=1",
        "-rpcallowip=0.0.0.0/0",
        "-rpcbind=0.0.0.0",
        "-rpcuser=user",
        "-rpcpassword=pass",
        "-fallbackfee=0.00001",
        "-rest",
        "-txindex"
      ]
    ports:
      - "18543:18443"  # Regtest RPC port (offset to avoid conflict with LDK compose)
      - "18544:18444"  # Regtest P2P port
    volumes:
      - bdk_bitcoin_data:/home/bitcoin/.bitcoin
    networks:
      bdk_network:
        ipv4_address: 172.21.0.10
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=user", "-rpcpassword=pass", "getblockchaininfo"]
      interval: 5s
      timeout: 10s
      retries: 5

  # Shared Electrs for external access (wallet, block explorer)
  electrs:
    image: mempool/electrs:v3.2.0
    platform: linux/amd64
    container_name: bdk-electrs
    depends_on:
      bitcoin:
        condition: service_healthy
    command:
      [
        "-vvvv",
        "--timestamp",
        "--jsonrpc-import",
        "--cookie=user:pass",
        "--network=regtest",
        "--daemon-rpc-addr=bitcoin:18443",
        "--http-addr=0.0.0.0:3002",
        "--monitoring-addr=0.0.0.0:4224"
      ]
    ports:
      - "3102:3002"
      - "4224:4224"
    volumes:
      - bdk_electrs_data:/data
    networks:
      bdk_network:
        ipv4_address: 172.21.0.11

  # Per-node Electrs instances to distribute load
  electrs-alice:
    image: mempool/electrs:v3.2.0
    platform: linux/amd64
    container_name: bdk-electrs-alice
    depends_on:
      bitcoin:
        condition: service_healthy
    command:
      [
        "--jsonrpc-import",
        "--cookie=user:pass",
        "--network=regtest",
        "--daemon-rpc-addr=bitcoin:18443",
        "--http-addr=0.0.0.0:3002"
      ]
    volumes:
      - bdk_electrs_alice:/data
    networks:
      bdk_network:
        ipv4_address: 172.21.0.111

  electrs-bob:
    image: mempool/electrs:v3.2.0
    platform: linux/amd64
    container_name: bdk-electrs-bob
    depends_on:
      bitcoin:
        condition: service_healthy
    command:
      [
        "--jsonrpc-import",
        "--cookie=user:pass",
        "--network=regtest",
        "--daemon-rpc-addr=bitcoin:18443",
        "--http-addr=0.0.0.0:3002"
      ]
    volumes:
      - bdk_electrs_bob:/data
    networks:
      bdk_network:
        ipv4_address: 172.21.0.112

  electrs-charlie:
    image: mempool/electrs:v3.2.0
    platform: linux/amd64
    container_name: bdk-electrs-charlie
    depends_on:
      bitcoin:
        condition: service_healthy
    command:
      [
        "--jsonrpc-import",
        "--cookie=user:pass",
        "--network=regtest",
        "--daemon-rpc-addr=bitcoin:18443",
        "--http-addr=0.0.0.0:3002"
      ]
    volumes:
      - bdk_electrs_charlie:/data
    networks:
      bdk_network:
        ipv4_address: 172.21.0.113

  electrs-diana:
    image: mempool/electrs:v3.2.0
    platform: linux/amd64
    container_name: bdk-electrs-diana
    depends_on:
      bitcoin:
        condition: service_healthy
    command:
      [
        "--jsonrpc-import",
        "--cookie=user:pass",
        "--network=regtest",
        "--daemon-rpc-addr=bitcoin:18443",
        "--http-addr=0.0.0.0:3002"
      ]
    volumes:
      - bdk_electrs_diana:/data
    networks:
      bdk_network:
        ipv4_address: 172.21.0.114

  # Bitcoin Prometheus exporter
  bitcoin-exporter:
    image: jvstein/bitcoin-prometheus-exporter:v0.9.0
    platform: linux/amd64
    container_name: bdk-bitcoin-exporter
    depends_on:
      bitcoin:
        condition: service_healthy
    environment:
      - BITCOIN_RPC_HOST=bitcoin
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=user
      - BITCOIN_RPC_PASSWORD=pass
      - REFRESH_SECONDS=15
      - LOG_LEVEL=INFO
    networks:
      bdk_network:
        ipv4_address: 172.21.0.12

  # deposits-bdk Node 1 - Alice (Operator)
  bdk-alice:
    build:
      context: ../../../
      dockerfile: deposits-rust/deposits-tools/bdk/Dockerfile
    image: deposits-bdk:latest
    container_name: bdk-alice
    command:
      - "run"
      - "--seed"
      - "416c696365000000000000000000000000000000000000000000000000000001"
      - "--network"
      - "regtest"
      - "--electrum"
      - "http://electrs-alice:3002"
      - "--relay"
      - "ws://nostr-relay:7777"
      - "--data-dir"
      - "/data"
      - "--metrics-port"
      - "9100"
      - "--fast-poll"
    environment:
      # Logs: info level, debug for deposits-bdk
      - RUST_LOG=info,deposits_bdk=debug
      # Enable periodic deposit balance metrics (every 60s)
      - DEPOSITS_ENABLE_METRICS_EMITTER=1
    volumes:
      - bdk_alice_data:/data
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs-alice:
        condition: service_started
      nostr-relay:
        condition: service_healthy
    networks:
      bdk_network:
        ipv4_address: 172.21.0.20

  # deposits-bdk Node 2 - Bob (Operator)
  bdk-bob:
    image: deposits-bdk:latest
    container_name: bdk-bob
    command:
      - "run"
      - "--seed"
      - "426f620000000000000000000000000000000000000000000000000000000002"
      - "--network"
      - "regtest"
      - "--electrum"
      - "http://electrs-bob:3002"
      - "--relay"
      - "ws://nostr-relay:7777"
      - "--data-dir"
      - "/data"
      - "--metrics-port"
      - "9100"
      - "--fast-poll"
    environment:
      - RUST_LOG=info,deposits_bdk=debug
    volumes:
      - bdk_bob_data:/data
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs-bob:
        condition: service_started
      nostr-relay:
        condition: service_healthy
    networks:
      bdk_network:
        ipv4_address: 172.21.0.21

  # deposits-bdk Node 3 - Charlie (Partner)
  bdk-charlie:
    image: deposits-bdk:latest
    container_name: bdk-charlie
    command:
      - "run"
      - "--seed"
      - "436861726c696500000000000000000000000000000000000000000000000003"
      - "--network"
      - "regtest"
      - "--electrum"
      - "http://electrs-charlie:3002"
      - "--relay"
      - "ws://nostr-relay:7777"
      - "--data-dir"
      - "/data"
      - "--metrics-port"
      - "9100"
      - "--fast-poll"
    environment:
      - RUST_LOG=info,deposits_bdk=debug
    volumes:
      - bdk_charlie_data:/data
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs-charlie:
        condition: service_started
      nostr-relay:
        condition: service_healthy
    networks:
      bdk_network:
        ipv4_address: 172.21.0.22

  # deposits-bdk Node 4 - Diana (Operator for 4-op tests)
  bdk-diana:
    image: deposits-bdk:latest
    container_name: bdk-diana
    command:
      - "run"
      - "--seed"
      - "4469616e61000000000000000000000000000000000000000000000000000004"
      - "--network"
      - "regtest"
      - "--electrum"
      - "http://electrs-diana:3002"
      - "--relay"
      - "ws://nostr-relay:7777"
      - "--data-dir"
      - "/data"
      - "--metrics-port"
      - "9100"
      - "--fast-poll"
    environment:
      - RUST_LOG=info,deposits_bdk=debug
    volumes:
      - bdk_diana_data:/data
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs-diana:
        condition: service_started
      nostr-relay:
        condition: service_healthy
    networks:
      bdk_network:
        ipv4_address: 172.21.0.23

  # deposits-bdk Node 5 - Eve (Partner) - uses shared electrs
  bdk-eve:
    profiles:
      - dev
    image: deposits-bdk:latest
    container_name: bdk-eve
    command:
      - "run"
      - "--seed"
      - "4576650000000000000000000000000000000000000000000000000000000005"
      - "--network"
      - "regtest"
      - "--electrum"
      - "http://electrs:3002"
      - "--relay"
      - "ws://nostr-relay:7777"
      - "--data-dir"
      - "/data"
      - "--metrics-port"
      - "9100"
      - "--fast-poll"
    environment:
      - RUST_LOG=info,deposits_bdk=debug
    volumes:
      - bdk_eve_data:/data
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
      nostr-relay:
        condition: service_healthy
    networks:
      bdk_network:
        ipv4_address: 172.21.0.24

  # Bitcoin faucet helper - mines blocks and sends to nodes
  faucet:
    image: blockstream/bitcoind:27.2
    platform: linux/amd64
    container_name: bdk-faucet
    profiles:
      - faucet
    depends_on:
      bitcoin:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Wait for electrs to be ready
        sleep 10

        # Create wallet if it doesn't exist
        bitcoin-cli -regtest -rpcconnect=bitcoin -rpcuser=user -rpcpassword=pass createwallet "faucet" 2>/dev/null || true

        # Generate initial blocks
        echo "Mining 101 blocks..."
        bitcoin-cli -regtest -rpcconnect=bitcoin -rpcuser=user -rpcpassword=pass -rpcwallet=faucet -generate 101

        echo "Faucet ready. Mining a block every 30 seconds..."
        while true; do
          sleep 30
          bitcoin-cli -regtest -rpcconnect=bitcoin -rpcuser=user -rpcpassword=pass -rpcwallet=faucet -generate 1
        done
    networks:
      - bdk_network

  # Development container for manual testing
  dev:
    image: mcr.microsoft.com/devcontainers/rust:latest
    container_name: bdk-dev
    command: ["sleep", "infinity"]
    profiles:
      - dev
    environment:
      - RUST_LOG=info,deposits_bdk=debug
      - ELECTRUM_URL=http://electrs:3002
      - NOSTR_RELAY=ws://nostr-relay:7777
    volumes:
      - ../../..:/workspace
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
      nostr-relay:
        condition: service_healthy
    networks:
      bdk_network:
        ipv4_address: 172.21.0.30
    working_dir: /workspace/deposits-rust

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: bdk-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bdk_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      bdk_network:
        ipv4_address: 172.21.0.40

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: bdk-grafana
    ports:
      - "3010:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - bdk_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      bdk_network:
        ipv4_address: 172.21.0.41

volumes:
  bdk_nostr_data:
  bdk_bitcoin_data:
  bdk_electrs_data:
  bdk_electrs_alice:
  bdk_electrs_bob:
  bdk_electrs_charlie:
  bdk_electrs_diana:
  bdk_alice_data:
  bdk_bob_data:
  bdk_charlie_data:
  bdk_diana_data:
  bdk_eve_data:
  bdk_prometheus_data:
  bdk_grafana_data:

networks:
  bdk_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
