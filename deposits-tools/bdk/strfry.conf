##
## Custom strfry config for deposits-bdk
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 1000000
    realIpHeader = ""

    info {
        name = "deposits-bdk relay"
        description = "Nostr relay for Bitcoin Deposits Protocol"
        pubkey = ""
        contact = ""
        icon = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000

    # Increased from 500 to support full ledger history fetch
    maxFilterLimit = 50000

    maxSubsPerConnection = 20

    writePolicy {
        # Disabled: accepting all events anyway, and per-event Python IPC
        # adds latency at high throughput (was ~134 events/sec)
        plugin = ""
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = true
        invalidEvents = true
    }

    numThreads {
        # Increased for high-throughput simulation (24+ connections, 100+ events/sec)
        ingester = 6
        reqWorker = 6
        reqMonitor = 6
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
