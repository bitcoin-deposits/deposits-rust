server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Only allow GET/HEAD — POST is intercepted by the Service Worker
        # and never reaches the server. A 405 here confirms the SW is working.
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ /index.html;
    }
}
