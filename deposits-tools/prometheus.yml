# Prometheus configuration for deposits-node cluster
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Bitcoin Core via exporter
  - job_name: 'bitcoin'
    static_configs:
      - targets:
          - 'bitcoin-exporter:9332'
        labels:
          cluster: 'regtest'

  # Electrs metrics (needs fallback protocol as electrs doesn't send Content-Type)
  - job_name: 'electrs'
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets:
          - 'electrs:4224'
        labels:
          cluster: 'regtest'

  # Main operator nodes (bare processes on host, unique metrics ports)
  - job_name: 'deposits-node'
    static_configs:
      - targets:
          - 'host.docker.internal:9101'
          - 'host.docker.internal:9102'
          - 'host.docker.internal:9103'
          - 'host.docker.internal:9104'
        labels:
          cluster: 'regtest'

  # Dynamic eve nodes (scaled with payment-simulator)
  - job_name: 'deposits-node-eve'
    static_configs:
      - targets:
          - 'host.docker.internal:9105'
        labels:
          cluster: 'regtest'
          node_type: 'eve'

  # Payment simulator (runs on host, exposes metrics on port 9200)
  - job_name: 'payment-simulator'
    static_configs:
      - targets:
          - 'host.docker.internal:9200'
        labels:
          cluster: 'regtest'

  # strfry Nostr relay exporter (runs on host, exposes metrics on port 9201)
  - job_name: 'strfry-relay'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'host.docker.internal:9201'
        labels:
          cluster: 'regtest'
