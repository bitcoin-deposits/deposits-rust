# Docker Compose override for adding LDK Lightning nodes (stock ldk-server)
#
# Adds LDK sidecars alongside deposits-node operators for Lightning payments.
# Uses stock ldk-server — no deposits-specific modifications.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.lightning.yml up -d
#
# Build the ldk-node image first:
#   docker build -f deposits-tools/Dockerfile.ldk-node -t ldk-node:latest ~/workspace/

x-ldk-common: &ldk-common
  build:
    context: ../..
    dockerfile: deposits-rust/deposits-tools/Dockerfile.ldk-node
  image: ldk-node:latest
  restart: unless-stopped
  environment: &ldk-env
    LDK_DATA_DIR: /ldk
    ELECTRUM_HOST: electrs
    ELECTRUM_PORT: "3002"
    NETWORK: regtest
    LDK_API_KEY: test_api_key
    RUST_LOG: info
    LDK_ONCHAIN_WALLET_SYNC_INTERVAL_SECS: "10"
    LDK_LIGHTNING_WALLET_SYNC_INTERVAL_SECS: "10"
  depends_on:
    bitcoin:
      condition: service_healthy
    electrs:
      condition: service_started
  networks:
    - regtest

x-operator-ln-env: &operator-ln-env
  RUST_LOG: info,deposits_node=debug
  LDK_PORT: "3000"
  LDK_API_KEY: test_api_key
  LDK_CLI: /ldk-cli/ldk-server-cli
  LDK_TLS_CERT: /ldk-data/tls.crt

services:
  alice-ln:
    <<: *ldk-common
    container_name: alice-ln
    environment:
      <<: *ldk-env
      NODE_NAME: alice
      TLS_HOSTNAME: alice-ln
      LISTEN_PORT: "9735"
    ports:
      - "9835:9735"
      - "3111:3000"
    volumes:
      - ldk_alice_data:/ldk
      - ldk_cli:/ldk-cli

  bob-ln:
    <<: *ldk-common
    container_name: bob-ln
    environment:
      <<: *ldk-env
      NODE_NAME: bob
      TLS_HOSTNAME: bob-ln
      LISTEN_PORT: "9736"
    ports:
      - "9836:9736"
      - "3112:3000"
    volumes:
      - ldk_bob_data:/ldk
      - ldk_cli:/ldk-cli

  charlie-ln:
    <<: *ldk-common
    container_name: charlie-ln
    environment:
      <<: *ldk-env
      NODE_NAME: charlie
      TLS_HOSTNAME: charlie-ln
      LISTEN_PORT: "9737"
    ports:
      - "9837:9737"
      - "3113:3000"
    volumes:
      - ldk_charlie_data:/ldk
      - ldk_cli:/ldk-cli

  diana-ln:
    <<: *ldk-common
    container_name: diana-ln
    environment:
      <<: *ldk-env
      NODE_NAME: diana
      TLS_HOSTNAME: diana-ln
      LISTEN_PORT: "9738"
    ports:
      - "9838:9738"
      - "3114:3000"
    volumes:
      - ldk_diana_data:/ldk
      - ldk_cli:/ldk-cli

  # Override operator nodes to add LDK sidecar connection
  alice:
    environment:
      <<: *operator-ln-env
      LDK_HOST: alice-ln
    volumes:
      - alice_data:/data
      - ldk_cli:/ldk-cli:ro
      - ldk_alice_data:/ldk-data:ro

  bob:
    environment:
      <<: *operator-ln-env
      LDK_HOST: bob-ln
    volumes:
      - bob_data:/data
      - ldk_cli:/ldk-cli:ro
      - ldk_bob_data:/ldk-data:ro

  charlie:
    environment:
      <<: *operator-ln-env
      LDK_HOST: charlie-ln
    volumes:
      - charlie_data:/data
      - ldk_cli:/ldk-cli:ro
      - ldk_charlie_data:/ldk-data:ro

  diana:
    environment:
      <<: *operator-ln-env
      LDK_HOST: diana-ln
    volumes:
      - diana_data:/data
      - ldk_cli:/ldk-cli:ro
      - ldk_diana_data:/ldk-data:ro

volumes:
  ldk_alice_data:
  ldk_bob_data:
  ldk_charlie_data:
  ldk_diana_data:
  ldk_cli:
