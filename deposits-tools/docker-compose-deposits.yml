services:
  # Strfry Nostr relay for NWC service
  nostr-relay:
    image: dockurr/strfry:latest
    container_name: nostr-relay
    ports:
      - "7777:7777"
    volumes:
      - nostr_data:/app/strfry-db
      - ./permissive-write-policy.py:/app/write-policy.py:ro
    environment:
      - STRFRY_BIND=0.0.0.0:7777
    networks:
      - ldk_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Bitcoin Core regtest node
  bitcoin:
    image: blockstream/bitcoind:27.2
    platform: linux/amd64
    container_name: bitcoind
    command:
      [
        "bitcoind",
        "-printtoconsole",
        "-regtest=1",
        "-rpcallowip=0.0.0.0/0",
        "-rpcbind=0.0.0.0",
        "-rpcuser=user",
        "-rpcpassword=pass",
        "-fallbackfee=0.00001",
        "-rest",
        "-txindex"
      ]
    ports:
      - "18443:18443"  # Regtest REST and RPC port
      - "18444:18444"  # Regtest P2P port
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    networks:
      ldk_network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=user", "-rpcpassword=pass", "getblockchaininfo"]
      interval: 5s
      timeout: 10s
      retries: 5

  # Electrs for blockchain indexing
  electrs:
    image: mempool/electrs:v3.2.0
    platform: linux/amd64
    container_name: electrs
    depends_on:
      bitcoin:
        condition: service_healthy
    command:
      [
        "-vvvv",
        "--timestamp",
        "--jsonrpc-import",
        "--cookie=user:pass",
        "--network=regtest",
        "--daemon-rpc-addr=bitcoin:18443",
        "--http-addr=0.0.0.0:3002"
      ]
    ports:
      - "3002:3002"
    volumes:
      - electrs_data:/data
    networks:
      ldk_network:
        ipv4_address: 172.20.0.11

  # LDK Node 1 - Alice
  ldk-alice:
    build:
      context: ../../
      dockerfile: deposits-rust/deposits-tools/Dockerfile.ldk-node
    container_name: ldk-alice
    environment:
      - NODE_NAME=alice
      - LDK_DATA_DIR=/ldk
      - BITCOIN_RPC_HOST=bitcoin
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=user
      - BITCOIN_RPC_PASSWORD=pass
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9735
      - ENABLE_DEPOSITS=true
      - NOSTR_RELAY_URL=ws://nostr-relay:7777
      - NWC_PRIVATE_KEY=4e5743616c696365000000000000000000000000000000000000000000000001
      - NWC_PUBLIC_KEY=879947b22512a75ff743159fa334086a58df320b947d22ba6eb667a687997599
      - RUST_LOG=ldk_node::deposits=debug,lightning=debug
      - RUST_BACKTRACE=0
    ports:
      - "9735:9735"   # Lightning P2P
      - "3011:3000"   # API port
    volumes:
      - alice_data:/ldk
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      ldk_network:
        ipv4_address: 172.20.0.20

  # LDK Node 2 - Bob
  ldk-bob:
    build:
      context: ../../
      dockerfile: deposits-rust/deposits-tools/Dockerfile.ldk-node
    container_name: ldk-bob
    environment:
      - NODE_NAME=bob
      - LDK_DATA_DIR=/ldk
      - BITCOIN_RPC_HOST=bitcoin
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=user
      - BITCOIN_RPC_PASSWORD=pass
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9736
      - ENABLE_DEPOSITS=true
      - NOSTR_RELAY_URL=ws://nostr-relay:7777
      - NWC_PRIVATE_KEY=4e5743626f620000000000000000000000000000000000000000000000000002
      - NWC_PUBLIC_KEY=b234e6e4e0b53dd3c46f5baa8a82ab6f9c23c4b2e6f5b2e6c5e6d3b2e6c5e6d3
      - RUST_LOG=ldk_node::deposits=debug,lightning=debug
      - RUST_BACKTRACE=0
    ports:
      - "9736:9736"   # Lightning P2P
      - "3012:3000"   # API port
    volumes:
      - bob_data:/ldk
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      ldk_network:
        ipv4_address: 172.20.0.21

  # LDK Node 3 - Charlie
  ldk-charlie:
    build:
      context: ../../
      dockerfile: deposits-rust/deposits-tools/Dockerfile.ldk-node
    container_name: ldk-charlie
    environment:
      - NODE_NAME=charlie
      - LDK_DATA_DIR=/ldk
      - BITCOIN_RPC_HOST=bitcoin
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=user
      - BITCOIN_RPC_PASSWORD=pass
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9737
      - ENABLE_DEPOSITS=true
      - NOSTR_RELAY_URL=ws://nostr-relay:7777
      - RUST_LOG=ldk_node::deposits=debug,lightning=debug
      - RUST_BACKTRACE=0
    ports:
      - "9737:9737"   # Lightning P2P
      - "3013:3000"   # API port
    volumes:
      - charlie_data:/ldk
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      ldk_network:
        ipv4_address: 172.20.0.22

  # LDK Node 4 - Diana
  ldk-diana:
    profiles:
      - dev  # Only start with: docker-compose --profile dev up
    build:
      context: ../../
      dockerfile: deposits-rust/deposits-tools/Dockerfile.ldk-node
    container_name: ldk-diana
    environment:
      - NODE_NAME=diana
      - LDK_DATA_DIR=/ldk
      - BITCOIN_RPC_HOST=bitcoin
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=user
      - BITCOIN_RPC_PASSWORD=pass
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9738
      - ENABLE_DEPOSITS=true
      - NOSTR_RELAY_URL=ws://nostr-relay:7777
      - RUST_LOG=ldk_node::deposits=debug,lightning=debug
      - RUST_BACKTRACE=0
    ports:
      - "9738:9738"   # Lightning P2P
      - "3014:3000"   # API port
    volumes:
      - diana_data:/ldk
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      ldk_network:
        ipv4_address: 172.20.0.23

  # LDK Node 5 - Eve
  ldk-eve:
    profiles:
      - dev  # Only start with: docker-compose --profile dev up
    build:
      context: ../../
      dockerfile: deposits-rust/deposits-tools/Dockerfile.ldk-node
    container_name: ldk-eve
    environment:
      - NODE_NAME=eve
      - LDK_DATA_DIR=/ldk
      - BITCOIN_RPC_HOST=bitcoin
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=user
      - BITCOIN_RPC_PASSWORD=pass
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9739
      - ENABLE_DEPOSITS=true
      - NOSTR_RELAY_URL=ws://nostr-relay:7777
      - RUST_LOG=ldk_node::deposits=debug,lightning=debug
      - RUST_BACKTRACE=0
    ports:
      - "9739:9739"   # Lightning P2P
      - "3015:3000"   # API port
    volumes:
      - eve_data:/ldk
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      ldk_network:
        ipv4_address: 172.20.0.24

  # LDK Node 6 - Frank
  ldk-frank:
    profiles:
      - dev  # Only start with: docker-compose --profile dev up
    build:
      context: ../../
      dockerfile: deposits-rust/deposits-tools/Dockerfile.ldk-node
    container_name: ldk-frank
    environment:
      - NODE_NAME=frank
      - LDK_DATA_DIR=/ldk
      - BITCOIN_RPC_HOST=bitcoin
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=user
      - BITCOIN_RPC_PASSWORD=pass
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9740
      - ENABLE_DEPOSITS=true
      - NOSTR_RELAY_URL=ws://nostr-relay:7777
      - RUST_LOG=ldk_node::deposits=debug,lightning=debug
      - RUST_BACKTRACE=0
    ports:
      - "9740:9740"   # Lightning P2P
      - "3016:3000"   # API port
    volumes:
      - frank_data:/ldk
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      ldk_network:
        ipv4_address: 172.20.0.25

  # LDK Grace Development Container
  ldk-grace:
    image: mcr.microsoft.com/devcontainers/rust:latest
    container_name: ldk-grace
    command: ["sleep", "infinity"]  # Keep container running for dev work
    profiles:
      - dev  # Only start with: docker-compose --profile dev up
    environment:
      - NODE_NAME=grace
      - LDK_DATA_DIR=/tmp
      - BITCOIN_RPC_HOST=bitcoin
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=user
      - BITCOIN_RPC_PASSWORD=pass
      - ELECTRUM_HOST=electrs
      - ELECTRUM_PORT=3002
      - LISTEN_PORT=9741
      - ENABLE_DEPOSITS=true
      - NOSTR_RELAY_URL=ws://nostr-relay:7777
      - NWC_PRIVATE_KEY=4e57436762616365000000000000000000000000000000000000000000000007
      - NWC_PUBLIC_KEY=2bd5e3c4f1a7d8e9b2c5a6f3e8d7c4b1a9e6f2d5c8b3a7e1f4d9c2b5e8f1a4d7
      - RUST_LOG=ldk_node::deposits=debug,lightning=debug
      - RUST_BACKTRACE=0
    ports:
      - "9741:9741"   # Lightning P2P
      - "3017:3000"   # API port
    volumes:
      - .:/workspace
      - grace_data:/tmp
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      ldk_network:
        ipv4_address: 172.20.0.30
    working_dir: /workspace


  # Network Status Display
  network-status:
    build:
      context: ../../
      dockerfile: deposits-rust/deposits-tools/Dockerfile.ldk-node
    container_name: network-status
    command: ["sh", "-c", "sleep 30 && cargo run --features bitcoin-deposits --bin status network"]
    depends_on:
      - ldk-alice
      - ldk-bob
      - ldk-charlie
      - ldk-diana
      - ldk-eve
      - ldk-frank
    networks:
      - ldk_network
    profiles:
      - status

volumes:
  nostr_data:
  bitcoin_data:
  electrs_data:
  alice_data:
  grace_data:
  bob_data:
  charlie_data:
  diana_data:
  eve_data:
  frank_data:

networks:
  ldk_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
