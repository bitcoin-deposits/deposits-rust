# Docker Compose for deposits-node infrastructure services
#
# Infrastructure only — operator nodes run as bare processes on the host.
# Use bin/reinit.sh to start everything (infra + nodes).
#
# Usage:
#   cd deposits-tools
#   docker compose up -d              # Start infrastructure
#   source bin/_common.sh && start_all_nodes  # Start operator nodes
#
# Block explorer (electrs REST API):
#   curl http://localhost:3102/blocks
#   curl http://localhost:3102/tx/<txid>
#
# Monitoring:
#   Prometheus: http://localhost:9190
#   Grafana:    http://localhost:3110

services:
  # Nostr relays run natively (not in Docker) — see _common.sh start_all_relays.
  # Ports: alice=7801, bob=7802, charlie=7803, diana=7804, ledgers=7779.

  # Bitcoin Core regtest node
  bitcoin:
    image: blockstream/bitcoind:27.2
    platform: linux/amd64
    container_name: bitcoind
    command:
      [
        "bitcoind",
        "-printtoconsole",
        "-regtest=1",
        "-rpcallowip=0.0.0.0/0",
        "-rpcbind=0.0.0.0",
        "-rpcuser=user",
        "-rpcpassword=pass",
        "-fallbackfee=0.00001",
        "-rest",
        "-txindex"
      ]
    ports:
      - "18543:18443"  # Regtest RPC port (offset to avoid conflict with LDK compose)
      - "18544:18444"  # Regtest P2P port
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    networks:
      regtest:
        ipv4_address: 172.21.0.10
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=user", "-rpcpassword=pass", "getblockchaininfo"]
      interval: 5s
      timeout: 10s
      retries: 5

  # Electrs for external access (wallet, block explorer, all nodes)
  electrs:
    image: mempool/electrs:v3.2.0
    platform: linux/amd64
    container_name: electrs
    depends_on:
      bitcoin:
        condition: service_healthy
    command:
      [
        "-vvvv",
        "--timestamp",
        "--jsonrpc-import",
        "--cookie=user:pass",
        "--network=regtest",
        "--daemon-rpc-addr=bitcoin:18443",
        "--http-addr=0.0.0.0:3002",
        "--monitoring-addr=0.0.0.0:4224"
      ]
    ports:
      - "3102:3002"
      - "4224:4224"
    volumes:
      - electrs_data:/data
    networks:
      regtest:
        ipv4_address: 172.21.0.11

  # Bitcoin Prometheus exporter
  bitcoin-exporter:
    image: jvstein/bitcoin-prometheus-exporter:v0.9.0
    platform: linux/amd64
    container_name: bitcoin-exporter
    depends_on:
      bitcoin:
        condition: service_healthy
    environment:
      - BITCOIN_RPC_HOST=bitcoin
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=user
      - BITCOIN_RPC_PASSWORD=pass
      - REFRESH_SECONDS=15
      - LOG_LEVEL=INFO
    networks:
      - regtest

  # =========================================================================
  # Lightning node (profile: lightning)
  # Single shared LDK node — all operators use via self-pay wrapper.
  # Start with: docker compose --profile lightning up -d
  # Build with: docker build -f deposits-tools/Dockerfile.ldk-node -t ldk-node:latest ~/workspace/
  # =========================================================================

  lightning:
    image: ldk-node:latest
    container_name: lightning
    profiles: [lightning]
    restart: unless-stopped
    environment:
      LDK_DATA_DIR: /ldk
      ELECTRUM_HOST: electrs
      ELECTRUM_PORT: "3002"
      NETWORK: regtest
      LDK_API_KEY: test_api_key
      RUST_LOG: info
      LDK_ONCHAIN_WALLET_SYNC_INTERVAL_SECS: "10"
      LDK_LIGHTNING_WALLET_SYNC_INTERVAL_SECS: "10"
      NODE_NAME: lightning
      TLS_HOSTNAME: lightning
      LISTEN_PORT: "9735"
    ports:
      - "9835:9735"
      - "3111:3000"
    volumes:
      - ldk_data:/ldk
      - ldk_cli:/ldk-cli
      - ./ldk-server-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      - regtest

  # =========================================================================
  # Lightning address verifier (profile: lightning)
  # Nostr-native service that verifies npub <-> lightning address links.
  # =========================================================================

  lightning-verify:
    build:
      context: ../../lightning-verifier
    container_name: lightning-verify
    profiles: [lightning]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VERIFY_NSEC_FILE: /run/secrets/verify_nsec
      VERIFY_RELAYS: ws://host.docker.internal:7779
      VERIFY_CHALLENGE_SATS: "1000"
      VERIFY_NUM_PAYMENTS: "3"
      VERIFY_TIMEOUT_SECS: "120"
      VERIFY_FEE_FALLBACK_SATS: "1"
      VERIFY_CA_CERT: /certs/ca.crt
      LDK_CLI: /ldk-cli/ldk-server-cli
      LDK_HOST: lightning
      LDK_PORT: "3000"
      LDK_API_KEY_FILE: /run/secrets/ldk_api_key
      LDK_TLS_CERT: /certs/lightning.crt
      RUST_LOG: info
    volumes:
      - ldk_cli:/ldk-cli:ro
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      lightning:
        condition: service_started
    networks:
      - regtest

  # =========================================================================
  # Fake NIP-05 / LNURL server for testing (profile: lightning)
  # Serves .well-known/nostr.json and .well-known/lnurlp/<user> from files
  # generated by test scripts. Accessible as the "domain" for lightning
  # addresses like alice@nip05 (using docker network hostname).
  # =========================================================================

  nip05:
    image: nginx:alpine
    container_name: nip05
    profiles: [lightning]
    ports:
      - "8805:443"
    volumes:
      - nip05_data:/usr/share/nginx/html/.well-known:ro
      - ./nip05-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    networks:
      regtest:
        ipv4_address: 172.21.0.50

  # Web wallet — static HTML served via nginx (live-mounted for dev)
  wallet:
    image: nginx:alpine
    container_name: wallet
    ports:
      - "8888:80"
    volumes:
      - ./wallet:/usr/share/nginx/html:ro
      - ./wallet/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - regtest

  # Lightweight regtest block miner (~5MB alpine+curl container)
  # Mines 1 block/sec so transfer timeouts resolve promptly after restarts.
  # Uses JSON-RPC directly — no bitcoind binary needed.
  miner:
    image: alpine:3.21
    container_name: miner
    depends_on:
      bitcoin:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null 2>&1
        RPC="http://user:pass@bitcoin:18443/wallet/faucet"

        # Wait for faucet wallet (created by reinit.sh)
        echo "Waiting for faucet wallet..."
        until curl -sf -d '{"method":"getbalance"}' $$RPC >/dev/null 2>&1; do
          sleep 2
        done

        # Get a mining address (reused for all blocks)
        ADDR=$(curl -sf -d '{"method":"getnewaddress"}' $$RPC | sed 's/.*"result":"\([^"]*\)".*/\1/')
        echo "Mining to $$ADDR (1 block/sec)"

        while true; do
          curl -sf -d "{\"method\":\"generatetoaddress\",\"params\":[1,\"$$ADDR\"]}" $$RPC >/dev/null
          sleep 1
        done
    networks:
      - regtest

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: deposits-prometheus
    ports:
      - "9190:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      regtest:
        ipv4_address: 172.21.0.40

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: deposits-grafana
    ports:
      - "3110:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      regtest:
        ipv4_address: 172.21.0.41

volumes:
  bitcoin_data:
  electrs_data:
  ldk_data:
  ldk_cli:
  nip05_data:
  prometheus_data:
  grafana_data:

networks:
  regtest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
