# Docker Compose for deposits-node infrastructure services
#
# Infrastructure only — operator nodes run as bare processes on the host.
# Use bin/reinit.sh to start everything (infra + nodes).
#
# Usage:
#   cd deposits-tools
#   docker-compose up -d              # Start infrastructure
#   source bin/_common.sh && start_all_nodes  # Start operator nodes
#
# Block explorer (electrs REST API):
#   curl http://localhost:3102/blocks
#   curl http://localhost:3102/tx/<txid>
#
# Monitoring:
#   Prometheus: http://localhost:9190
#   Grafana:    http://localhost:3110

services:
  # Nostr relays run natively (not in Docker) — see _common.sh start_all_relays.
  # Ports: alice=7801, bob=7802, charlie=7803, diana=7804, ledgers=7779.

  # Bitcoin Core regtest node
  bitcoin:
    image: blockstream/bitcoind:27.2
    platform: linux/amd64
    container_name: bitcoind
    command:
      [
        "bitcoind",
        "-printtoconsole",
        "-regtest=1",
        "-rpcallowip=0.0.0.0/0",
        "-rpcbind=0.0.0.0",
        "-rpcuser=user",
        "-rpcpassword=pass",
        "-fallbackfee=0.00001",
        "-rest",
        "-txindex"
      ]
    ports:
      - "18543:18443"  # Regtest RPC port (offset to avoid conflict with LDK compose)
      - "18544:18444"  # Regtest P2P port
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    networks:
      regtest:
        ipv4_address: 172.21.0.10
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=user", "-rpcpassword=pass", "getblockchaininfo"]
      interval: 5s
      timeout: 10s
      retries: 5

  # Electrs for external access (wallet, block explorer, all nodes)
  electrs:
    image: mempool/electrs:v3.2.0
    platform: linux/amd64
    container_name: electrs
    depends_on:
      bitcoin:
        condition: service_healthy
    command:
      [
        "-vvvv",
        "--timestamp",
        "--jsonrpc-import",
        "--cookie=user:pass",
        "--network=regtest",
        "--daemon-rpc-addr=bitcoin:18443",
        "--http-addr=0.0.0.0:3002",
        "--monitoring-addr=0.0.0.0:4224"
      ]
    ports:
      - "3102:3002"
      - "4224:4224"
    volumes:
      - electrs_data:/data
    networks:
      regtest:
        ipv4_address: 172.21.0.11

  # Bitcoin Prometheus exporter
  bitcoin-exporter:
    image: jvstein/bitcoin-prometheus-exporter:v0.9.0
    platform: linux/amd64
    container_name: bitcoin-exporter
    depends_on:
      bitcoin:
        condition: service_healthy
    environment:
      - BITCOIN_RPC_HOST=bitcoin
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=user
      - BITCOIN_RPC_PASSWORD=pass
      - REFRESH_SECONDS=15
      - LOG_LEVEL=INFO
    networks:
      - regtest

  # =========================================================================
  # Lightning node (profile: lightning)
  # Single shared LDK node — all operators use via self-pay wrapper.
  # Start with: docker-compose --profile lightning up -d
  # Build with: docker build -f deposits-tools/Dockerfile.ldk-node -t ldk-node:latest ~/workspace/
  # =========================================================================

  lightning:
    image: ldk-node:latest
    container_name: lightning
    profiles: [lightning]
    restart: unless-stopped
    environment:
      LDK_DATA_DIR: /ldk
      ELECTRUM_HOST: electrs
      ELECTRUM_PORT: "3002"
      NETWORK: regtest
      LDK_API_KEY: test_api_key
      RUST_LOG: info
      LDK_ONCHAIN_WALLET_SYNC_INTERVAL_SECS: "10"
      LDK_LIGHTNING_WALLET_SYNC_INTERVAL_SECS: "10"
      NODE_NAME: lightning
      TLS_HOSTNAME: lightning
      LISTEN_PORT: "9735"
    ports:
      - "9835:9735"
      - "3111:3000"
    volumes:
      - ldk_data:/ldk
      - ldk_cli:/ldk-cli
      - ./docker/ldk-server-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      bitcoin:
        condition: service_healthy
      electrs:
        condition: service_started
    networks:
      - regtest

  # =========================================================================
  # Lightning-address attestation service (profile: lightning)
  #
  # Single container running two processes:
  #   • deposits-attest (Rust) — Nostr-native challenge-response service
  #     that issues signed attestations linking an npub to a lightning
  #     address. Operators can gate deposits behind these attestations,
  #     but they're optional — nothing in the core protocol requires them.
  #   • lnurl-server.py (test fixture) — serves .well-known/nostr.json
  #     (NIP-05) and .well-known/lnurlp/<user> (LUD-06/LUD-16) on 443/HTTPS
  #     so the attest service has a fake lightning-address provider to
  #     probe in test topologies.
  #
  # The static IP is baked into LNURL callback URLs, so tests that resolve
  # `user@172.21.0.50` hit this container directly.
  # =========================================================================

  lnaddr-attest:
    build:
      context: ../
      dockerfile: deposits-attestation/Dockerfile
    container_name: lnaddr-attest
    profiles: [lightning]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    ports:
      - "8805:443"
    environment:
      # deposits-attest (Rust)
      VERIFY_NSEC_FILE: /run/secrets/verify_nsec
      # Both relays: the durable "ledgers" relay carries attestations
      # (Kind 55502); the ephemeral "messaging" relay is where wallets
      # gift-wrap kind 25500 verify requests. The attest service needs
      # to see both. Defaults to 17779/17780 — override at compose time
      # via $RELAY_LEDGERS_PORT / $RELAY_MESSAGING_PORT.
      VERIFY_RELAYS: ws://host.docker.internal:${RELAY_LEDGERS_PORT:-17779},ws://host.docker.internal:${RELAY_MESSAGING_PORT:-17780}
      VERIFY_CHALLENGE_SATS: "1000"
      VERIFY_NUM_PAYMENTS: "3"
      VERIFY_TIMEOUT_SECS: "120"
      VERIFY_FEE_FALLBACK_SATS: "1"
      # Short NIP-05 cache so test-side `nip05_register` calls aren't
      # stalled by stale per-domain name maps from a previous run.
      VERIFY_NIP05_CACHE_SECS: "5"
      # Cover refresh — keep short for tests so a freshly-published
      # kind:3 makes it into the cover within seconds. Production
      # deployments override to a much longer value (1 hour+).
      VERIFY_COVER_REFRESH_SECS: "5"
      VERIFY_CA_CERT: /certs/ca.crt
      # `proclaim` action: lets a signer who's on op0's manual allowlist
      # vouch for an arbitrary npub. Op0's allowlist is bind-mounted ro
      # below.
      VERIFY_ALLOWLIST_FILE: /allowlist/deposit_allowlist.txt
      # LDK (shared)
      LDK_CLI: /app/ldk-cli-wrapper.sh
      LDK_HOST: lightning
      LDK_PORT: "3000"
      LDK_TLS_CERT: /ldk-data/tls.crt
      LDK_SELF_PAY_DIR: /self-pay
      # lnurl-server.py (test fixture)
      LNURL_HOST: "172.21.0.50"
      NIP05_FILE: /data/nostr.json
      RUST_LOG: info
    volumes:
      - ldk_cli:/ldk-cli:ro
      - ldk_data:/ldk-data:ro
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro
      - ./bin/ldk-cli-wrapper.sh:/app/ldk-cli-wrapper.sh:ro
      - ../deposits-attestation/docker/lnaddr-attest-entrypoint.sh:/app/entrypoint.sh:ro
      - ../deposits-attestation/docker/lnurl-server.py:/app/lnurl-server.py:ro
      # Op0's deposit_allowlist.txt mounted ro for the proclaim action.
      # Mount the directory, not the file, so the file may not yet exist
      # at compose-up time.
      - ./data/op0:/allowlist:ro
      - nip05_data:/data
      - self_pay_data:/self-pay
    depends_on:
      lightning:
        condition: service_started
    networks:
      regtest:
        ipv4_address: 172.21.0.50

  # =========================================================================
  # LNURL-pay gateway — Nostr-native invoice creation for deposits
  # =========================================================================

  lnurl:
    build:
      context: ../
      dockerfile: deposits-lnurl/Dockerfile
    container_name: lnurl
    profiles: [lightning]
    ports:
      - "3000:3000"
    environment:
      LNURL_NSEC: "${LNURL_NSEC:-4c4e55524c7061790000000000000000000000000000000000000000000000ff}"
      LNURL_RELAYS: "ws://alice:7777,ws://bob:7777,ws://charlie:7777,ws://diana:7777"
      LNURL_DOMAIN: "${LNURL_DOMAIN:-localhost:3000}"
      LNURL_LISTEN: "0.0.0.0:3000"
      LNURL_MIN_SATS: "1"
      LNURL_MAX_SATS: "1000000"
      RUST_LOG: "info"
    networks:
      - regtest

  # Web wallet — static HTML served via nginx (live-mounted for dev)
  wallet:
    image: nginx:alpine
    container_name: wallet
    ports:
      - "8888:80"
    volumes:
      - ../deposits-web/wallet:/usr/share/nginx/html:ro
      - ../deposits-web/wallet/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - regtest

  # Lightweight regtest block miner (~5MB alpine+curl container)
  # Mines 1 block/sec so transfer timeouts resolve promptly after restarts.
  # Uses JSON-RPC directly — no bitcoind binary needed.
  miner:
    image: alpine:3.21
    container_name: miner
    depends_on:
      bitcoin:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    volumes:
      - ./docker/miner-entrypoint.sh:/app/entrypoint.sh:ro
    networks:
      - regtest

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: deposits-prometheus
    ports:
      - "9190:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      regtest:
        ipv4_address: 172.21.0.40

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: deposits-grafana
    ports:
      - "3110:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      regtest:
        ipv4_address: 172.21.0.41

volumes:
  bitcoin_data:
  electrs_data:
  ldk_data:
  ldk_cli:
  nip05_data:
  self_pay_data:
  prometheus_data:
  grafana_data:

networks:
  regtest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
