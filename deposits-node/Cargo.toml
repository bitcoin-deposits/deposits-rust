[package]
name = "deposits-node"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Deposits Protocol - Nostr Implementation"
license = "MIT OR Apache-2.0"

[dependencies]
# Core protocol logic
deposits-core = { path = "../deposits-core" }
# Nostr transport, message types, and wire constants. Used to live
# inline at `crate::nostr`; lifted out so `deposits-wallet` doesn't
# have to depend on the daemon. Re-exported under the same path in
# lib.rs so `crate::nostr::…` keeps working.
deposits-nostr = { path = "../deposits-nostr" }
deposits-signer-api = { path = "../deposits-signer-api" }
deposits-signer = { path = "../deposits-signer" }
# Wire types + transport for hub control-plane registration.
deposits-hub-proto = { path = "../deposits-hub-proto" }

# Bitcoin
bitcoin = { version = "0.32", features = ["serde"] }
bdk_wallet = "1.0"
bdk_esplora = { version = "0.20", features = ["blocking", "async-https-rustls"] }
# Direct dep so we can pick up the `tokio` feature (the cosign hot path
# uses `EsploraBuilder::build_async()`, which needs `async + tokio`).
esplora-client = { version = "0.11", default-features = false, features = ["async", "async-https-rustls", "tokio"] }

# Nostr for peer messaging
nostr-sdk = { version = "0.37", features = ["nip44", "nip47", "nip59"] }

# AES-256-CBC primitives for the NIP-04 fallback decrypt path
# (`nip04_decrypt_with_shared_key` in `nostr.rs`). Pinned to versions
# nostr-sdk pulls transitively so we don't end up with two copies.
aes = "0.8"
cbc = "0.1"

# TLS crypto provider for nostr-sdk
rustls = { version = "0.23", features = ["ring"] }

# TLS - pin to fix build on Rust 1.85+
native-tls = "0.2.17"

# Async runtime
tokio = { version = "1", features = ["full"] }
libc = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Span-to-flamegraph layer. Enabled when env var TRACING_FLAME_PATH=<file>
# is set on `deposits-node run`; capture spans during a workload, then
# render with `inferno-flamegraph < tracing.folded > flamegraph.svg`.
tracing-flame = "0.2"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# CLI utilities
dirs = "5.0"

# Error handling
thiserror = "1"

# Utilities
hex = "0.4"
base64 = "0.22"
chrono = "0.4"
sha2 = "0.10"

# BIP39 mnemonic for operator seed delivery (bootstrap)
bip39 = "2"

# Lightning invoice parsing
lightning-invoice = "0.32"

# HTTP client for lightning payments
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }

# HTTP server for the operator admin UI.
# Pairs with the embedded vanilla-JS frontend served from
# deposits-node/admin-ui/. Pin to a stable axum 0.7.x so the bearer-token
# middleware shape doesn't shift under us.
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header"] }
rand = "0.8"


# CPU profiler — timer-based sampling, works in Docker on any host OS
pprof = { version = "0.14", features = ["flamegraph", "protobuf-codec"] }

# Memory allocator — jemalloc reduces fragmentation under sustained alloc/dealloc workloads
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[features]
default = []
# WARNING: This feature enables commands that can create invalid/malicious ledger updates.
# Only use for testing recovery mechanisms. Never enable in production builds.
dangerous-testing = []

[lints]
workspace = true

[dev-dependencies]
tokio-test = "0.4"
libc = "0.2"
tempfile = "3"

[[bin]]
name = "deposits-node"
path = "src/bin/deposits-node.rs"

# deposits-wallet moved to its own crate at ../deposits-wallet/

[[bin]]
name = "nostr-ping"
path = "src/bin/nostr-ping.rs"

[[bin]]
name = "nostr-bench"
path = "src/bin/nostr-bench.rs"

[[bin]]
name = "transfer-simulator"
path = "src/bin/transfer-simulator.rs"

[[bin]]
name = "deposit-bot"
path = "src/bin/deposit-bot.rs"

[[bin]]
name = "htlc-agent"
path = "src/bin/htlc-agent.rs"

[[bin]]
name = "deposits-bridge"
path = "src/bin/bridge.rs"
