[package]
name = "deposits-node"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Deposits Protocol - Nostr Implementation"
license = "MIT OR Apache-2.0"

[dependencies]
# Core protocol logic
deposits-core = { path = "../deposits-core" }

# Bitcoin
bitcoin = { version = "0.32", features = ["serde"] }
bdk_wallet = "1.0"
bdk_esplora = { version = "0.20", features = ["blocking", "async-https-rustls"] }
# Direct dep so we can pick up the `tokio` feature (the cosign hot path
# uses `EsploraBuilder::build_async()`, which needs `async + tokio`).
esplora-client = { version = "0.11", default-features = false, features = ["async", "async-https-rustls", "tokio"] }

# Nostr for peer messaging
nostr-sdk = { version = "0.37", features = ["nip44", "nip47", "nip59"] }

# TLS crypto provider for nostr-sdk
rustls = { version = "0.23", features = ["ring"] }

# TLS - pin to fix build on Rust 1.85+
native-tls = "0.2.17"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Span-to-flamegraph layer. Enabled when env var TRACING_FLAME_PATH=<file>
# is set on `deposits-node run`; capture spans during a workload, then
# render with `inferno-flamegraph < tracing.folded > flamegraph.svg`.
tracing-flame = "0.2"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# CLI utilities
dirs = "5.0"

# Error handling
thiserror = "1"

# Utilities
hex = "0.4"
base64 = "0.22"
chrono = "0.4"
sha2 = "0.10"

# BIP39 mnemonic for operator seed delivery (bootstrap)
bip39 = "2"

# Lightning invoice parsing
lightning-invoice = "0.32"

# HTTP client for lightning payments
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }


# CPU profiler — timer-based sampling, works in Docker on any host OS
pprof = { version = "0.14", features = ["flamegraph", "protobuf-codec"] }

# Memory allocator — jemalloc reduces fragmentation under sustained alloc/dealloc workloads
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[features]
default = []
# WARNING: This feature enables commands that can create invalid/malicious ledger updates.
# Only use for testing recovery mechanisms. Never enable in production builds.
dangerous-testing = []

[lints]
workspace = true

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[[bin]]
name = "deposits-node"
path = "src/bin/deposits-node.rs"

# deposits-wallet moved to its own crate at ../deposits-wallet/

[[bin]]
name = "nostr-ping"
path = "src/bin/nostr-ping.rs"

[[bin]]
name = "nostr-bench"
path = "src/bin/nostr-bench.rs"

[[bin]]
name = "transfer-simulator"
path = "src/bin/transfer-simulator.rs"

[[bin]]
name = "htlc-agent"
path = "src/bin/htlc-agent.rs"
