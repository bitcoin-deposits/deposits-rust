# 8-node regtest cluster
#
# All-in-one compose for a self-contained deposits network:
#   8 operator nodes (each with ephemeral strfry relay)
#   1 persistent ledger relay (strfry)
#   1 bitcoind + 1 electrs
#   1 shared LDK lightning node
#   1 LNURL-pay gateway
#   1 block miner (10s interval)
#
# Usage:
#   docker compose -f docker-compose.cluster.yml up -d
#   docker compose -f docker-compose.cluster.yml logs -f node1
#
# Seeds are deterministic from node name for reproducibility.

x-node-common: &node-common
  build:
    context: ../../
    dockerfile: deposits-node/Dockerfile
  restart: unless-stopped
  depends_on:
    electrs:
      condition: service_started
    ledger-relay:
      condition: service_started
  environment: &node-env
    NETWORK: regtest
    ELECTRUM_URL: http://electrs:3000
    LEDGER_RELAY: ws://ledger-relay:7777
    RELAY_PORT: "7777"
    RUST_LOG: "info,nostr_relay_pool=warn,nostr_sdk=warn"
  networks:
    - cluster

services:
  # ===========================================================================
  # Bitcoin infrastructure
  # ===========================================================================

  bitcoind:
    image: blockstream/bitcoind:27.2
    platform: linux/amd64
    container_name: bitcoind
    command:
      - bitcoind
      - -printtoconsole
      - -regtest=1
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=user
      - -rpcpassword=pass
      - -fallbackfee=0.00001
      - -rest
      - -txindex
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    networks:
      - cluster
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=user", "-rpcpassword=pass", "getblockchaininfo"]
      interval: 5s
      timeout: 10s
      retries: 5

  electrs:
    image: mempool/electrs:v3.2.0
    platform: linux/amd64
    container_name: electrs
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - -vvvv
      - --timestamp
      - --jsonrpc-import
      - --cookie=user:pass
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:18443
      - --http-addr=0.0.0.0:3000
    volumes:
      - electrs_data:/data
    networks:
      - cluster

  miner:
    image: alpine:3.21
    container_name: miner
    depends_on:
      bitcoind:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null 2>&1
        RPC="http://user:pass@bitcoind:18443/wallet/faucet"
        echo "Waiting for faucet wallet..."
        until curl -sf -d '{"method":"getbalance"}' $$RPC >/dev/null 2>&1; do
          # Create faucet wallet if needed
          curl -sf -d '{"method":"createwallet","params":["faucet"]}' http://user:pass@bitcoind:18443 >/dev/null 2>&1 || true
          sleep 2
        done
        ADDR=$$(curl -sf -d '{"method":"getnewaddress"}' $$RPC | sed 's/.*"result":"\([^"]*\)".*/\1/')
        echo "Mining to $$ADDR (1 block/10s)"
        while true; do
          curl -sf -d "{\"method\":\"generatetoaddress\",\"params\":[1,\"$$ADDR\"]}" $$RPC >/dev/null
          sleep 10
        done
    networks:
      - cluster

  # ===========================================================================
  # Persistent ledger relay (advertisements + durable updates)
  # ===========================================================================

  ledger-relay:
    image: dockurr/strfry
    container_name: ledger-relay
    volumes:
      - ledger_relay_data:/app/strfry-db
    networks:
      - cluster

  # ===========================================================================
  # Lightning node (shared by all operators via self-pay)
  # ===========================================================================

  lightning:
    image: ldk-node:latest
    container_name: lightning
    restart: unless-stopped
    environment:
      LDK_DATA_DIR: /ldk
      ELECTRUM_HOST: electrs
      ELECTRUM_PORT: "3000"
      NETWORK: regtest
      RUST_LOG: info
    volumes:
      - ldk_data:/ldk
    depends_on:
      electrs:
        condition: service_started
    networks:
      - cluster

  # ===========================================================================
  # LNURL-pay gateway
  # ===========================================================================

  lnurl:
    build:
      context: ../../
      dockerfile: deposits-tools/Dockerfile.lnurl
    container_name: lnurl
    ports:
      - "3000:3000"
    environment:
      LNURL_NSEC: "4c4e55524c7061790000000000000000000000000000000000000000000000ff"
      LNURL_RELAYS: "ws://node1:7777,ws://node2:7777,ws://node3:7777,ws://node4:7777,ws://node5:7777,ws://node6:7777,ws://node7:7777,ws://node8:7777"
      LNURL_DOMAIN: "${LNURL_DOMAIN:-localhost:3000}"
      LNURL_LISTEN: "0.0.0.0:3000"
      RUST_LOG: info
    depends_on:
      - node1
    networks:
      - cluster

  # ===========================================================================
  # Operator nodes (1-8)
  #
  # Each runs deposits-node + bundled strfry relay.
  # Seeds are deterministic: sha256("node<N>") truncated to 32 bytes.
  # EPHEMERAL_RELAYS connects each node to all other nodes' relays.
  # ===========================================================================

  node1:
    <<: *node-common
    container_name: node1
    environment:
      <<: *node-env
      NODE_SEED: "4e6f646531000000000000000000000000000000000000000000000000000001"
      NODE_NAME: node1
      EPHEMERAL_RELAYS: "ws://node2:7777,ws://node3:7777,ws://node4:7777,ws://node5:7777,ws://node6:7777,ws://node7:7777,ws://node8:7777"
    volumes:
      - node1_data:/data

  node2:
    <<: *node-common
    container_name: node2
    environment:
      <<: *node-env
      NODE_SEED: "4e6f646532000000000000000000000000000000000000000000000000000002"
      NODE_NAME: node2
      EPHEMERAL_RELAYS: "ws://node1:7777,ws://node3:7777,ws://node4:7777,ws://node5:7777,ws://node6:7777,ws://node7:7777,ws://node8:7777"
    volumes:
      - node2_data:/data

  node3:
    <<: *node-common
    container_name: node3
    environment:
      <<: *node-env
      NODE_SEED: "4e6f646533000000000000000000000000000000000000000000000000000003"
      NODE_NAME: node3
      EPHEMERAL_RELAYS: "ws://node1:7777,ws://node2:7777,ws://node4:7777,ws://node5:7777,ws://node6:7777,ws://node7:7777,ws://node8:7777"
    volumes:
      - node3_data:/data

  node4:
    <<: *node-common
    container_name: node4
    environment:
      <<: *node-env
      NODE_SEED: "4e6f646534000000000000000000000000000000000000000000000000000004"
      NODE_NAME: node4
      EPHEMERAL_RELAYS: "ws://node1:7777,ws://node2:7777,ws://node3:7777,ws://node5:7777,ws://node6:7777,ws://node7:7777,ws://node8:7777"
    volumes:
      - node4_data:/data

  node5:
    <<: *node-common
    container_name: node5
    environment:
      <<: *node-env
      NODE_SEED: "4e6f646535000000000000000000000000000000000000000000000000000005"
      NODE_NAME: node5
      EPHEMERAL_RELAYS: "ws://node1:7777,ws://node2:7777,ws://node3:7777,ws://node4:7777,ws://node6:7777,ws://node7:7777,ws://node8:7777"
    volumes:
      - node5_data:/data

  node6:
    <<: *node-common
    container_name: node6
    environment:
      <<: *node-env
      NODE_SEED: "4e6f646536000000000000000000000000000000000000000000000000000006"
      NODE_NAME: node6
      EPHEMERAL_RELAYS: "ws://node1:7777,ws://node2:7777,ws://node3:7777,ws://node4:7777,ws://node5:7777,ws://node7:7777,ws://node8:7777"
    volumes:
      - node6_data:/data

  node7:
    <<: *node-common
    container_name: node7
    environment:
      <<: *node-env
      NODE_SEED: "4e6f646537000000000000000000000000000000000000000000000000000007"
      NODE_NAME: node7
      EPHEMERAL_RELAYS: "ws://node1:7777,ws://node2:7777,ws://node3:7777,ws://node4:7777,ws://node5:7777,ws://node6:7777,ws://node8:7777"
    volumes:
      - node7_data:/data

  node8:
    <<: *node-common
    container_name: node8
    environment:
      <<: *node-env
      NODE_SEED: "4e6f646538000000000000000000000000000000000000000000000000000008"
      NODE_NAME: node8
      EPHEMERAL_RELAYS: "ws://node1:7777,ws://node2:7777,ws://node3:7777,ws://node4:7777,ws://node5:7777,ws://node6:7777,ws://node7:7777"
    volumes:
      - node8_data:/data

volumes:
  bitcoin_data:
  electrs_data:
  ldk_data:
  ledger_relay_data:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data:
  node6_data:
  node7_data:
  node8_data:

networks:
  cluster:
    driver: bridge
