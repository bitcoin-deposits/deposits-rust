# 4-operator overlay for deposits-node
#
# Add to your existing docker-compose:
#   docker-compose -f docker-compose.yml -f docker-compose.4op.yml up -d
#
# Setup:
#   1. Generate seeds:
#      for name in alice bob charlie diana; do
#        openssl rand -hex 32 > /mnt/bitcoind/deposits/$name/seed
#      done
#
#   2. Create access control files (optional):
#      echo "true" > /mnt/bitcoind/deposits/access_control
#      touch /mnt/bitcoind/deposits/deposit_allowlist.txt
#      touch /mnt/bitcoind/deposits/deposit_denylist.txt
#      echo "getalby.com" > /mnt/bitcoind/deposits/deposit_domain_allowlist.txt
#
#   3. Start: docker-compose -f docker-compose.yml -f docker-compose.4op.yml up -d

services:
  alice:
    image: deposits-node:latest
    container_name: alice
    restart: unless-stopped
    environment:
      NODE_SEED_FILE: /secrets/seed
      NETWORK: bitcoin
      ELECTRUM_URL: http://electrs:3000
      LEDGER_RELAY: wss://relay.ynniv.com
      EPHEMERAL_RELAYS: ws://bob:7777,ws://charlie:7777,ws://diana:7777
      NODE_NAME: alice
      RELAY_PORT: "7777"
      METRICS_PORT: "9100"
      DEPOSIT_ACCESS_CONTROL: "${DEPOSIT_ACCESS_CONTROL:-false}"
      ATTESTATION_VERIFIER_PUBKEY: "${ATTESTATION_VERIFIER_PUBKEY:-}"
      MAX_DEPOSIT_BALANCE_MSATS: "${MAX_DEPOSIT_BALANCE_MSATS:-0}"
    ports:
      - "7801:7777"
      - "9101:9100"
    volumes:
      - /mnt/bitcoind/deposits/alice/seed:/secrets/seed:ro
      - /mnt/bitcoind/deposits/alice/data:/data
      - /mnt/bitcoind/deposits/deposit_allowlist.txt:/config/deposit_allowlist.txt:ro
      - /mnt/bitcoind/deposits/deposit_denylist.txt:/config/deposit_denylist.txt:ro
      - /mnt/bitcoind/deposits/deposit_domain_allowlist.txt:/config/deposit_domain_allowlist.txt:ro
    depends_on:
      - electrs
    networks:
      - bitcoin-network

  bob:
