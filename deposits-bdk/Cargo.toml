[package]
name = "deposits-bdk"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Deposits Protocol - BDK + Nostr Implementation"
license = "MIT OR Apache-2.0"

[dependencies]
# Core protocol logic
deposits-core = { path = "../deposits-core" }

# Bitcoin
bitcoin = { version = "0.32", features = ["serde"] }
bdk_wallet = "1.0"
bdk_electrum = "0.20"
bdk_file_store = "0.18"

# Nostr for peer messaging
nostr-sdk = "0.37"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Error handling
thiserror = "1"

# Utilities
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
