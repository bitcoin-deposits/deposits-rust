[package]
name = "deposits-core"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Deposits Protocol - Core library (Lightning-implementation agnostic)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anthropics/deposits-rust"
keywords = ["bitcoin", "lightning", "custody", "deposits"]

[dependencies]
# Protocol definitions (types, messages, encoding)
deposits-protocol = { path = "../deposits-protocol", features = ["kaitai-parser"] }

# Bitcoin primitives (no Lightning dependencies!)
bitcoin = { version = "0.32", features = ["serde"] }
secp256k1 = { version = "0.29", features = ["serde"] }

# Hashing
sha2 = "0.10"

# Miniscript for flexible spending policies
miniscript = { version = "12", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "1.0"

# Hex encoding for debugging
hex = "0.4"

# Logging
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
